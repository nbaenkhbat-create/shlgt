// ===== Groq дуудлага: дараалалтай (нэг зэрэг нэг л хүсэлт) + 429 үед автоматаар хүлээгээд дахин оролдоно =====
// Groq-ийн qwen/qwen3.8-27b загвар минутын токены (TPM) хязгаар бага тул хүсэлтүүдийг зэрэг илгээвэл 429 гардаг.
let scanGroqChain = Promise.resolve();
let scanWaitNote = null; // (text) => void : хүлээлтийн мэдээг дэлгэцэнд харуулна
const scanSleep = (ms) => new Promise((r) => setTimeout(r, ms));

// "Please try again in 6.4s" / "in 1m5.5s" / "in 120ms" эсвэл retry-after header-ийг миллисекунд болгоно
const scanParseWait = (msg, hdr) => {
  const h = parseFloat(hdr);
  if (isFinite(h) && h > 0) return h * 1000;
  const m = /try again in\s+([0-9hms.]+)/i.exec(msg || '');
  if (!m) return 0;
  let t = m[1], ms = 0, x;
  if ((x = /(\d+(?:\.\d+)?)h/.exec(t))) ms += parseFloat(x[1]) * 3600000;
  if ((x = /(\d+(?:\.\d+)?)m(?!s)/.exec(t))) ms += parseFloat(x[1]) * 60000;
  if ((x = /(\d+(?:\.\d+)?)ms/.exec(t))) ms += parseFloat(x[1]);
  t = t.replace(/\d+(?:\.\d+)?ms/g, '');
  if ((x = /(\d+(?:\.\d+)?)s/.exec(t))) ms += parseFloat(x[1]) * 1000;
  return ms;
};

function scanCallGroq(model, content, useJsonMode, temperature, noInstruct, maxTokens) {
  const run = () => scanCallGroqCore(model, content, useJsonMode, temperature, noInstruct, maxTokens);
  const p = scanGroqChain.then(run, run);
  scanGroqChain = p.catch(() => {});
  return p;
}

async function scanCallGroqCore(model, content, useJsonMode, temperature, noInstruct, maxTok) {
  let maxTokens = maxTok || 6000;
  let instruct = !noInstruct;
  let tries429 = 0;
  for (;;) {
    // Qwen 3.8 анхдагчаар thinking горимд ажилладаг ба тэнд temperature 0–0.1 нь үсэг гажуулж, давтдаг.
    // OCR-д: instruct горим (reasoning_effort:'none') + дунд зэргийн temperature, top_p.
    const payload = { model, temperature: temperature == null ? 0.1 : temperature, top_p: 0.9, max_completion_tokens: maxTokens, messages: [{ role: 'user', content }] };
    if (instruct) payload.reasoning_effort = 'none';
    if (useJsonMode) payload.response_format = { type: 'json_object' };
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    let res, body;
    try {
      res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + SCAN_GROQ_KEY },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      body = await res.text();
    } finally { clearTimeout(timer); }
    let parsed = null;
    try { parsed = JSON.parse(body); } catch { parsed = null; }
    if (res.ok) return parsed;

    const errMsg = (parsed && parsed.error && parsed.error.message) || ('Groq алдаа ' + res.status);
    // reasoning_effort дэмжигдэхгүй бол түүнгүйгээр дахин оролдоно
    if (res.status === 400 && instruct && /reasoning/i.test(errMsg)) { instruct = false; continue; }

    if (res.status === 429 || res.status === 413) {
      // "Limit 8000, Used 3000, Requested 9500" -> нэг хүсэлт өөрөө минутын хязгаараас том бол гаралтын уртыг багасгана
      const lm = /Limit\s+(\d+)(?:,\s*Used\s+\d+)?,\s*Requested\s+(\d+)/i.exec(errMsg);
      if (lm) {
        const lim = +lm[1], req = +lm[2];
        if (req > lim) {
          const room = lim - (req - maxTokens) - 200;
          if (room >= 1200 && room < maxTokens) { maxTokens = room; continue; }
          // оруулсан зураг/текст өөрөө минутын хязгаараас том: хүлээгээд нэмэргүй -> дээд түвшин жижигрүүлнэ
          const e = new Error(errMsg); e.status = res.status; e.tooLarge = true; throw e;
        }
      } else if (res.status === 413) {
        const e = new Error(errMsg); e.status = 413; e.tooLarge = true; throw e;
      }
      if (/per day|\bTPD\b|\bRPD\b/i.test(errMsg)) {
        const e = new Error('Groq өдрийн хязгаар дууссан байна. Хэсэг хугацааны дараа (эсвэл маргааш) дахин оролдоно уу, эсвэл Groq account-аа Developer plan руу шилжүүлнэ үү.');
        e.status = 429; throw e;
      }
      if (res.status === 429 && tries429 < 5) {
        let wait = scanParseWait(errMsg, res.headers && res.headers.get && res.headers.get('retry-after'));
        if (!wait) wait = 8000 * (tries429 + 1);
        wait = Math.max(2500, wait + 600);
        if (wait > 75000) {
          const e = new Error('Groq хязгаарт хүрлээ (429). ' + Math.ceil(wait / 1000) + ' секунд хүлээх шаардлагатай байна. Түр хүлээгээд дахин оролдоно уу.');
          e.status = 429; throw e;
        }
        tries429++;
        if (scanWaitNote) { try { scanWaitNote('Groq хязгаар: ' + Math.ceil(wait / 1000) + ' сек хүлээж байна (' + tries429 + '/5)...'); } catch (_) {} }
        console.warn('Groq 429, waiting ' + wait + 'ms', errMsg);
        await scanSleep(wait);
        continue;
      }
    }
    const err = new Error(errMsg);
    err.status = res.status;
    throw err;
  }
}

// Зургийн (0..1000) хүрээгээр эх зургаас зураг таслана.
const scanCropBox = (dataUrl, box, maxW = 1100, padOverride) => new Promise((resolve) => {
  try {
    if (!Array.isArray(box) || box.length !== 4) return resolve('');
    let b = box.map(Number);
    if (b.some((v) => !isFinite(v))) return resolve('');
    if (Math.max.apply(null, b) <= 1.5) b = b.map((v) => v * 1000);
    let x0 = Math.min(b[0], b[2]), x1 = Math.max(b[0], b[2]);
    let y0 = Math.min(b[1], b[3]), y1 = Math.max(b[1], b[3]);
    const pad = padOverride == null ? 14 : padOverride;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(1000, x1 + pad); y1 = Math.min(1000, y1 + pad);
    const w = x1 - x0, h = y1 - y0;
    if (w < 20 || h < 20) return resolve('');
    const img = new Image();
    img.onload = () => {
      try {
        const sx = Math.round(x0 / 1000 * img.width), sy = Math.round(y0 / 1000 * img.height);
        const sw = Math.max(1, Math.round(w / 1000 * img.width)), sh = Math.max(1, Math.round(h / 1000 * img.height));
        let k = Math.min(1, maxW / sw), out = '';
        for (let tries = 0; tries < 5; tries++) {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', 0.88);
          if (out.length <= 380000) break;
          out = c.toDataURL('image/jpeg', 0.72);
          if (out.length <= 380000) break;
          k *= 0.8;
        }
        resolve(out.length <= 390000 ? out : '');
      } catch (e) { resolve(''); }
    };
    img.onerror = () => resolve('');
    img.src = dataUrl;
  } catch (e) { resolve(''); }
});



// ---------- Зураг боловсруулах туслахууд ----------
const scanGray = (img, maxDim) => {
  const k = Math.min(1, maxDim / Math.max(img.width, img.height));
  const W = Math.max(8, Math.round(img.width * k)), H = Math.max(8, Math.round(img.height * k));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
  return { W, H, g, k };
};
// Орон нутгийн дундажаас delta-аар харласан пиксел = бэх (сүүдэр, бүдэг ар талын үсэг орохгүй)
const scanInkMask = (g, W, H, delta) => {
  const ii = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += g[y * W + x]; ii[(y + 1) * (W + 1) + x + 1] = ii[y * (W + 1) + x + 1] + row; } }
  const R = Math.max(6, Math.round(Math.min(W, H) / 12));
  const ink = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const xa = Math.max(0, x - R), xb = Math.min(W, x + R + 1), ya = Math.max(0, y - R), yb = Math.min(H, y + R + 1);
    const m = (ii[yb * (W + 1) + xb] - ii[ya * (W + 1) + xb] - ii[yb * (W + 1) + xa] + ii[ya * (W + 1) + xa]) / ((xb - xa) * (yb - ya));
    if (g[y * W + x] < m - delta) ink[y * W + x] = 1;
  }
  return ink;
};
// Хуудасны гаднах хоосон хэсгийг (мод, даавуу) тайрна: модель зөвхөн хуудсыг өндөр нягтралаар харна.
const scanTrimPage = (c) => {
  try {
    const k = Math.min(1, 500 / Math.max(c.width, c.height));
    const t = document.createElement('canvas'); t.width = Math.round(c.width * k); t.height = Math.round(c.height * k);
    const tx = t.getContext('2d', { willReadFrequently: true }); tx.drawImage(c, 0, 0, t.width, t.height);
    const W = t.width, H = t.height, d = tx.getImageData(0, 0, W, H).data;
    const g = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) g[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
    const ink = scanInkMask(g, W, H, 45);
    const rows = new Float32Array(H), cols = new Float32Array(W);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (ink[y * W + x]) { rows[y]++; cols[x]++; }
    const first = (a, n, th) => { for (let i = 0; i < n - 3; i++) if (a[i] > th && a[i + 1] > th && a[i + 2] > th) return i; return 0; };
    const last = (a, n, th) => { for (let i = n - 1; i > 2; i--) if (a[i] > th && a[i - 1] > th && a[i - 2] > th) return i; return n - 1; };
    let y0 = first(rows, H, W * 0.015), y1 = last(rows, H, W * 0.015), x0 = first(cols, W, H * 0.015), x1 = last(cols, W, H * 0.015);
    const my = H * 0.03, mx = W * 0.03;
    y0 = Math.max(0, y0 - my); y1 = Math.min(H, y1 + my); x0 = Math.max(0, x0 - mx); x1 = Math.min(W, x1 + mx);
    if ((x1 - x0) * (y1 - y0) > 0.85 * W * H || x1 <= x0 || y1 <= y0) return c;
    const sx = Math.round(x0 / k), sy = Math.round(y0 / k), sw = Math.round((x1 - x0) / k), sh = Math.round((y1 - y0) / k);
    const o = document.createElement('canvas'); o.width = sw; o.height = sh;
    o.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
    return o;
  } catch (e) { return c; }
};

// Хуудас дээрх бүх зургийг (график, диаграм) пикселээр олно: урт шугамтай, 2 хэмжээст хэсгүүд
const scanFigureGroups = (pageUrl) => new Promise((resolve) => {
  const img = new Image();
  img.onerror = () => resolve({ groups: [] });
  img.onload = () => {
    try {
      const { W, H, g, k } = scanGray(img, 1400);
      const ink0 = scanInkMask(g, W, H, 30);   // бүдэг нимгэн шугам барихын тулд 40 -> 30
      const ink = new Uint8Array(W * H);        // 1px өргөсгөж, тасарсан шугамыг холбоно
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (ink0[y * W + x]) {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H) ink[ny * W + nx] = 1;
        }
      }
      const lab = new Int32Array(W * H), comps = [], st = [];
      for (let i = 0; i < W * H; i++) {
        if (!ink[i] || lab[i]) continue;
        const id = comps.length + 1; let x0 = W, y0 = H, x1 = 0, y1 = 0, n = 0;
        st.push(i); lab[i] = id;
        while (st.length) {
          const q = st.pop(), px = q % W, py = (q / W) | 0; n++;
          if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const nx = px + dx, ny = py + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const r = ny * W + nx; if (ink[r] && !lab[r]) { lab[r] = id; st.push(r); }
          }
        }
        comps.push({ x0, y0, x1, y1, n });
      }
      const M = Math.max(W, H);
      // зураг = хоёр чиглэлд хангалттай том (цэгэн зураас, үсэг, мөр биш), хуудас хэмжээний саад биш
      const big = comps.filter((q) => { const w = q.x1 - q.x0, h = q.y1 - q.y0;
        return Math.min(w, h) >= M * 0.025 && Math.max(w, h) >= M * 0.05 && w < W * 0.97 && h < H * 0.4 && q.n < W * H * 0.05; });
      const groups = big.map((q) => ({ x0: q.x0, y0: q.y0, x1: q.x1, y1: q.y1 }));
      const tg = M * 0.012, rowGap = W * 0.1;
      const near = (A, B) => {
        const gx = Math.max(A.x0 - B.x1, B.x0 - A.x1), gy = Math.max(A.y0 - B.y1, B.y0 - A.y1);
        if (gx <= tg && gy <= tg) return true;
        const oy = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0);
        return gx < rowGap && oy > 0.5 * Math.min(A.y1 - A.y0, B.y1 - B.y0);   // нэг мөрөнд (A–E графикууд)
      };
      let merged = true;
      while (merged) {
        merged = false;
        for (let a = 0; a < groups.length && !merged; a++) for (let e = a + 1; e < groups.length && !merged; e++) {
          if (near(groups[a], groups[e])) {
            const A = groups[a], B = groups[e];
            A.x0 = Math.min(A.x0, B.x0); A.y0 = Math.min(A.y0, B.y0); A.x1 = Math.max(A.x1, B.x1); A.y1 = Math.max(A.y1, B.y1);
            groups.splice(e, 1); merged = true;
          }
        }
      }
      const band = H * 0.04;
      groups.sort((a, b) => { const ra = Math.round(a.y0 / band), rb = Math.round(b.y0 / band); return ra !== rb ? ra - rb : a.x0 - b.x0; });
      resolve({ img, k, W, H, groups });
    } catch (e) { resolve({ groups: [] }); }
  };
  img.src = pageUrl;
});

// Олдсон бүлгийг (тэмдэглэгээний хамт) эх зургаас таслаж, ар талын бүдэг үсгийг цагаан болгоно
const scanCropGroup = (info, G) => {
  try {
    const img = info.img, k = info.k, w = img.width;
    const ml = w * 0.02, mt = w * 0.02, mr = w * 0.02, mb = w * 0.045;     // доод талд A–E үсэг
    const x0 = Math.max(0, Math.round(G.x0 / k - ml)), y0 = Math.max(0, Math.round(G.y0 / k - mt));
    const x1 = Math.min(img.width, Math.round(G.x1 / k + mr)), y1 = Math.min(img.height, Math.round(G.y1 / k + mb));
    const cw = x1 - x0, ch = y1 - y0; if (cw < 20 || ch < 20) return '';
    let kk = Math.min(1, 1100 / cw), out = '';
    for (let t = 0; t < 5; t++) {
      const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(cw * kk)); o.height = Math.max(1, Math.round(ch * kk));
      const oc = o.getContext('2d', { willReadFrequently: true }); oc.fillStyle = '#fff'; oc.fillRect(0, 0, o.width, o.height);
      oc.drawImage(img, x0, y0, cw, ch, 0, 0, o.width, o.height);
      const id = oc.getImageData(0, 0, o.width, o.height), d = id.data, hist = new Uint32Array(256);
      for (let i = 0; i < d.length; i += 4) hist[(d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8]++;
      let acc = 0, p = 255; const tot = o.width * o.height;
      for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= tot * 0.85) { p = v; break; } }
      const lo = p * 0.35, hi = p * 0.8;
      if (hi - lo > 20) for (let i = 0; i < d.length; i += 4) for (let ch2 = 0; ch2 < 3; ch2++) d[i + ch2] = Math.max(0, Math.min(255, (d[i + ch2] - lo) * 255 / (hi - lo)));
      oc.putImageData(id, 0, 0);
      out = o.toDataURL('image/jpeg', 0.88); if (out.length <= 380000) break;
      out = o.toDataURL('image/jpeg', 0.72); if (out.length <= 380000) break;
      kk *= 0.8;
    }
    return out.length <= 390000 ? out : '';
  } catch (e) { return ''; }
};


const SCAN_FIG_REFINE_PROMPT = 'This image is a rough crop from a Mongolian school exam paper. It contains a drawing / graph / diagram (possibly several small graphs in one row) and may also contain printed text lines, question numbers or option lists around it.\n' +
  'Return ONLY this JSON: {"box":[x0,y0,x1,y1]} = the TIGHTEST bounding box around the drawing(s) only, on a 0..1000 scale (0,0 = top-left of THIS image, 1000,1000 = bottom-right).\n' +
  'EXCLUDE every sentence, question number, option list and paragraph text. INCLUDE axis labels, numbers and letters that are part of the drawing itself (e.g. 35, 0, t,c, t0c, A, B, C, 1, 2, 3). If several graphs are in one row, the box covers the whole row of graphs. If the whole image is already only the drawing, return [0,0,1000,1000]. JSON only.';

// Эхний таслалтыг (хүрээ нь бага зэрэг том) моделээр дахин шалгаж, зөвхөн зургийг нь үлдээнэ.
const scanRefineCrop = async (cropUrl) => {
  try {
    const content = [{ type: 'text', text: SCAN_FIG_REFINE_PROMPT }, { type: 'image_url', image_url: { url: cropUrl } }];
    const res = await scanCallGroq(SCAN_GROQ_MODEL, content, true, 0.1, false, 200);
    const txt = res.choices && res.choices[0] && res.choices[0].message ? res.choices[0].message.content : '';
    const j = scanExtractJson(typeof txt === 'string' ? txt : JSON.stringify(txt || ''));
    if (!j || !Array.isArray(j.box) || j.box.length !== 4) return '';
    let b = j.box.map(Number);
    if (b.some((v) => !isFinite(v))) return '';
    if (Math.max.apply(null, b) <= 1.5) b = b.map((v) => v * 1000);
    const w = Math.abs(b[2] - b[0]), h = Math.abs(b[3] - b[1]);
    if (w < 150 || h < 100) return '';                 // хэт жижиг: найдваргүй
    if (w > 960 && h > 960) return cropUrl;            // аль хэдийн зөвхөн зураг
    return await scanCropBox(cropUrl, b, 1100, 12);
  } catch (e) { console.warn('scan refine skipped', e && e.message); return ''; }
};

// Хуудас бүрийн зургийг пикселээр олоод, моделийн жагсаалттай дарааллаар (тоо таарвал) эсвэл хамгийн ойрын байрлалаар холбоно.
const scanAttachFigures = async (mapped, figures, images, onStatus) => {
  let attached = 0;
  if (!Array.isArray(figures) || !figures.length || !images.length) return attached;
  const byImg = {};
  figures.slice(0, 12).forEach((f) => {
    if (!f) return;
    const idx = Math.max(1, Math.min(images.length, parseInt(f.image, 10) || 1)) - 1;
    (byImg[idx] = byImg[idx] || []).push(f);
  });
  for (const key of Object.keys(byImg)) {
    const idx = +key, figs = byImg[key];
    onStatus && onStatus('Зураг олж байна...');
    const info = await scanFigureGroups(images[idx]);
    const noGroups = !info.groups || !info.groups.length;
    let pairs;
    if (noGroups) pairs = figs.map((f) => [f, null]);
    else if (figs.length === info.groups.length) pairs = figs.map((f, i) => [f, info.groups[i]]);
    else {
      const used = new Set();
      pairs = figs.map((f) => {
        let b = Array.isArray(f.box) ? f.box.map(Number) : null;
        if (!b || b.length !== 4 || b.some((v) => !isFinite(v))) return [f, null];
        if (Math.max.apply(null, b) <= 1.5) b = b.map((v) => v * 1000);
        const cx = (b[0] + b[2]) / 2 / 1000 * info.W, cy = (b[1] + b[3]) / 2 / 1000 * info.H;
        let best = -1, bd = Infinity;
        info.groups.forEach((G, gi) => { if (used.has(gi)) return;
          const d = Math.hypot((G.x0 + G.x1) / 2 - cx, (G.y0 + G.y1) / 2 - cy); if (d < bd) { bd = d; best = gi; } });
        if (best < 0 || bd > info.H * 0.25) return [f, null];
        used.add(best); return [f, info.groups[best]];
      });
    }
    for (const [f, G] of pairs) {
      const nums = (Array.isArray(f.questions) ? f.questions : [f.questions]).map(Number).filter((v) => isFinite(v));
      const url = G ? scanCropGroup(info, G) : await scanCropBox(images[idx], f.box, 1100, 14);   // пиксел олохгүй бол моделийн хүрээгээр тайрна
      if (!url) continue;
      nums.forEach((n) => {
        const qi = (mapped.nums || []).indexOf(n);
        if (qi >= 0 && mapped.questions[qi] && !mapped.questions[qi].imageUrl) { mapped.questions[qi].imageUrl = url; attached++; }
      });
    }
  }
  return attached;
};

// Зургийн чиглэл: текст босоо биш (хажуу, урвуу) байвал зөв эргүүлнэ.
const scanRotateUrl = (url, deg) => new Promise((resolve) => {
  deg = ((Math.round((+deg || 0) / 90) * 90) % 360 + 360) % 360;
  if (!deg) return resolve(url);
  const img = new Image();
  img.onerror = () => resolve(url);
  img.onload = () => {
    try {
      const w = img.width, h = img.height, swap = deg === 90 || deg === 270;
      const c = document.createElement('canvas');
      c.width = swap ? h : w; c.height = swap ? w : h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.translate(c.width / 2, c.height / 2);
      ctx.rotate(deg * Math.PI / 180);
      ctx.drawImage(img, -w / 2, -h / 2);
      resolve(scanEncode(c, 0.9));
    } catch (e) { resolve(url); }
  };
  img.src = url;
});

// Жижиг хуулбараар моделээс "хэдэн градус эргүүлэх вэ" гэж асууна. Алдаа гарвал 0 (эргүүлэхгүй).
const scanDetectRotation = async (url) => {
  try {
    const small = await new Promise((resolve) => {
      const img = new Image();
      img.onerror = () => resolve('');
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.7));
      };
      img.src = url;
    });
    if (!small) return 0;
    const content = [
      { type: 'text', text: 'This is a photo of a printed exam page. By how many degrees must the photo be rotated CLOCKWISE so that the printed text reads upright and left-to-right? Answer with ONLY this JSON: {"rotation":0} where rotation is one of 0, 90, 180, 270. Use 0 if the text is already upright.' },
      { type: 'image_url', image_url: { url: small } }
    ];
    const res = await scanCallGroq(SCAN_GROQ_MODEL, content, true, 0.1, false, 80);
    const txt = res.choices && res.choices[0] && res.choices[0].message ? res.choices[0].message.content : '';
    const j = scanExtractJson(typeof txt === 'string' ? txt : JSON.stringify(txt || ''));
    const r = j ? parseInt(j.rotation, 10) : 0;
    return [0, 90, 180, 270].includes(r) ? r : 0;
  } catch (e) { console.warn('rotation check skipped', e && e.message); return 0; }
};

// ==== SCAN PURE HELPERS START ====
// Үг үсгийн алдааг API-гүйгээр засна: нэг тестэд 3+ удаа зөв бичигдсэн үгийг 1 удаа л таарсан, зөвхөн ө/о, ү/у, н/и, ш/щ, э/е, л/д, ъ/ь
// төстэй үсгээр л ялгаатай үгтэй харьцуулж засна.
const SCAN_CONF = { 'о': 'ө', 'ө': 'о', 'у': 'ү', 'ү': 'у', 'н': 'и', 'и': 'н', 'ш': 'щ', 'щ': 'ш', 'э': 'е', 'е': 'э', 'л': 'д', 'д': 'л', 'ъ': 'ь', 'ь': 'ъ' };
const SCAN_WORD_RE = /[А-Яа-яЁёӨөҮү]{4,}/g;
function scanConsensusFix(quiz) {
  if (!quiz) return 0;
  const visit = (fn) => {
    if (typeof quiz.passage === 'string') quiz.passage = fn(quiz.passage);
    (quiz.questions || []).forEach((q) => {
      if (!q) return;
      ['text', 'context'].forEach((k) => { if (typeof q[k] === 'string') q[k] = fn(q[k]); });
      ['left', 'right', 'options'].forEach((k) => {
        if (Array.isArray(q[k])) q[k] = q[k].map((o) => typeof o === 'string' ? fn(o)
          : (o && typeof o === 'object' && typeof o.text === 'string' ? Object.assign({}, o, { text: fn(o.text) }) : o));
      });
    });
  };
  const freq = new Map();
  visit((str) => { (str.match(SCAN_WORD_RE) || []).forEach((w) => { const k = w.toLowerCase(); freq.set(k, (freq.get(k) || 0) + 1); }); return str; });
  const fixMap = new Map();
  freq.forEach((c, w) => {
    if (c > 1) return;
    const ch = Array.from(w);
    for (let i = 0; i < ch.length; i++) {
      const alt = SCAN_CONF[ch[i]]; if (!alt) continue;
      const cand = ch.slice(0, i).join('') + alt + ch.slice(i + 1).join('');
      if ((freq.get(cand) || 0) >= 3) { fixMap.set(w, cand); break; }
    }
  });
  if (!fixMap.size) return 0;
  let n = 0;
  visit((str) => str.replace(SCAN_WORD_RE, (w) => {
    const t = fixMap.get(w.toLowerCase()); if (!t) return w;
    n++; return w[0] !== w[0].toLowerCase() ? t[0].toUpperCase() + t.slice(1) : t;
  }));
  return n;
}

// Хуудас бүрийн үр дүнг нэгтгэнэ (figures-ийн "image" индексийг хуудасны дугаараар тохируулна)
function scanMergePages(quizzes) {
  const m = { title: '', passage: '', questions: [], figures: [] };
  quizzes.forEach((q, i) => {
    if (!q) return;
    if (!m.title && q.title) m.title = q.title;
    if (!m.passage && q.passage) m.passage = q.passage;
    (Array.isArray(q.questions) ? q.questions : []).forEach((x) => m.questions.push(x));
    (Array.isArray(q.figures) ? q.figures : []).forEach((f) => { if (f) m.figures.push(Object.assign({}, f, { image: i + 1 })); });
  });
  return m;
}

// Урт текстийг мөрийн хязгаараар хэсэглэнэ (минутын token хязгаарт багтаах)
const scanSplitText = (t) => {
  t = String(t || '').slice(0, 30000);
  const LIM = 6000, out = []; let cur = '';
  t.split('\n').forEach((line) => { if (cur && (cur.length + line.length) > LIM) { out.push(cur); cur = ''; } cur += line + '\n'; });
  if (cur.trim()) out.push(cur);
  return out.map((x) => ({ img: null, text: x }));
};
const scanBuildContent = (part, imgUrl) => {
  const c = [{ type: 'text', text: SCAN_PROMPT + (part.text ? '\n\nThe test is given as TEXT. Parse this text with the same rules:\n<<<\n' + part.text + '\n>>>' : '') }];
  if (imgUrl) c.push({ type: 'image_url', image_url: { url: imgUrl } });
  return c;
};
// ==== SCAN PURE HELPERS END ====

const scanImgSize = (url) => new Promise((res) => { const i = new Image(); i.onload = () => res({ w: i.width, h: i.height }); i.onerror = () => res(null); i.src = url; });
const scanDownscale = (url, k) => new Promise((resolve) => {
  const img = new Image();
  img.onerror = () => resolve(url);
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
    resolve(scanEncode(c, 0.88));
  };
  img.src = url;
});

// Нэг OCR дуудлага (JSON горим -> бүтэлгүй бол энгийн горим)
async function scanOcrCall(content) {
  let parsed = null, lastErr = null, usedJson = true;
  for (const jsonMode of [true, false]) {
    try {
      parsed = await scanCallGroq(SCAN_GROQ_MODEL, content, jsonMode);
      usedJson = jsonMode; lastErr = null; break;
    } catch (e) {
      lastErr = e;
      console.warn('Groq scan', jsonMode ? 'json' : 'plain', e.message);
      if (e.name === 'AbortError') { lastErr = new Error('Groq хариу өгсөнгүй (хугацаа хэтэрлээ). Дахин оролдоно уу.'); break; }
      if (e.status === 401 || e.status === 403) throw new Error('Groq API key буруу эсвэл хаагдсан байна (' + e.status + ').');
      if (e.status === 429 || e.status === 413) throw e;
    }
  }
  if (!parsed) throw (lastErr || new Error('Groq-тэй холбогдож чадсангүй'));
  const ch = parsed.choices && parsed.choices[0];
  const txt = ch && ch.message ? ch.message.content : '';
  const quiz = scanExtractJson(typeof txt === 'string' ? txt : JSON.stringify(txt || ''));
  if (!quiz) throw new Error(ch && ch.finish_reason === 'length' ? 'Groq хариу хэт урт болж таслагдлаа. Хуудсыг хоёр хэсэг болгон зураглаж оролдоно уу.' : 'Groq хариуг уншиж чадсангүй. Дахин оролдоно уу.');
  return { quiz, usedJson };
}

// Нэг хуудас/хэсгийг уншина. Минутын token хязгаарт багтахгүй бол зургийг багасгаж дахин оролдоно.
async function scanReadPart(part) {
  let img = part.img || null;
  try {
    const r = await scanOcrCall(scanBuildContent(part, img));
    return { quiz: r.quiz, usedJson: r.usedJson, img };
  } catch (e) {
    if (!(e && e.tooLarge)) throw e;
    if (!img) throw new Error('Текст Groq-ийн минутын token хязгаарт багтсангүй. Файлыг богино хэсгээр нь хувааж оруулна уу.');
    for (const k of [0.72, 0.55]) {
      img = await scanDownscale(img, k);
      try {
        const r = await scanOcrCall(scanBuildContent(part, img));
        return { quiz: r.quiz, usedJson: r.usedJson, img };
      } catch (e2) { if (!(e2 && e2.tooLarge)) throw e2; }
    }
    throw new Error('Зураг Groq-ийн минутын token хязгаарт багтсангүй. Нэг зурагт цөөн асуулт багтаан авах эсвэл Groq plan-аа ахиулна уу.');
  }
}

// Нарийвчилсан шалгалт (үргэлж асна): зурагтай дахин тулгаж үг, үсэг, цифрийн алдааг олно.
// Token хэмнэхийн тулд загвар БҮТЭН JSON-г дахин бичихгүй, зөвхөн засварын жагсаалт ({id, old, new}) буцаана.
// Засвар бүрийг орон нутагт шалгаад (бага зэргийн өөрчлөлт л зөвшөөрнө) тестэд хэрэглэнэ.
const scanLev = (a, b) => {
  a = Array.from(a); b = Array.from(b);
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
};

// Тестийн бүх текстийг [id] мөр болгоно
const scanVerifyIndex = (quiz) => {
  const lines = [], map = [];
  const add = (id, txt, hint) => { txt = String(txt == null ? '' : txt).trim(); if (!txt) return; lines.push('[' + id + ']' + (hint || '') + ' ' + txt.replace(/\s*\n\s*/g, ' ')); map.push(id); };
  add('ti', quiz.title);
  add('p', String(quiz.passage || '').slice(0, 3000));
  (quiz.questions || []).forEach((q, i) => {
    if (!q) return;
    const h = q.n != null ? ' (№' + q.n + ')' : '';
    add(i + '.t', q.text, h);
    add(i + '.c', q.context);
    ['options', 'left', 'right'].forEach((k) => {
      if (!Array.isArray(q[k])) return;
      q[k].forEach((o, j) => add(i + '.' + k.charAt(0) + j, typeof o === 'string' ? o : (o && o.text)));
    });
  });
  return { text: lines.join('\n'), ids: new Set(map) };
};

const scanFieldGet = (quiz, id) => {
  if (id === 'ti') return typeof quiz.title === 'string' ? quiz.title : '';
  if (id === 'p') return typeof quiz.passage === 'string' ? quiz.passage : '';
  const m = /^(\d+)\.([tc]|[olr]\d+)$/.exec(id); if (!m) return null;
  const q = (quiz.questions || [])[+m[1]]; if (!q) return null;
  if (m[2] === 't') return typeof q.text === 'string' ? q.text : null;
  if (m[2] === 'c') return typeof q.context === 'string' ? q.context : null;
  const k = { o: 'options', l: 'left', r: 'right' }[m[2].charAt(0)], j = +m[2].slice(1);
  const arr = q[k]; if (!Array.isArray(arr) || arr[j] == null) return null;
  return typeof arr[j] === 'string' ? arr[j] : (arr[j] && typeof arr[j].text === 'string' ? arr[j].text : null);
};
const scanFieldSet = (quiz, id, val) => {
  if (id === 'ti') { quiz.title = val; return; }
  if (id === 'p') { quiz.passage = val; return; }
  const m = /^(\d+)\.([tc]|[olr]\d+)$/.exec(id); const q = (quiz.questions || [])[+m[1]];
  if (m[2] === 't') { q.text = val; return; }
  if (m[2] === 'c') { q.context = val; return; }
  const k = { o: 'options', l: 'left', r: 'right' }[m[2].charAt(0)], j = +m[2].slice(1);
  if (typeof q[k][j] === 'string') q[k][j] = val; else q[k][j] = Object.assign({}, q[k][j], { text: val });
};

// Загварын санал болгосон засварыг шалгаад хэрэглэнэ. Хэт том өөрчлөлт, зохиомол засварыг хаяна.
const scanApplyFixes = (quiz, fixes, ids) => {
  let n = 0;
  (Array.isArray(fixes) ? fixes : []).slice(0, 80).forEach((f) => {
    if (!f || typeof f.id !== 'string' || typeof f.old !== 'string' || typeof f.new !== 'string') return;
    const o = f.old.trim(), w = f.new.trim();
    if (!o || !w || o === w || o.length > 60 || w.length > 70 || !ids.has(f.id)) return;
    if (scanLev(o, w) > Math.max(2, Math.ceil(o.length * 0.4))) return;
    const cur = scanFieldGet(quiz, f.id);
    if (cur == null || cur.indexOf(o) < 0) return;
    scanFieldSet(quiz, f.id, cur.replace(o, () => w));
    n++;
  });
  return n;
};

async function scanVerifyPage(quiz, img) {
  const out = { quiz, fixed: 0, ok: false };
  try {
    if (!img || !quiz || !Array.isArray(quiz.questions) || !quiz.questions.length) { out.ok = true; return out; }
    const idx = scanVerifyIndex(quiz);
    const content = [{ type: 'text', text: SCAN_VERIFY_PROMPT + idx.text.slice(0, 24000) }, { type: 'image_url', image_url: { url: img } }];
    let res = null;
    for (const jsonMode of [true, false]) {
      try { res = await scanCallGroq(SCAN_GROQ_MODEL, content, jsonMode, 0.1, false, 1800); break; }
      catch (e) { if (e && (e.status === 429 || e.status === 413 || e.status === 401 || e.status === 403 || e.name === 'AbortError')) throw e; }
    }
    if (!res) return out;
    const txt = res.choices && res.choices[0] && res.choices[0].message ? res.choices[0].message.content : '';
    const j = scanExtractJson(typeof txt === 'string' ? txt : JSON.stringify(txt || ''));
    if (!j) return out;
    out.fixed = scanApplyFixes(quiz, j.fixes, idx.ids);
    out.ok = true;
  } catch (e) { console.warn('scan verify skipped', e && e.message); }
  return out;
}

async function scanGroqVisionQuiz(dataUrls, onStatus, passageOverride, extraText, opts) {
  scanWaitNote = onStatus || null;
  try { return await scanGroqVisionQuizInner(dataUrls, onStatus, passageOverride, extraText, opts || {}); }
  finally { scanWaitNote = null; }
}

// Token хэмнэсэн урсгал: нэг хуудас = нэг дуудлага. Эргэлт шалгах нь зөвхөн хэвтээ зурагт, нарийвчилсан шалгалт нь сонголтоор.
async function scanGroqVisionQuizInner(dataUrls, onStatus, passageOverride, extraText, opts) {
  const st = (t) => { onStatus && onStatus(t); };
  let images = (dataUrls || []).filter(Boolean).slice(0, SCAN_MAX_IMAGES);
  if (!images.length && !extraText) throw new Error('Зураг алга');
  let parts;
  if (images.length) {
    st('Зургийг бэлдэж байна...');
    images = await Promise.all(images.map(async (u) => {
      const sz = await scanImgSize(u);
      if (!sz || sz.w <= sz.h * 1.05) return u;          // босоо зураг: API дуудахгүй
      return scanRotateUrl(u, await scanDetectRotation(u));
    }));
    parts = images.map((u) => ({ img: u, text: '' }));
    if (extraText) parts[0].text = String(extraText).slice(0, 6000);
  } else {
    parts = scanSplitText(extraText);
  }
  const results = [];
  let verifyFixed = 0, verifySkipped = 0;
  for (let i = 0; i < parts.length; i++) {
    st(parts.length > 1 ? 'Хуудас ' + (i + 1) + ' / ' + parts.length + ' уншиж байна...' : (parts[i].img ? 'Зургийг уншиж байна...' : 'Файлыг уншиж байна...'));
    const r = await scanReadPart(parts[i]);
    if (opts.verify !== false && r.img) {
      st(parts.length > 1 ? 'Хуудас ' + (i + 1) + ' / ' + parts.length + ': үг үсэг, тоог нягталж байна...' : 'Үг үсэг, тоог нягталж байна...');
      const v = await scanVerifyPage(r.quiz, r.img);
      r.quiz = v.quiz; verifyFixed += v.fixed; if (!v.ok) verifySkipped++;
    }
    results.push(r.quiz);
  }
  st('Асуултуудыг эмхэлж байна...');
  const merged = scanMergePages(results);
  const fixed = scanConsensusFix(merged);
  if (fixed) console.info('scan: ' + fixed + ' үгийг автоматаар зассан');
  const mapped = scanMapQuiz(merged, passageOverride);
  if (!mapped.questions.length) throw new Error('Зургаас асуулт уншигдсангүй. Тод, бүтэн хуудас зургаарай.');
  mapped.spellFixed = fixed;
  mapped.verifyFixed = verifyFixed; mapped.verifySkipped = verifySkipped;
  if (images.length) {
    try {
      st('Зураг, схемийг таслаж байна...');
      mapped.figuresAttached = await scanAttachFigures(mapped, merged.figures, images, onStatus);
    } catch (e) { console.warn('scan figures skipped', e && e.message); }
  }
  return mapped;
}

function PhotoQuizStep({ onParsed, onManual, onBack, onTitle, variantCount, onVariantCountChange, currentVariantLabel }) {
  const [shots, setShots] = useState([]);
  const [docText, setDocText] = useState('');
  const [docName, setDocName] = useState('');
  const [busy, setBusy] = useState(false);
  const [reading, setReading] = useState(false);
  const [status, setStatus] = useState('');
  const [err, setErr] = useState('');
  const [camOn, setCamOn] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const shotsRef = useRef([]);
  const vLabel = currentVariantLabel || 'A';

  const setShotsKeep = (next) => {
    const arr = (typeof next === 'function' ? next(shotsRef.current) : next).slice(0, SCAN_MAX_IMAGES);
    shotsRef.current = arr;
    setShots(arr);
  };

  const stopCam = () => {
    if (streamRef.current && streamRef.current.getTracks) streamRef.current.getTracks().forEach(t => t.stop());
    streamRef.current = null; setCamOn(false);
  };
  useEffect(() => () => stopCam(), []);

  const startCam = async () => {
    setErr('');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
      streamRef.current = stream;
      setCamOn(true);
      setTimeout(() => { if (videoRef.current) videoRef.current.srcObject = stream; }, 50);
    } catch (e) { setErr('Камер нээгдсэнгүй: ' + (e?.message || '')); }
  };

  const addDataUrl = (url) => { if (url) setShotsKeep(s => [...s, url]); };

  const capture = () => {
    const v = videoRef.current; if (!v) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
    c.getContext('2d').drawImage(v, 0, 0);
    addDataUrl(scanEncode(scanClean(c), 0.92));
    stopCam();
  };

  const ingestFile = async (file) => {
    if (!file) return;
    setErr('');
    const name = file.name || '';
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(name);
    const isDocx = /\.docx$/i.test(name) || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    if (/\.doc$/i.test(name)) { setErr('Хуучин .doc дэмжигдэхгүй. Word дээр «Save as .docx» хийгээд оруулна уу.'); return; }
    if (isPdf) {
      setReading(true);
      try {
        const r = await scanPdfToImages(file, setStatus);
        setShotsKeep(s => [...s, ...r.images]);
        if (r.truncated) setErr('PDF ' + r.total + ' хуудастай. Эхний ' + r.images.length + ' хуудсыг авлаа.');
      } catch (e) { setErr(e?.message || 'PDF уншигдсангүй'); }
      finally { setReading(false); setStatus(''); }
      return;
    }
    if (isDocx) {
      setReading(true);
      try { setDocText(await scanDocxToText(file)); setDocName(name); }
      catch (e) { setErr(e?.message || 'Word уншигдсангүй'); }
      finally { setReading(false); }
      return;
    }
    const okType = !file.type || /^image\//i.test(file.type) || /\.(jpe?g|png|webp|gif|bmp)$/i.test(name);
    if (!okType) { setErr('Зураг (JPG/PNG), PDF эсвэл Word (.docx) оруулна уу'); return; }
    setReading(true);
    try {
      const raw = await scanReadFile(file);
      const compact = await scanCompress(raw, 2400, 0.9, false);
      addDataUrl(compact);
    } catch (e) { setErr(e?.message || 'Зураг уншигдсангүй'); }
    finally { setReading(false); }
  };

  const ingestFiles = async (fileList) => {
    const files = Array.from(fileList || []).slice(0, SCAN_MAX_IMAGES);
    for (const f of files) await ingestFile(f);
  };

  const runGroq = async () => {
    const imgs = shotsRef.current.filter(Boolean);
    if (!imgs.length && !docText) { setErr('Файл ороогүй байна. «Файл оруулах» эсвэл камераар авна уу.'); return; }
    setBusy(true); setErr(''); setStatus('Боловсруулж байна...');
    try {
      const quiz = await scanGroqVisionQuiz(imgs, setStatus, undefined, docText, { verify: true });
      if (onTitle && quiz.title) onTitle(quiz.title);
      onParsed(quiz.questions, quiz.title);
      const notes = [];
      if (quiz.verifyFixed) notes.push(quiz.verifyFixed + ' үг/тоог зурагтай тулгаж зассан');
      if (quiz.verifySkipped) notes.push('нарийвчилсан шалгалт ' + quiz.verifySkipped + ' хуудсанд хийгдсэнгүй (хязгаар эсвэл алдаа) тул үг үсгээ нягтлаарай');
      if (quiz.figuresAttached) notes.push(quiz.figuresAttached + ' асуултад зураг хавсаргалаа. Буруу таслагдсан бол асуулт дээрээ засна уу');
      if (notes.length) setStatus(notes.join('. ') + '.');
    } catch (e) { setErr(e?.message || 'Scan алдаа'); }
    finally { setBusy(false); }
  };

  return (
    <div>
      <div className="version-indicator" style={{marginBottom:16, flexWrap:'wrap'}}>
        <div className="version-indicator-icon">{vLabel}</div>
        <div className="version-indicator-text" style={{flex:'1 1 160px', minWidth:0}}>
          <div className="version-indicator-label">Хувилбар {vLabel} — Scan</div>
          <div className="version-indicator-sub">Зураг / PDF / Word файлаас онлайн тест болгоно.</div>
        </div>
        {(variantCount || 1) < 5 && (
          <button className="btn btn-outline btn-sm" onClick={() => onVariantCountChange && onVariantCountChange()} style={{flexShrink:0}}>➕ Хувилбар</button>
        )}
      </div>
      <div className="ai-hint-box">
        <div className="ai-icon">📷</div>
        <div className="ai-hint-text">
          <strong>Scan</strong> — Цаасан даалгаврын зураг, PDF эсвэл Word (.docx) файл оруулна. Бүгд ижил аргаар боловсрогдож, дараа нь засах форм нээгдэнэ.
        </div>
      </div>
      {busy ? (
        <div className="groq-proc">
          <div className="groq-proc-photo">
            {shots[0] ? <img src={shots[0]} alt="" /> : <div style={{fontSize:56,textAlign:'center'}}>📝</div>}
            <div className="groq-stamp">processing</div>
          </div>
          <div className="parsing-overlay" style={{padding:'28px 8px'}}>
            <div className="spinner" />
            <div style={{fontFamily:'Outfit',fontWeight:700}}>{status || 'Боловсруулж байна...'}</div>
            <div className="text-muted text-sm" style={{marginTop:8}}>Асуултуудыг форм руу бэлдэж байна</div>
          </div>
        </div>
      ) : (
        <>
          {camOn && (
            <div className="zg-preview-wrap" style={{marginBottom:12}}>
              <video ref={videoRef} autoPlay playsInline />
            </div>
          )}
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
            {!camOn

  );

const fileToCompressedDataUrl = (file, maxSide = 1600, quality = 0.86) => new Promise((resolve, reject) => {
  if (!file || !/^image\//.test(file.type)) { reject(new Error('Зөвхөн зураг сонгоно уу')); return; }
  const reader = new FileReader();
  reader.onerror = () => reject(new Error('Файл уншиж чадсангүй'));
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error('Зураг нээгдсэнгүй'));
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const out = c.toDataURL('image/jpeg', quality);
      resolve(out.length > 900000 ? c.toDataURL('image/jpeg', 0.7) : out);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

// Холбох асуултыг багш засах
function MatchEditor({ q, onChange }) {
  const left = q.left || [], opts = q.options || [];
  const arr = matchToArr(q.answer, left.length);
  const setLeft = (i, t) => onChange({ left: left.map((x, j) => j === i ? t : x) });
  const addLeft = () => { if (left.length >= 8) return; onChange({ left: [...left, ''], answer: matchFromArr([...arr, '']) || null }); };
  const delLeft = (i) => { if (left.length <= 2) return; onChange({ left: left.filter((_, j) => j !== i), answer: matchFromArr(arr.filter((_, j) => j !== i)) || null }); };
  const setRight = (i, t) => onChange({ options: opts.map((o, j) => j === i ? { ...o, text: t } : o) });
  const addRight = () => { if (opts.length >= 8) return; onChange({ options: [...opts, { key: 'ABCDEFGH'[opts.length], text: '' }] }); };
  const delRight = () => {
    if (opts.length <= 2) return;
    const gone = opts[opts.length - 1].key;
    onChange({ options: opts.slice(0, -1), answer: matchFromArr(arr.map(a => a === gone ? '' : a)) || null });
  };
  const setAns = (i, key) => { const next = arr.slice(); next[i] = key; onChange({ answer: matchFromArr(next) || null }); };
  return (
    <div style={{marginBottom:10}}>
      <div className="form-hint" style={{marginBottom:8}}>Зүүн талын зүйл бүрт баруун талаас зөв хариуг сонгоно. Сурагч хоорондоо холбоно.</div>
      <div className="form-label">Зүүн тал (1, 2, 3 ...)</div>
      {left.map((t, i) => (
        <div key={i} style={{display:'flex',gap:7,alignItems:'center',marginBottom:6}}>
          <div className="option-key">{i + 1}</div>
          <input className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}} placeholder={(i + 1) + '-р зүйл...'} value={t} onChange={e => setLeft(i, e.target.value)} />
          {left.length > 2 && <button type="button" className="btn btn-ghost btn-sm" onClick={() => delLeft(i)}>✕</button>}
        </div>
      ))}
      {left.length < 8 && <button type="button" className="btn btn-outline btn-sm" onClick={addLeft}>+ Зүүн тал нэмэх</button>}

      <div className="form-label" style={{marginTop:12}}>Баруун тал (А, Б, В ...)</div>
      {opts.map((o, i) => (
        <div key={o.key} style={{display:'flex',gap:7,alignItems:'center',marginBottom:6}}>
          <div className="option-key">{matchLabel(o.key)}</div>
          <MathField className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}} placeholder={matchLabel(o.key) + ' хариулт...'} value={o.text} onChange={e => setRight(i, e.target.value)} />
        </div>
      ))}
      <div style={{display:'flex',gap:8}}>
        {opts.length < 8 && <button type="button" className="btn btn-outline btn-sm" onClick={addRight}>+ Баруун тал нэмэх</button>}
        {opts.length > 2 && <button type="button" className="btn btn-ghost btn-sm" onClick={delRight}>− Сүүлийнхийг хасах</button>}
      </div>

      <div className="form-label" style={{marginTop:12}}>Зөв холболт</div>
      {left.map((t, i) => (
        <div key={i} className="answer-select-row" style={{marginBottom:6,flexWrap:'wrap'}}>
          <span className="answer-label" style={{minWidth:70}}>{i + 1}{t ? ' · ' + (t.length > 18 ? t.slice(0, 18) + '…' : t) : ''}</span>
          {opts.map(o => (
            <button type="button" key={o.key} className={'ans-btn' + (arr[i] === o.key ? ' selected' : '')}
              onClick={() => setAns(i, arr[i] === o.key ? '' : o.key)}>{matchLabel(o.key)}</button>
          ))}
        </div>
      ))}
    </div>
  );
}

// Сурагч холбох асуултад хариулах
function MatchPlayer({ q, value, onChange }) {
  const left = q.left || [], opts = q.options || [];
  const n = left.length;
  const arr = matchToArr(value, n);
  const pick = (i, key) => {
    const next = arr.slice();
    if (next[i] === key) next[i] = '';
    else { for (let j = 0; j < n; j++) if (next[j] === key) next[j] = ''; next[i] = key; }
    onChange(matchFromArr(next));
  };
  return (
    <div>
      <div style={{background:'var(--surface2)',border:'1.5px solid var(--border)',borderRadius:12,padding:'10px 14px',marginBottom:12}}>
        {opts.map(o => (
          <div key={o.key} style={{display:'flex',gap:10,padding:'4px 0',fontSize:'0.9rem'}}>
            <b style={{minWidth:22,color:'var(--violet)'}}>{matchLabel(o.key)}.</b><span><SeM t={o.text} /></span>
          </div>
        ))}
      </div>
      {left.map((t, i) => (
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',padding:'8px 0',borderBottom:'1px dashed var(--border)'}}>
          <div style={{fontSize:'0.92rem',flex:'1 1 160px'}}><b>{i + 1}.</b> <SeM t={t} /></div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {opts.map(o => (
              <button type="button" key={o.key} className={'ans-btn' + (arr[i] === o.key ? ' selected' : '')}
                onClick={() => pick(i, o.key)}>{matchLabel(o.key)}</button>
            ))}
          </div>
        </div>
      ))}
      <div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:8}}>
        Таны холболт: {arr.map((a, i) => (i + 1) + '→' + (a ? matchLabel(a) : '—')).join('  ')}
      </div>
    </div>
  );
}

// Дүнгийн хуудсанд холбох асуултын хариуг харуулах
function MatchReview({ q, ua }) {
  const left = q.left || [], opts = q.options || [];
  const got = matchToArr(ua, left.length), want = matchToArr(q.answer, left.length);
  const txt = (k) => { const o = opts.find(x => x.key === k); return k ? matchLabel(k) + (o && o.text ? ' (' + o.text + ')' : '') : '—'; };
  return (
    <div>
      {left.map((t, i) => {
        const ok = want[i] && got[i] === want[i];
        return (
          <div key={i} style={{fontSize:'0.85rem',padding:'4px 0'}}>
            <b>{i + 1}.</b> {t} → <span style={{color: want[i] ? (ok ? 'var(--green)' : 'var(--red)') : 'inherit',fontWeight:700}}>{txt(got[i])}</span>
            {want[i] && !ok && <span style={{color:'var(--green)'}}> · зөв: {txt(want[i])}</span>}
          </div>
        );
      })}
    </div>
  );
}

// Асуултын зургийг багш гараар тайрах (AI-ийн таслалт буруу байвал засна)
function ImageCropModal({ src, onApply, onClose }) {
  const imgRef = useRef(null);
  const [sel, setSel] = useState(null);       // {x0,y0,x1,y1} 0..1 (зургийн харьцаа)
  const [drag, setDrag] = useState(null);
  const getPt = (e) => {
    const r = imgRef.current.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || e;
    return { x: Math.max(0, Math.min(1, (t.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (t.clientY - r.top) / r.height)) };
  };
  const down = (e) => { e.preventDefault(); const p = getPt(e); setDrag(p); setSel({ x0: p.x, y0: p.y, x1: p.x, y1: p.y }); };
  const move = (e) => { if (!drag) return; e.preventDefault(); const p = getPt(e); setSel({ x0: Math.min(drag.x, p.x), y0: Math.min(drag.y, p.y), x1: Math.max(drag.x, p.x), y1: Math.max(drag.y, p.y) }); };
  const up = () => setDrag(null);
  const ok = sel && (sel.x1 - sel.x0) > 0.03 && (sel.y1 - sel.y0) > 0.03;
  const apply = () => {
    if (!ok) return;
    const img = imgRef.current;
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const sx = Math.round(sel.x0 * nw), sy = Math.round(sel.y0 * nh);
    const sw = Math.max(1, Math.round((sel.x1 - sel.x0) * nw)), sh = Math.max(1, Math.round((sel.y1 - sel.y0) * nh));
    let k = Math.min(1, 1400 / sw), out = '';
    for (let i = 0; i < 6; i++) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', 0.88);
      if (out.length > 380000) out = c.toDataURL('image/jpeg', 0.7);
      if (out.length <= 380000) break;
      k *= 0.8;
    }
    if (out.length > 390000) { alert('Зураг хэт том байна. Жижиг хэсэг сонгоно уу.'); return; }
    onApply(out);
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.72)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:12}} onClick={onClose}>
      <div style={{background:'#fff',borderRadius:14,padding:14,maxWidth:'min(96vw,900px)',maxHeight:'94vh',overflow:'auto',width:'100%'}} onClick={e => e.stopPropagation()}>
        <div style={{fontWeight:700,marginBottom:6}}>✂ Зураг тайрах</div>
        <div className="form-hint" style={{marginBottom:8}}>Хэрэгтэй хэсгийг хуруугаар / хулганаар чирж тэмдэглээд «Тайрах» дарна. Текст орсон бол зөвхөн зургийг нь сонгоно.</div>
        <div style={{position:'relative',display:'inline-block',maxWidth:'100%',lineHeight:0,touchAction:'none',userSelect:'none'}}
          onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
          onTouchStart={down} onTouchMove={move} onTouchEnd={up}>
          <img ref={imgRef} src={src} alt="" draggable={false} style={{maxWidth:'100%',maxHeight:'66vh',display:'block',border:'1px solid #ccc'}} />
          {sel && (sel.x1 > sel.x0) && (
            <div style={{position:'absolute',left:(sel.x0 * 100) + '%',top:(sel.y0 * 100) + '%',width:((sel.x1 - sel.x0) * 100) + '%',height:((sel.y1 - sel.y0) * 100) + '%',
              border:'2px dashed #7c3aed',background:'rgba(124,58,237,0.15)',boxShadow:'0 0 0 9999px rgba(0,0,0,0.45)',pointerEvents:'none'}} />
          )}
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:10,flexWrap:'wrap'}}>
          <button type="button" className="btn btn-outline btn-sm" onClick={() => setSel(null)} disabled={!sel}>Сонголт арилгах</button>
          <button type="button" className="btn btn-outline btn-sm" onClick={onClose}>Болих</button>
          <button type="button" className="btn btn-violet btn-sm" onClick={apply} disabled={!ok}>✂ Тайрах</button>
        </div>
      </div>
    </div>
  );
}

function QuestionEditor({ questions, onChange, defaultType = 'mcq', subjectFeatures = [] }) {
  const [cropIdx, setCropIdx] = useState(null);
  const setQ = (idx, field, val) => {
    const next = questions.map((q, i) => i === idx ? {...q, [field]: val} : q);
    onChange(next);
  };
  const setOpt = (qi, oi, val) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      const opts = (q.options || []).map((o, j) => j === oi ? {...o, text: val} : o);
      return {...q, options: opts};
    });
    onChange(next);
  };
  const changeType = (qi, type) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      return {
        ...q,
        type,
        left: type === 'match' ? ['', '', '', ''] : [],
        options: defaultOptionsForType(type),
        answer: null,
        numericAnswer: type === 'grid' ? (q.numericAnswer || '') : null
      };
    });
    onChange(next);
  };
  const addQ = () => {
    onChange([...questions, {
      ...seedQuestion(defaultType),
      id: questions.length + 1
    }]);
  };
  const removeQ = idx => onChange(questions.filter((_, i) => i !== idx).map((q, i) => ({...q, id: i + 1})));

  return (
    <div>
      {cropIdx != null && questions[cropIdx] && questions[cropIdx].imageUrl && (
        <ImageCropModal src={questions[cropIdx].imageUrl}
          onApply={(url) => { setQ(cropIdx, 'imageUrl', url); setCropIdx(null); }}
          onClose={() => setCropIdx(null)} />
      )}
      {questions.length > 0 && (
        <div className="source-box" style={{marginBottom:16}}>
          <label className="form-label" style={{color:'#92400e'}}>📖 Эх бичвэр (шалгалтын эхэнд харагдана · заавал биш)</label>

            placeholder="Дараах асуултууд хамаарах том эх бичвэрийг энд бичнэ. Хоосон бол харагдахгүй."
            value={questions[0].sourceText || ''} onChange={e => setQ(0, 'sourceText', e.target.value)} />
        </div>
      )}
      {questions.map((q, qi) => {
        const type = q.type || defaultType || 'mcq';
        return (
          <div className="question-item" key={qi} style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,gap:8,flexWrap:'wrap'}}>

              <select className="form-select" style={{width:'auto',padding:'4px 10px',fontSize:'0.8rem'}}
                value={type} onChange={e => changeType(qi, e.target.value)}>

                <option value="blank">Нөхөх (бичиж хариулах)</option>
                <option value="open">Задгай даалгавар (бичгээр)</option>
