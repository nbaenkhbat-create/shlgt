      const gb = normBlank(got);
      return gb.length > 0 && String(expected).split('|').map(normBlank).filter(Boolean).indexOf(gb) >= 0;
    }
    const g = String(got ?? '').trim().toUpperCase();
    const e = String(expected).trim().toUpperCase();
    if (type === 'grid') {
      const nz = (v) => String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');

/* ─── RESULT PAGE ────────────────────────────── */

/* ─── SETTINGS MODAL ─────────────────────────── */

/* ─── STATS STRIP ────────────────────────────── */

/* ─── MISC ───────────────────────────────────── */

.text-sm { font-size: 0.85rem; }

.flex-center { display: flex; align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }

/* ═══ DESIGN SYSTEM v3 — нэгдсэн токен ба компонентууд (хамгийн сүүлд ачаалагдана) ═══ */
:root {
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
  --h-btn: 40px; --h-btn-sm: 32px; --h-btn-lg: 48px; --h-input: 42px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --ring: 0 0 0 3px rgba(59,91,219,.22);
  --shadow: 0 1px 2px rgba(15,23,42,.05);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.14);
}
body { font-size: 15px; -webkit-font-smoothing: antialiased; }
h1 { font-size: 1.6rem; line-height: 1.25; } h2 { font-size: 1.3rem; line-height: 1.3; } h3 { font-size: 1.1rem; line-height: 1.35; } h4 { font-size: 1rem; }
.page-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; }

.btn-sm { min-height: var(--h-btn-sm); padding: 0 var(--sp-3); font-size: .8rem; border-radius: var(--r-sm); gap: 5px; }
.btn-lg { min-height: var(--h-btn-lg); padding: 0 var(--sp-5); font-size: 1rem; border-radius: var(--r-md); }
.btn:hover:not(:disabled) { transform: none !important; box-shadow: none !important; }
.btn:active:not(:disabled) { filter: brightness(.94); }
.btn:focus-visible { outline: none; box-shadow: var(--ring) !important; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn-violet:hover:not(:disabled) { background: #6d28d9; border-color: #6d28d9; }
.btn-green { background: var(--green); border-color: var(--green); color: #fff; }
.btn-green:hover:not(:disabled) { background: #047857; border-color: #047857; }
.btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-outline:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
.btn-red { background: var(--red-light); border-color: #fecaca; color: var(--red); }

/* Форм */
.form-group { margin-bottom: var(--sp-3); min-width: 0; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-3); }
.form-row > .form-group { margin-bottom: var(--sp-3); }
.form-label { display: block; margin-bottom: 6px; font-size: .8rem; font-weight: 600; color: var(--text2); }
.form-input, .form-select { min-height: var(--h-input); padding: 0 var(--sp-3); border: 1.5px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text); font: 400 .92rem 'DM Sans', sans-serif; width: 100%; }
.form-textarea { padding: 10px var(--sp-3); border: 1.5px solid var(--border); border-radius: var(--r-md); background: var(--surface); width: 100%; font: 400 .92rem/1.5 'DM Sans', sans-serif; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
.form-input:hover, .form-select:hover, .form-textarea:hover { border-color: #cbd5e1; }

/* Карт, модал, хүснэгт, бадж */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); }

.card-title { font-size: 1rem; font-weight: 700; }
.card-body { padding: var(--sp-4); }
.modal-overlay { padding: var(--sp-4); }
.modal { border-radius: var(--r-lg); box-shadow: var(--shadow-lg); max-width: 100%; }
.modal-head { padding: var(--sp-4); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.modal-body { padding: var(--sp-4); }
.modal-foot { padding: var(--sp-3) var(--sp-4); display: flex; justify-content: flex-end; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.tbl th { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); background: var(--surface2); padding: 10px 12px; white-space: nowrap; }
.tbl td { padding: 10px 12px; vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface2); }
.badge { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 10px; border-radius: 999px; font-size: .72rem; font-weight: 600; line-height: 1; white-space: nowrap; }
.topbar { height: 56px; box-shadow: none; }
.topbar-right { gap: var(--sp-2); }

/* Responsive */
img, svg, video, canvas { max-width: 100%; }
.card-body, .modal-body { overflow-wrap: anywhere; }
@media (max-width: 720px) {
  .container, .container-sm, .container-lg { padding: 0 var(--sp-3); }
  .topbar { padding: 0 var(--sp-3); }
  .topbar-user span:not(.avatar) { display: none; }
  .btn { min-height: 44px; } .btn-sm { min-height: 36px; padding: 0 var(--sp-3); }
  .form-input, .form-select { min-height: 46px; font-size: 16px; }
  .form-textarea { font-size: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { width: 100%; max-height: 92vh; border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .modal-foot > .btn { flex: 1 1 auto; }
  .card-header { flex-wrap: wrap; }
  .page-title { font-size: 1.3rem; }
  .tbl { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

/* ═══ Цэс: «⋯» болон доод навигац ═══ */

.more-item { min-height: 40px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; font: 500 .88rem 'DM Sans', sans-serif; color: var(--text); cursor: pointer; }
.more-item:hover, .more-item:focus-visible { background: var(--surface2); outline: none; }
.more-item.danger { color: var(--red); } .more-item.danger:hover { background: var(--red-light); }
.bnav { display: none; }
@media (max-width: 720px) {
  .hide-m { display: none !important; }
  .more-btn { width: 36px; }
  .more-menu { min-width: 200px; } .more-item { min-height: 46px; }
  .has-bnav { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .bnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bnav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border: 0; background: transparent; color: var(--text2); font: 600 .68rem 'DM Sans', sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .bnav-ic { font-size: 1.2rem; line-height: 1; }
  .bnav-item.on { color: var(--primary); }

}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── UTILS ────────────────────────────────────────────────────────────────────
const uid = () => (window.SESecurity ? SESecurity.secureUid(12) : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)));
const sanitizeText = (s, max) => (window.SESecurity ? SESecurity.sanitizeText(s, max) : String(s || '').slice(0, max || 500));
const escapeHtml = (s) => (window.SESecurity ? SESecurity.escapeHtml(s) : String(s || ''));

const getAuth = () => {
  const app = getFirebaseApp();
  if (!app) return null;
  try { return firebase.auth(app); } catch { return null; }
};

const getFunctions = () => {
  const app = getFirebaseApp();
  if (!app || !firebase.functions) return null;
  try {
    return app.functions('asia-southeast1');
  } catch {
    try { return firebase.functions(app); } catch { return null; }
  }
};

const ensureStudentAuth = async () => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй');
  // Reuse Safari/Chrome early warm promise when available
  if (window.__SE_AUTH_WARM__) {
    try {
      const u = await window.__SE_AUTH_WARM__;
      if (u || auth.currentUser) return auth.currentUser || u;
    } catch {}
  }
  try { if (auth.authStateReady) await auth.authStateReady(); } catch {}
  if (auth.currentUser) return auth.currentUser;
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch {}
  const cred = await auth.signInAnonymously();
  return cred.user;
};

/** Warm anonymous auth early so QR/code join is instant */
const prefetchStudentAuth = () => {
  try {
    if (window.__SE_AUTH_WARM__) return window.__SE_AUTH_WARM__;
    const p = ensureStudentAuth().catch(() => null);
    window.__SE_AUTH_WARM__ = p;
    return p;
  } catch { return Promise.resolve(null); }
};

const ensureTeacherAuth = () => {
  const auth = getAuth();
  const u = auth?.currentUser;
  if (!u || u.isAnonymous) return null;
  try { if (localStorage.getItem('se_role') === 'student') return null; } catch {}
  return u;
};

const teacherLoginToEmail = (login) => {
  const s = String(login || '').trim().toLowerCase();
  if (!s) return '';
  if (s.includes('@')) return s;
  return s.replace(/[^a-z0-9._-]/g, '') + '@smartexam.app';
};

const teacherSignIn = async (email, password) => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй. Интернетээ шалгана уу.');
  const cred = await auth.signInWithEmailAndPassword(teacherLoginToEmail(email), password);
  try {
    const r = (await withAuthRetry(() => getDb().ref('users/' + cred.user.uid + '/role').once('value'))).val();
    if (r === 'student') { await auth.signOut(); throw new Error('Энэ сурагчийн акаунт байна. Сурагчаар нэвтэрнэ үү.'); }
  } catch (e) { if (String(e.message).includes('сурагчийн')) throw e; }
  try { localStorage.setItem('se_role', 'teacher'); } catch {}
  return cred.user;
};

const teacherSignUp = async (email, password, displayName) => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй');
  const cred = await auth.createUserWithEmailAndPassword(String(email).trim(), password);
  if (displayName) {
    try { await cred.user.updateProfile({ displayName: sanitizeText(displayName, 80) }); } catch {}
  }
  try { localStorage.setItem('se_role', 'teacher'); } catch {}
  const db = getDb();
  if (db) {
    try {
      await withAuthRetry(() => db.ref('users/' + cred.user.uid).set({ role: 'teacher', name: sanitizeText(displayName || email.split('@')[0], 80) }));
      await db.ref('teachers/' + cred.user.uid).set({
        displayName: sanitizeText(displayName || email.split('@')[0], 80),
        email: String(email).trim().toLowerCase(),
        createdAt: new Date().toISOString()
      });
    } catch {}
  }
  return cred.user;
};

const teacherSignOut = async () => {
  const auth = getAuth();
  try { if (window.SESecurity) SESecurity.clearTeacherMeta(); localStorage.removeItem('se_role'); } catch {}
  if (auth) await auth.signOut();
};

// Дүгнэлтийг СЕРВЕР (server.js /api/grade) хийнэ: answerKeys хөтөч рүү огт ирэхгүй
const callGradeSubmission = async (payload) => {
  const u = getAuth()?.currentUser;
  if (!u) throw new Error('Нэвтрээгүй байна');
  const idToken = await u.getIdToken();
  const r = await fetch('/api/grade', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, idToken })
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('grade ' + r.status));
  return data;
};

const useLS = (key, init) => {
  const [val, setVal] = useState(() => {
    try {

const fmt = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const fmtDur = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
};

const answersEqual = (got, expected, type) => {
  if (expected == null || expected === '') return false;
  if (type === 'blank') {
    const gb = normBlank(got);
    return gb.length > 0 && String(expected).split('|').map(normBlank).filter(Boolean).indexOf(gb) >= 0;
  }
  const g = String(got ?? '').trim().toUpperCase();
  const e = String(expected).trim().toUpperCase();
  if (type === 'grid') {
    const nz = (v) => String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    const gn = nz(got), en = nz(expected);
    return gn.length > 0 && en.length > 0 && gn === en;
  }
  return g === e;
};

const downloadCSV = (filename, rows) => {

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.csv') ? filename : (filename + '.csv');
  document.body.appendChild(a);
  a.click();

};

const getExamVariantLabels = (exam) => {
  if (exam?.versions && typeof exam.versions === 'object' && !Array.isArray(exam.versions)) {
    const keys = Object.keys(exam.versions).filter(k => {
      const v = exam.versions[k];
      return Array.isArray(v) && v.length > 0;
    });
    if (keys.length) return keys.sort();
  }
  return normalizeVariants(exam)
    .filter(v => (v.questions || []).some(q => (q.text || '').trim()))
    .map(v => v.label || 'A');
};

const buildExamWithVariant = (roomExam, label) => {
  const labels = getExamVariantLabels(roomExam);
  let questions = [];
  if (roomExam?.versions?.[label]) {
    questions = unpackQuestions(roomExam.versions[label]);
  } else {
    const hit = normalizeVariants(roomExam).find(v => (v.label || 'A') === label);
    questions = hit?.questions || [];
  }
  const variantIndex = Math.max(0, labels.indexOf(label));
  return {
    id: roomExam.roomID || roomExam.id,
    title: roomExam.title,
    subject: roomExam.subject,
    subjectId: roomExam.subjectId,
    duration: examDurationOf(roomExam),
    passingScore: roomExam.passingScore,
    omrFormat: roomExam.omrFormat || 'mcq',
    omrMode: roomExam.omrMode || 'mcq',
    antiCheat: roomExam.antiCheat !== false,
    stopped: roomExam.stopped,
    maxAttempts: roomExam.maxAttempts > 0 ? roomExam.maxAttempts : 0,
    scoreMode: roomExam.scoreMode || 'best',
    variantLabel: label,
    variantIndex,
    questions
  };
};

    try { counts = JSON.parse(sessionStorage.getItem(storeKey) || '{}') || {}; } catch { counts = {}; }
    sorted.forEach(l => { if (counts[l] == null) counts[l] = 0; });
    const min = Math.min(...sorted.map(l => counts[l]));
    const pool = sorted.filter(l => counts[l] === min);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    counts[pick] = (counts[pick] || 0) + 1;
    try { sessionStorage.setItem(storeKey, JSON.stringify(counts)); } catch {}
    return pick;
  };

  if (!db || !roomId) return localBalancedPick();

  const ck = normalizeClassKey(classKey) || 'default';
  const key = studentVariantKey(roomId, studentName);
  const studentRef = roomRef(db, roomId).child('variantByStudent').child(ck).child(key);
  const allocRef = roomRef(db, roomId).child('variantAllocator').child(ck);

  try {
    const existingSnap = await studentRef.once('value');
    const existing = existingSnap.val();
    if (existing?.label && sorted.includes(existing.label)) return existing.label;

    const result = await allocRef.transaction(cur => {
      const base = (cur && typeof cur === 'object') ? cur : {};
      const old = { ...(base.counts || {}) };
      sorted.forEach(l => { if (old[l] == null) old[l] = 0; });
      const min = Math.min(...sorted.map(l => Number(old[l]) || 0));
      const pool = sorted.filter(l => (Number(old[l]) || 0) === min);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return {
        counts: { ...old, [pick]: (Number(old[pick]) || 0) + 1 },
        lastPick: pick,
        updatedAt: Date.now()
      };
    });

    // Compat SDK: Promise resolves to { committed, snapshot } — NOT (result, committed, snap)
    const committed = !!(result && result.committed);
    const snapVal = result?.snapshot?.val?.() || null;
    const pick = snapVal?.lastPick;
    if (!committed || !pick || !sorted.includes(pick)) {
      return localBalancedPick();
    }

    try {
      const authUid = getAuth()?.currentUser?.uid || null;
      await studentRef.set({
        label: pick,
        name: sanitizeText(studentName, 80),
        uid: authUid,
        at: firebase.database.ServerValue.TIMESTAMP
      });
    } catch {
      // Count already reserved; still return pick for this student
    }
    return pick;
  } catch (e) {
    console.warn('variant assign fallback', e);
    return localBalancedPick();
  }
};

const fetchExamRoomByCode = async (code) => {
  const roomId = (code || '').trim();
  if (!roomId) return Promise.reject(new Error('Тестийн код оруулна уу'));
  const db = getDb();
  if (!db) return Promise.reject(new Error('Интернет/Firebase холбогдоогүй. Дахин оролдоно уу.'));

  try {
    // Safari: use data prefetched during Babel compile
    const pre = window.__SE_QR_PREFETCH__;
    if (pre?.promise && pre.roomID === roomId) {
      const got = await pre.promise;
      window.__SE_QR_PREFETCH__ = null;
      if (got?.pack?.versions) {
        if (got.pack.stopped) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
        return normalizeRoomExam(roomId, got.pack);
      }
    }

    await ensureStudentAuth();

    const ref = roomRef(db, roomId);
    // Fast path: one node with everything students need (no answerKeys)
    const packSnap = await ref.child('clientPack').once('value');
    const pack = packSnap.val();
    if (pack?.versions) {
      if (pack.stopped) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
      return normalizeRoomExam(roomId, pack);
    }

    // Legacy rooms (no clientPack yet): few parallel reads only
    const [verSnap, metaSnaps] = await Promise.all([
      ref.child('versions').once('value'),
      Promise.all([
        ref.child('stopped').once('value'),
        ref.child('title').once('value'),
        ref.child('subject').once('value'),
        ref.child('subjectId').once('value'),
        ref.child('duration').once('value'),
        ref.child('passingScore').once('value'),
        ref.child('omrFormat').once('value'),
        ref.child('omrMode').once('value'),
        ref.child('ownerUid').once('value'),
        ref.child('createdAt').once('value'),
        ref.child('roomID').once('value')
      ])
    ]);
    const versions = verSnap.val();
    if (!versions) throw new Error('Тестийн код олдсонгүй. Багшийн өгсөн кодыг яг хуулж оруулна уу.');
    const [stoppedSnap, titleSnap, subjectSnap, subjectIdSnap, durationSnap, passSnap, omrFSnap, omrMSnap, ownerSnap, createdSnap, roomIdSnap] = metaSnaps;
    if (stoppedSnap.val()) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
    return normalizeRoomExam(roomId, {
      roomID: roomIdSnap.val() || roomId,
      title: titleSnap.val(),
      subject: subjectSnap.val(),
      subjectId: subjectIdSnap.val(),
      duration: durationSnap.val(),
      passingScore: passSnap.val(),
      omrFormat: omrFSnap.val(),
      omrMode: omrMSnap.val(),
      ownerUid: ownerSnap.val(),
      stopped: !!stoppedSnap.val(),
      createdAt: createdSnap.val(),
      versions
    });
  } catch (e) {
    const msg = e?.message || String(e);
    if (/PERMISSION_DENIED|permission.?denied/i.test(msg)) {
      throw new Error('Шалгалт унших зөвшөөрөлгүй. Хуудсаа дахин ачааллаад QR-аа дахин уншуулна уу.');
    }
    throw e;
  }
};

      else if (code === 'auth/configuration-not-found') setErr('Firebase Authentication идэвхгүй байна.');
      else setErr(e?.message || 'Нэвтрэхэд алдаа');

  return (

const LETTER_KEY = (ch) => {
  const u = String(ch || '').trim().charAt(0);
  const map = { А: 'A', Б: 'B', В: 'C', Г: 'D', а: 'A', б: 'B', в: 'C', г: 'D', Д: 'E', д: 'E', Е: 'E', е: 'E' };
  if (map[u]) return map[u];
  const U = u.toUpperCase();
  return 'ABCDE'.includes(U) ? U : null;
};

const rebuildPdfPageText = (items, pageWidth) => {
  const mid = (pageWidth || 0) / 2;
  const xs = (items || []).map((it) => it.transform[4]);
  const hasCols = pageWidth && xs.filter((x) => x > mid + 18).length > items.length * 0.22
    && xs.filter((x) => x < mid - 18).length > items.length * 0.22;
  const group = (list) => {
    const rows = [];
    (list || []).forEach((it) => {
      const str = it.str == null ? '' : String(it.str);
      if (!str) return;
      const x = it.transform[4];
      const y = it.transform[5];
      const h = Math.abs(it.height || it.transform[3] || 10);
      const tol = Math.max(2.4, h * 0.42);
      let row = rows.find((r) => Math.abs(r.y - y) < tol);
      if (!row) { row = { y, parts: [] }; rows.push(row); }
      row.parts.push({ x, w: it.width || 0, str });
    });
    rows.sort((a, b) => b.y - a.y);
    return rows.map((r) => {
      r.parts.sort((a, b) => a.x - b.x);
      let s = '';
      let prev = null;
      r.parts.forEach((p) => {
        if (prev && p.x > prev.x + (prev.w || 0) + 1.1 && !/\s$/.test(s) && !/^\s/.test(p.str)) s += ' ';
        s += p.str;
        prev = p;
      });
      return s.replace(/[ \t]+/g, ' ').trim();
    }).filter(Boolean);
  };
  if (!hasCols) return group(items).join('\n');
  const left = items.filter((it) => it.transform[4] < mid);
  const right = items.filter((it) => it.transform[4] >= mid);
  const rightRows = group(right);
  const avgRight = rightRows.length ? rightRows.reduce((t, r) => t + r.length, 0) / rightRows.length : 0;
  // Баруун талд "B. 20" шиг богино сонголтууд л байвал энэ нь 2 багана биш — мөрийг нь хэвээр нь авна
  if (avgRight < 22) return group(items).join('\n');
  return group(left).join('\n') + '\n' + rightRows.join('\n');
};

const extractPdfText = async (file, onPage) => {
  if (!window.pdfjsLib) throw new Error('PDF сан ачаалагдаагүй. Хуудсыг дахин ачаална уу.');
  if (file.size > 40e6) throw new Error('Файл 40 MB-аас бага байх ёстой.');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    if (onPage) onPage(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const vp = page.getViewport({ scale: 1 });
    const items = (tc.items || []).filter((it) => !(/^\d{1,3}$/.test(String(it.str || '').trim()) && it.transform[5] < vp.height * 0.05));
    pages.push(rebuildPdfPageText(items, vp.width));
  }
  const txt = pages.join('\n\n').replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').trim();
  if (txt.replace(/\s/g, '').length < 12) {
    throw new Error('Энэ PDF-ээс текст олдсонгүй (скан/зураг байж магадгүй). Текстэн PDF эсвэл текстийг copy-paste хийнэ үү.');
  }
  return txt;
};


// ─── PDF-ийн зураг / диаграммыг асуулт бүрт автоматаар таслан хавсаргах ────────
// Арга: хуудсыг canvas дээр зурна → текстийн хайрцгуудыг цайруулна → үлдсэн "бэх" = зураг/диаграмм/хүснэгт.
// Асуултын дугаар ("1.", "2." ...) нь хуудасны зүүн захад байх тул түүгээр асуултын мужийг тогтооно.
const PDF_FIG_SCALE = 2;
const extractPdfFigures = async (file, onPage) => {
  if (!window.pdfjsLib) return {};
  if (file.size > 40e6) return {};
  const S = PDF_FIG_SCALE;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const parts = {};            // n -> [canvas, ...]
  let last = 0;
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

  for (let p = 1; p <= pdf.numPages; p++) {
    if (onPage) onPage(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: S });
    const W = Math.ceil(vp.width), H = Math.ceil(vp.height);
    const tc = await page.getTextContent();
    const boxes = (tc.items || []).filter((it) => it.str != null && String(it.str).trim()).map((it) => {
      const t = it.transform;
      const fs = Math.abs(it.height) || Math.hypot(t[2], t[3]) || 10;
      const pt = vp.convertToViewportPoint(t[4], t[5]);
      const w = (it.width || 0) * S;
      return { str: String(it.str).trim(), x0: pt[0] - 2, x1: pt[0] + w + 2, y0: pt[1] - fs * S - 2, y1: pt[1] + fs * S * 0.35 + 2 };
    });
    if (!boxes.length) { page.cleanup(); continue; }

    // "Хоёрдугаар хэсэг" эхэлбэл сонгох даалгавар дууссан гэж үзнэ
    if (last > 0 && boxes.some((b) => /хоёрдугаар\s+хэсэг|бүтээх\s+даалгавар/i.test(b.str))) { page.cleanup(); break; }

    const topY = H * 0.07, botY = H * 0.905;
    const minX = Math.min(...boxes.map((b) => b.x0));
    const anchors = [];
    boxes.forEach((b) => {
      const m = b.str.match(/^(\d{1,3})\.(?:\s|$)/);
      if (m && b.x0 <= minX + 30 * S && b.y0 < botY) anchors.push({ n: +m[1], y: b.y0 });
    });
    anchors.sort((a, b) => a.y - b.y);
    const prevLast = last;
    const valid = [];
    anchors.forEach((a) => {
      if (a.n === last + 1 || (last > 0 && a.n === last + 2)) { valid.push(a); last = a.n; }
    });

    const segs = [];
    if (prevLast > 0 && (!valid.length || valid[0].n === prevLast + 1 || valid[0].n === prevLast + 2) && !anchors.some((a) => a.n === 1 && prevLast >= 8 && !valid.some((v) => v.n === 1))) {
      segs.push({ n: prevLast, y0: topY, y1: valid.length ? valid[0].y - 2 : botY });
    }
    valid.forEach((a, i) => segs.push({ n: a.n, y0: a.y - 4, y1: i + 1 < valid.length ? valid[i + 1].y - 2 : botY }));
    if (!segs.length) { page.cleanup(); continue; }

    const canvas = mk(W, H);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;

    // Текстийг цайруулсан хуулбар
    const mask = mk(W, H);
    const mctx = mask.getContext('2d', { willReadFrequently: true });
    mctx.drawImage(canvas, 0, 0);
    mctx.fillStyle = '#fff';
    boxes.forEach((b) => mctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0));
    const data = mctx.getImageData(0, 0, W, H).data;

    segs.forEach((sg) => {
      const y0 = Math.max(0, Math.floor(sg.y0)), y1 = Math.min(H, Math.floor(sg.y1));
      if (y1 - y0 < 20) return;
      const rows = new Array(y1 - y0).fill(0), cols = new Array(W).fill(0);
      let total = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = 0; x < W; x++) {
          if (data[(y * W + x) * 4] < 215) { rows[y - y0]++; cols[x]++; total++; }
        }
      }
      if (total < 250) return;
      let ry0 = rows.findIndex((v) => v >= 3), ry1 = rows.length - 1 - [...rows].reverse().findIndex((v) => v >= 3);
      let rx0 = cols.findIndex((v) => v >= 3), rx1 = cols.length - 1 - [...cols].reverse().findIndex((v) => v >= 3);
      if (ry0 < 0 || rx0 < 0) return;
      let bb = { x0: rx0, x1: rx1, y0: y0 + ry0, y1: y0 + ry1 };
      if (bb.x1 - bb.x0 < 40 || bb.y1 - bb.y0 < 24) return;
      // Сонголтын үсэг (A. B. C. ...) зураг дотор байрласан, хажууд нь бичвэргүй бол хамт авна
      boxes.forEach((b) => {
        if (!/^(?:[A-EА-Е][.)]?\s*)+$/.test(b.str) || b.y0 < y0 || b.y1 > y1) return;
        const hasText = boxes.some((o) => o !== b && o.x0 >= b.x1 - 2 && o.x0 - b.x1 < 14 * S && o.y1 > b.y0 && o.y0 < b.y1 && (o.y1 - o.y0) >= 0.85 * (b.y1 - b.y0) && (/[А-Яа-яӨөҮү]{2}/.test(o.str) || /^[\d.,\s]+$/.test(o.str)));
        if (hasText) return;
        bb = { x0: Math.min(bb.x0, b.x0), x1: Math.max(bb.x1, b.x1), y0: Math.min(bb.y0, b.y0), y1: Math.max(bb.y1, b.y1) };
      });
      // Зурагт хамаарах богино шошго/тэнхлэгийн бичвэрийг (ойролцоо байгааг) хамт авна
      const gap = 10 * S;
      for (let it = 0; it < 1; it++) {
        let grew = false;
        boxes.forEach((b) => {
          if (b.x1 - b.x0 > W * 0.3 || b.str.length > 40) return;
          if (b.y1 < y0 || b.y0 > y1) return;
          if (/^\d{1,3}\.$/.test(b.str) && b.x0 <= minX + 12 * S) return;
          if ((b.y0 + b.y1) / 2 < bb.y0 - 4) return;
          const near = b.x1 >= bb.x0 - gap && b.x0 <= bb.x1 + gap && b.y1 >= bb.y0 - gap && b.y0 <= bb.y1 + gap;
          if (near && (b.x0 < bb.x0 || b.x1 > bb.x1 || b.y0 < bb.y0 || b.y1 > bb.y1)) {
            bb = { x0: Math.min(bb.x0, b.x0), x1: Math.max(bb.x1, b.x1), y0: Math.max(y0, Math.min(bb.y0, b.y0)), y1: Math.min(y1, Math.max(bb.y1, b.y1)) };
            grew = true;
          }
        });
        if (!grew) break;
      }
      const pad = 8;
      let cx0 = Math.max(0, Math.floor(bb.x0 - pad)), cx1 = Math.min(W, Math.ceil(bb.x1 + pad));
      let cy0 = Math.max(y0, Math.floor(bb.y0 - pad)), cy1 = Math.min(y1, Math.ceil(bb.y1 + pad));
      // Зурагтай хамт хавсрах ёсгүй (асуултын/сонголтын) мөрийг хайчилж таслахгүйн тулд захыг нь ухраана
      boxes.forEach((b) => {
        const cxm = (b.x0 + b.x1) / 2, cym = (b.y0 + b.y1) / 2;
        const insideBB = cxm >= bb.x0 && cxm <= bb.x1 && cym >= bb.y0 && cym <= bb.y1;
        if (insideBB) return;
        const hOverlap = b.x1 > cx0 && b.x0 < cx1, vOverlap = b.y1 > cy0 && b.y0 < cy1;
        if (hOverlap && vOverlap) {
          if (cym < bb.y0) cy0 = Math.max(cy0, Math.ceil(b.y1) + 1);
          else if (cym > bb.y1) cy1 = Math.min(cy1, Math.floor(b.y0) - 1);
          else if (cxm < bb.x0) cx0 = Math.max(cx0, Math.ceil(b.x1) + 1);
          else if (cxm > bb.x1) cx1 = Math.min(cx1, Math.floor(b.x0) - 1);
        }
      });
      if (cx1 - cx0 < 30 || cy1 - cy0 < 20) return;
      const crop = mk(cx1 - cx0, cy1 - cy0);
      crop.getContext('2d').drawImage(canvas, cx0, cy0, cx1 - cx0, cy1 - cy0, 0, 0, cx1 - cx0, cy1 - cy0);
      (parts[sg.n] = parts[sg.n] || []).push(crop);
    });
    page.cleanup();
  }

  const out = {};
  Object.keys(parts).forEach((k) => {
    const list = parts[k];
    const w = Math.max(...list.map((c) => c.width));
    const h = list.reduce((t, c) => t + c.height + 6, -6);
    const full = mk(w, h);
    const fctx = full.getContext('2d');
    fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, w, h);
    let yy = 0;
    list.forEach((c) => { fctx.drawImage(c, 0, yy); yy += c.height + 6; });
    const maxW = 820;
    const sc = Math.min(1, maxW / w);
    const fin = mk(w * sc, h * sc);
    const g = fin.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, fin.width, fin.height);
    g.drawImage(full, 0, 0, fin.width, fin.height);
    let q = 0.82, url = fin.toDataURL('image/jpeg', q);
    while (url.length > 380000 && q > 0.4) { q -= 0.1; url = fin.toDataURL('image/jpeg', q); }
    if (url.length <= 390000) out[k] = url;
  });
  return out;
};

const extractInlineOptions = (line) => {
  const re = /(?:^|\s)([A-DА-Гa-dа-г])[.)]\s+/g;
  const matches = [...String(line).matchAll(re)];
  if (matches.length < 2) return null;
  const parts = [];
  matches.forEach((m, i) => {
    const key = LETTER_KEY(m[1]);
    const start = m.index + m[0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : line.length;
    if (key) parts.push({ key, text: String(line).slice(start, end).trim() });
  });
  return parts.length >= 2 ? parts : null;
};

// ─── Холбох дасгал: PDF-ээс таних туслахууд ─────────────────────────────────
const MATCH_TRIGGER_RE = /холбо[нж]|холбох|тохируул|харгалзуул|нийцүүл|хослуул|тааруул|match|definitions?|to their definition/i;
const matchKey = (ch) => {
  const u = String(ch || '').trim().charAt(0).toUpperCase();
  if (!u) return null;
  const i = 'АБВГДЕЖЗ'.indexOf(u);
  if (i >= 0) return 'ABCDEFGH'[i];

};
const MATCH_PAIR_ROW_RE = /^\s*(\d{1,2})\s*[.)．]\s*(.+?)\s+([А-ЗA-Hа-зa-h])\s*[.)．]\s+(.+)$/;
const MATCH_LEFT_RE = /^\s*(\d{1,2})\s*[.)．:]\s*(.+)$/;
const MATCH_RIGHT_RE = /^\s*([А-ЗA-Hа-зa-h])\s*[.)．]\s*(.+)$/;
const parseMatchAnswerToken = (token, n) => {
  const t = String(token || '');
  if (!n) return null;
  const arr = Array(n).fill('');
  const L = '[A-HА-Зa-hа-з]';
  let found = 0;
  for (const m of t.matchAll(new RegExp('(\\d{1,2})\\s*[-–—=:)]*\\s*(' + L + ')(?![A-Za-zА-Яа-яӨөҮү])', 'g'))) {
    const i = +m[1] - 1, k = matchKey(m[2]);
    if (i >= 0 && i < n && k) { arr[i] = k; found++; }
  }
  if (!found) {
    for (const m of t.matchAll(new RegExp('(' + L + ')\\s*[-–—=:)]\\s*(\\d{1,2})', 'g'))) {
      const i = +m[2] - 1, k = matchKey(m[1]);
      if (i >= 0 && i < n && k) { arr[i] = k; found++; }
    }
  }
  if (!found) {
    const letters = [...t.matchAll(new RegExp(L, 'g'))].map((m) => matchKey(m[0])).filter(Boolean);
    if (letters.length === n) letters.forEach((k, i) => { arr[i] = k; found++; });
  }

};
const checkMatchStart = (cur) => {
  if (cur && !cur._matching && !cur._matchOff && cur.type === 'mcq' && !cur.options.length && MATCH_TRIGGER_RE.test(cur.text || '')) {
    cur.type = 'match'; cur.left = []; cur.right = []; cur._matching = true; cur._side = '';
  }
};
// Холбох горимд мөр уншина. true буцаавал мөр хэрэглэгдсэн.
const consumeMatchLine = (cur, line) => {
  let m;
  const pushRight = (letter, text) => {
    const key = matchKey(letter);
    if (!key || cur.right.some((o) => o.key === key)) return false;
    cur.right.push({ key, text: (text || '').trim() }); cur._side = 'r'; return true;
  };
  if ((m = line.match(MATCH_PAIR_ROW_RE)) && +m[1] === cur.left.length + 1 && matchKey(m[3])) {
    if (pushRight(m[3], m[4])) { cur.left.push(m[2].trim()); return true; }
  }
  if ((m = line.match(MATCH_LEFT_RE))) {
    const n = +m[1];
    const isNextQ = n === cur.n + 1;
    const isNextLeft = n === cur.left.length + 1;
    let asLeft = false;
    if (cur._matching && n >= 1 && n <= 20) asLeft = true;
    else if (isNextLeft && !isNextQ) asLeft = true;
    else if (isNextLeft && isNextQ) asLeft = !(cur.right.length > 0 && cur.right.length >= cur.left.length && cur.left.length >= 2);
    if (asLeft) { cur.left.push(m[2].trim()); cur._side = 'l'; return true; }
    return false;
  }
  if ((m = line.match(MATCH_RIGHT_RE)) && matchKey(m[1])) {
    if (pushRight(m[1], m[2])) return true;
  }
  if (cur.left.length || cur.right.length) {
    if (cur._side === 'l') cur.left[cur.left.length - 1] = (cur.left[cur.left.length - 1] + ' ' + line).trim();
    else if (cur.right.length) cur.right[cur.right.length - 1].text = (cur.right[cur.right.length - 1].text + ' ' + line).trim();
    return true;
  }
  return false;
};
const finishMatchQuestion = (q) => {
  if (!q._matching) return;
  const right = (q.right || []).slice().sort((a, b) => a.key.localeCompare(b.key));
  if ((q.left || []).length >= 2 && right.length >= 2) {
    q.type = 'match'; q.options = right; q.numericAnswer = null;
  } else {
    q.type = 'mcq'; q.options = right; q.left = [];
  }
  delete q.right; delete q._matching; delete q._side; delete q._matchOff;
};

// Үнэн / Худал хариултыг A (үнэн) / B (худал) болгоно
const tfToken = (v) => {
  const t = String(v == null ? '' : v).trim().toLowerCase().replace(/[.!)\s]+$/g, '');
  if (/^(?:зөв|үнэн|true|t|т|a|а|\+|✓|✔|тийм|yes)$/.test(t)) return 'A';
  if (/^(?:буруу|худал|false|f|ф|b|б|х|-|✗|✘|үгүй|no)$/.test(t)) return 'B';
  return null;
};

const applyAnswerToken = (q, token) => {
  if (!q || token == null) return;
  const t = String(token).trim();
  if (q.type === 'match') {
    const a = parseMatchAnswerToken(t, (q.left || []).length);
    if (a) q.answer = a;
    return;
  }
  if (q.type === 'blank') {
    const a = t.replace(/^[«"“]+|[»"”]+$/g, '').trim();
    if (a) q.answer = a.slice(0, 200);
    return;
  }
  if (q.type === 'tf') {
    const v = tfToken(t);
    if (v) q.answer = v;
    return;
  }
  const letter = LETTER_KEY(t);
  if (letter) { q.answer = letter; return; }
  const digits = t.replace(/[_\s]/g, '').replace(/[^\d.-]/g, '');
  if (/^-?\d+(\.\d+)?$/.test(digits) && !(q.options || []).some((o) => o.text)) {
    q.type = 'grid';
    q.numericAnswer = digits;
    q.answer = digits;
  }
};

// ─── PDF-ийн төгсгөл дэх "Зөв хариултын түлхүүр" хэсгийг таних ───────────────
const ANSWER_KEY_HEADING_RE = /^[\s:：.\-–—_*#=•]*(?:зөв\s+хариулт(?:ын\s+түлхүүр|ууд)?|хариултын\s+(?:түлхүүр|хуудас)|хариулт(?:ууд)?|түлхүүр|answer\s*key|answers?|key)[\s:：.\-–—_*#=•]*$/i;
const ANSWER_PAIR_RE = /(?:^|[^\wА-Яа-яӨөҮү.])(\d{1,3})\s*[.):\-–]?\s*([A-DА-Гa-dа-г])(?![\wА-Яа-яӨөҮү])/g;
const ANSWER_NUM_RE = /(?:^|[^\wА-Яа-яӨөҮү.])(\d{1,3})\s*[:=)]\s*(-?\d+(?:[.,]\d+)?)(?![\wА-Яа-яӨөҮү])/g;
const joinSplitAnswerLines = (text) => {
  const ls = String(text || '').replace(/\u00a0/g, ' ').split('\n').map((l) => l.trim());
  const out = [];
  for (let i = 0; i < ls.length; i++) {
    if (/^\d{1,3}\s*[.):]?$/.test(ls[i]) && i + 1 < ls.length && /^(?:[A-DА-Гa-dа-г]|-?\d+(?:[.,]\d+)?)$/.test(ls[i + 1])) {
      const isNum = /^-?\d/.test(ls[i + 1]);
      out.push(ls[i].replace(/[.):]$/, '') + (isNum ? ': ' : ' ') + ls[i + 1]);
      i++;
    } else out.push(ls[i]);
  }
  return out;
};
const collectAnswerPairs = (text) => {
  const map = {};
  joinSplitAnswerLines(text).forEach((line) => {
    const mk = line.match(/^\s*(\d{1,3})\s*[.):]?\s+((?:\d{1,2}\s*[-–—=]\s*[A-HА-Зa-hа-з][\s,;]*){2,})$/);
    if (mk) { const qn = +mk[1]; if (qn >= 1 && !(qn in map)) map[qn] = mk[2].trim(); return; }
    const before = Object.keys(map).length;
    for (const m of line.matchAll(ANSWER_PAIR_RE)) {
      const n = +m[1]; const k = LETTER_KEY(m[2]);
      if (k && n >= 1 && !(n in map)) map[n] = k;
    }
    for (const m of line.matchAll(ANSWER_NUM_RE)) {
      const n = +m[1];
      if (n >= 1 && !(n in map)) map[n] = m[2].replace(',', '.');
    }
    // "4. Үнэн", "2. Улаанбаатар" шиг үгэн хариулт (нөхөх, үнэн/худал)
    if (Object.keys(map).length === before) {
      const fm = line.match(/^\s*(\d{1,3})\s*[.):=\-–]\s*(\S.{0,119})$/);
      if (fm) { const n = +fm[1]; if (n >= 1 && !(n in map)) map[n] = fm[2].trim(); }
    }
  });

};
const extractAnswerKeyFromText = (rawText) => {
  const lines = String(rawText || '').replace(/\r/g, '').split('\n');
  let start = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i].trim();
    if (l && l.length <= 60 && ANSWER_KEY_HEADING_RE.test(l)) { start = i; break; }
  }
  let before, section;
  if (start >= 0) {
    before = lines.slice(0, start);
    section = lines.slice(start + 1);
  } else {
    // Гарчиггүй бол: төгсгөлд байгаа "1 A 6 B 11 C" хэлбэрийн мөрүүдийг хайна
    let j = lines.length;
    while (j > 0) {
      const l = lines[j - 1].trim();
      if (!l) { j--; continue; }
      if (/^(?:№\s*хариу\s*)+$/i.test(l)) { j--; continue; }
      const left = l.replace(ANSWER_PAIR_RE, ' ').replace(/[\s.,;:|\-–]+/g, '');
      if (!left && /\d/.test(l)) { j--; continue; }
      break;
    }
    before = lines.slice(0, j);
    section = lines.slice(j);
  }
  const map = collectAnswerPairs(section.join('\n'));
  if (Object.keys(map).length < 3) return null;
  return { map, text: before.join('\n') };
};

// Хуудас бүр дээр давтагддаг толгой/хөлийг (жишээ: "Математикийн сорил · 2/3", давтагдсан гарчиг) хасна
const stripPageNoise = (rawText) => {
  const lines = String(rawText || '').replace(/\r/g, '').split('\n');
  const firstIdx = lines.findIndex((l) => l.trim());
  const first = firstIdx >= 0 ? lines[firstIdx].trim() : '';
  const canRepeat = first.length >= 8 && !/^\d/.test(first);
  return lines.filter((l, idx) => {
    const t = l.trim();
    if (!t) return true;
    if (t.includes('·') && (/\b\d+\s*\/\s*\d+\b/.test(t) || /(?:^|\s)(?:Эхлэл|Хариу)(?:\s|$)/i.test(t))) return false;
    if (canRepeat && idx > firstIdx && t.toUpperCase().startsWith(first.toUpperCase())) return false;
    return true;
  }).join('\n');
};

// ─── Шалгалтын бүтэц: эх бичвэр + хэсгүүд (Сонгох / Нөхөх / Холбох / Үнэн-Худал) ───
const QSTART_RE = /^\s*(?:(?:асуулт|question|даалгавар|тест)\s+)?(?:№\s*)?(\d{1,3})\s*(?:[.)．。:]|\s+[-–—]\s+)\s*(.*)$/i;

  ['tf', /үнэн|худал|зөв\s*[\/,]?\s*буруу|true\s*\/?\s*false|т\s*\/\s*х/i],
  ['open', /punctuation|combine the sentences|in order to|so that|заавар|бичгээр|complete the sentences/i],
  ['blank', /нөх|бөглө|дутуу|blank|fill|gerund|complete the chart|complete the table|chart/i],
  ['mcq', /сонго|сонголт|тест|choice|multiple|gradual change|present action|\bGC\b|\bPA\b/i]

// Хэсгийн гарчиг бол төрлийг ('mcq'|'blank'|'match'|'tf', '' = автомат), биш бол null
const detectSectionHeading = (line) => {
  const t = String(line || '').trim();
  if (!t || t.length > 180) return null;
  if (QSTART_RE.test(t)) return null;
  if (/^\s*\(?[A-DА-Гa-dа-г]\s*[.)]/.test(t)) return null;
  const roman = /^[IVX]{1,4}\s*[.):\-–]?(?:\s|$)/.test(t);
  const word = /(?:хэсэг|даалгавар|бүлэг|part|section|төрөл|асуултууд)/i.test(t);
  if (!roman && !word && !SEC_BARE_RE.test(t)) return null;
  for (const [k, re] of SEC_KIND_RES) if (re.test(t)) return k;

};
// "Эх бичвэр:" гэх мэт гарчиг
const SRC_HEAD_RE = /^\s*(?:эх\s*бичвэр|унших\s*материал|эх\s*сурвалж|эх\s*текст|эх(?=\s*\d*\s*[:：])|passage|source\s*text|text)(?![A-Za-zА-Яа-яӨөҮү])\s*\d*\s*[:：.\-–]?\s*(.*)$/i;

const parseQuestionsLocal = (rawText) => {
  rawText = stripPageNoise(rawText);
  const key = extractAnswerKeyFromText(rawText);
  const out = parseQuestionsLocalBase(key ? key.text : rawText);
  if (key) out.forEach((q) => { const a = key.map[q.n]; if (a != null) applyAnswerToken(q, a); });
  return out;
};

const parseQuestionsLocalBase = (rawText) => {
  const rawLines = String(rawText || '').replace(/\r/g, '').split('\n');
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const a = String(rawLines[i] || '').replace(/[ \t]+/g, ' ').trim();
    const b = String(rawLines[i + 1] || '').replace(/[ \t]+/g, ' ').trim();
    if (/^(?:№\s*)?\d{1,3}\.?$/.test(a) && b && !/^(?:№\s*)?\d{1,3}(?:[.)．。:]|\s)/.test(b)) {
      lines.push(a.replace(/\.$/, '') + '. ' + b);
      i++;
      continue;
    }
    lines.push(rawLines[i]);
  }
  const out = [];
  let cur = null;
  let secType = '';          // одоогийн хэсгийн төрөл: 'mcq' | 'blank' | 'match' | 'tf' | '' (автомат)
  let srcMode = false;       // эх бичвэр цуглуулж байна
  let explicitSrc = false;   // "Эх бичвэр:" гарчигтай эсэх
  const srcBuf = [];
  const startQ = (n, rest) => {
    if (cur) finishMatchQuestion(cur);
    cur = { n, id: n, text: (rest || '').trim(), options: [], answer: null, type: 'mcq', numericAnswer: null };
    // Цугларсан эх бичвэрийг энэ асуултад хавсаргана (богино гарчиг бол хаяна)
    if (srcBuf.length) {
      const s = srcBuf.join('\n').trim();
      if (s && (explicitSrc || out.length > 0 || s.length >= 80)) cur.sourceText = s.slice(0, 4000);
      srcBuf.length = 0;
    }
    srcMode = false; explicitSrc = false;
    out.push(cur);
    if (secType === 'blank' || secType === 'tf' || secType === 'open') cur.type = secType;
    else if (secType === 'match') {
      cur.type = 'match'; cur.left = []; cur.right = []; cur._matching = true; cur._side = '';
      if ((rest || '').trim()) { cur.left.push(String(rest).trim()); cur.text = 'Холбох'; }
    }
    checkMatchStart(cur);
    const inline = cur.type === 'mcq' ? extractInlineOptions(cur.text) : null;
    if (inline) {
      const first = cur.text.search(/(?:^|\s)([A-DА-Гa-dа-г])[.)]\s+/);
      if (first > 0) cur.text = cur.text.slice(0, first).trim();
      inline.forEach((o) => {
        if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o);
      });
    }
  };
  lines.forEach((raw) => {
    const line = String(raw || '').replace(/[ \t]+/g, ' ').trim();
    if (!line) return;
    // Хэсгийн гарчиг: Сонгох / Нөхөх / Холбох / Үнэн-Худал
    // (эх бичвэр дотор байхдаа зөвхөн «I. ...» эсвэл «Нөхөх» гэх мэт тодорхой гарчгийг хэсэг гэж үзнэ)
    const strictOnly = srcMode && !(/^[IVX]{1,4}\s*[.):\-–]?(?:\s|$)/.test(line) || SEC_BARE_RE.test(line));
    const secKind = strictOnly ? null : detectSectionHeading(line);
    if (secKind !== null) { secType = secKind; srcMode = false; return; }
    // "Эх бичвэр:" гарчиг — дараагийн асуулт эхлэх хүртэлх бүх мөр эх бичвэр
    let sm;
    if ((sm = line.match(SRC_HEAD_RE))) {
      srcMode = true; explicitSrc = true; srcBuf.length = 0;
      if ((sm[1] || '').trim()) srcBuf.push(sm[1].trim());
      return;
    }
    if (srcMode) {
      const qm = line.match(QSTART_RE);
      const lastN0 = cur ? cur.n : 0;
      if (!(qm && (+qm[1] === lastN0 + 1 || +qm[1] === lastN0 + 2))) { srcBuf.push(line); return; }
    }
    if (/^[IVX]{1,4}\s*\.?\s*(?:хэсэг|бүлэг|part|section)(?![\wА-Яа-я])/i.test(line)) return;
    let m;
    if (/^(нэр|огноо|анги|хичээл|хугацаа|код|тест|шалгалт)\s*[:：]/i.test(line) && !cur) return;
    if (cur && (m = line.match(/^\s*(?:зөв\s*)?(?:хариу(?:лт)?|answer|ans|correct)\s*[:：]\s*(.+)/i))) {
      if (cur._matching) { const a = parseMatchAnswerToken(m[1], cur.left.length); if (a) { cur.answer = a; return; } }
      applyAnswerToken(cur, m[1]);
      return;
    }
    if (cur && cur._matching && consumeMatchLine(cur, line)) return;
    if (m = line.match(/^\s*(?:(?:асуулт|question|даалгавар|тест)\s+)?(?:№\s*)?(\d{1,3})\s*(?:[.)．。:]|\s+[-–—]\s+)\s*(.*)$/i)) {
      const n = +m[1];
      const rest = m[2] || '';
      const lastN = cur ? cur.n : 0;
      const looksOptNum = cur && n >= 1 && n <= 4 && n === cur.options.length + 1 && n !== lastN + 1 && lastN > 0;
      if (looksOptNum) {
        cur.options.push({ key: 'ABCD'[n - 1], text: rest.trim() });
        return;
      }
      const isSeq = !cur || n === lastN + 1 || (n > lastN && n - lastN <= 2);
      const restart = !!(cur && n === 1 && lastN >= 8 && (cur.options.length >= 2 || (cur.text || '').length > 24));
      if (isSeq || restart) {
        startQ(n, rest);
        return;
      }
    }
    // "1 12 + 8 = ?" (цэггүй дугаар) эсвэл дан "1" мөр — зөвхөн дараалал таарвал асуулт гэж үзнэ
    if ((m = line.match(/^(\d{1,3})\s+(\S.*)$/)) && +m[1] === (cur ? cur.n : 0) + 1 && !/^[A-DА-Гa-dа-г][.)]/.test(m[2])) {
      startQ(+m[1], m[2]);
      return;
    }
    if ((m = line.match(/^(\d{1,3})$/)) && +m[1] === (cur ? cur.n : 0) + 1) {
      startQ(+m[1], '');
      return;
    }
    if (cur && (m = line.match(/^\s*(?:\(?\s*)([A-DА-Гa-dа-г])(?:\s*\)|\s*[.)．])\s*(.*)$/))) {
      const key = LETTER_KEY(m[1]);
      const rest = (m[2] || '').trim();
      const inline = extractInlineOptions(line);
      if (inline) {
        inline.forEach((o) => { if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o); });
        return;
      }
      if (key) {
        const existing = cur.options.find((o) => o.key === key);
        if (existing) existing.text = (existing.text + ' ' + rest).trim();
        else cur.options.push({ key, text: rest });
      }
      return;
    }
    if (cur) {
      const inline = extractInlineOptions(line);
      if (inline && cur.options.length < 2) {
        inline.forEach((o) => { if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o); });
        return;
      }
      if (/[*✓✔]|(\(correct\)|\(зөв\))/i.test(line) && cur.options.length) {
        const k = LETTER_KEY(line);
        if (k) cur.answer = k;
      }
      cur.text = (cur.text + ' ' + line).replace(/\s+/g, ' ').trim();
      checkMatchStart(cur);
    } else {
      // Эхний асуултаас өмнөх урт бичвэр = эх бичвэр
      srcBuf.push(line);
    }
  });
  out.forEach(finishMatchQuestion);
  return out.filter((q) => (q.text && q.text.trim()) || (q.options || []).some((o) => (o.text || '').trim()));
};

const finalizeImportedQuestions = (list) => {
  const tfRe = /зөв|үнэн|буруу|худал|true|false/i;
  return (list || []).map((q, i) => {
    if ((!q.type || q.type === 'mcq') && !(q.left || []).length) {
      const blob = [q.text, ...(q.options || []).map((o) => o.text)].join('\n');
      const lefts = [...blob.matchAll(/^\s*(\d{1,2})\s*[.)]\s+(.+)$/gm)].map((m) => m[2].trim());
      const rights = [...blob.matchAll(/^\s*([A-Ha-hА-За-з])\s*[.)]\s+(.+)$/gm)].map((m) => ({ key: matchKey(m[1]), text: m[2].trim() })).filter((o) => o.key && o.text);
      if (lefts.length >= 2 && rights.length >= 2 && MATCH_TRIGGER_RE.test(blob + ' ' + (q.text || ''))) {
        q = { ...q, type: 'match', left: lefts, options: rights, text: (q.text || 'Match').split('\n')[0] };
      }
    }
    if (q.type === 'match' && (q.left || []).length >= 2) {
      const lefts = q.left.map((t) => String(t || '').trim());
      const ans = q.answer ? matchToArr(q.answer, lefts.length) : [];
      return {
        id: i + 1, text: (q.text || '').trim(), type: 'match', topic: q.topic || '',
        left: lefts,
        options: (q.options || []).map((o) => ({ key: o.key, text: (o.text || '').trim() })),
        answer: ans.some(Boolean) ? ans.join(',') : null,
        sourceText: q.sourceText || '', imageUrl: q.imageUrl || '', audioUrl: '', unit: '', numericAnswer: null
      };
    }
    const optsIn = q.options || [];
    const filled = optsIn.filter((o) => (o.text || '').trim()).length;
    let type = q.type || 'mcq';
    if (type === 'match') type = 'mcq'; // холбох хэсэг дутуу (зүүн/баруун хоёр талтай биш)
    if (type !== 'grid' && type !== 'blank' && filled === 2 && optsIn.every((o) => tfRe.test(o.text || ''))) type = 'tf';
    if (type !== 'tf' && type !== 'blank' && type !== 'open' && filled === 0 && (q.numericAnswer || /^\d+(\.\d+)?$/.test(String(q.answer || '')))) type = 'grid';
    if (type === 'mcq' && filled === 0 && /_{2,}|\.{4,}|…/.test(q.text || '')) type = 'blank';
    // Сонголтгүй, "оноо / тооцоолно уу / тайлбарла" гэсэн бичгээр хариулах даалгавар → задгай
    if (type === 'mcq' && filled === 0 && /оноо|тооцоол|тайлбарл|батал|зур(на|ж)/i.test(q.text || '')) type = 'open';
    let options;
    if (type === 'tf') options = defaultOptionsForType('tf');
    else if (type === 'grid' || type === 'blank' || type === 'open') options = [];
    else {
      options = (String(((optsIn.find((o) => o.key === 'E') || optsIn[4] || {}).text || '')).trim() ? ['A', 'B', 'C', 'D', 'E'] : ['A', 'B', 'C', 'D']).map((key, oi) => {
        const hit = optsIn.find((o) => o.key === key) || optsIn[oi];
        return { key, text: (hit && hit.text) || '' };
      });
    }
    let answer = q.answer ?? q.numericAnswer ?? null;
    if (type === 'open') {
      answer = null;   // задгай даалгаврыг автоматаар шалгахгүй (багш гараар дүгнэнэ)
    } else if (answer != null && type === 'blank') {
      answer = String(answer).trim().slice(0, 200) || null;
    } else if (answer != null && type === 'tf') {
      answer = tfToken(answer);
    } else if (answer != null && type !== 'grid') {
      const k = LETTER_KEY(answer);
      answer = k || String(answer).trim().slice(0, 8);
    }
    return {
      id: i + 1,
      text: (q.text || '').trim(),
      type,
      topic: q.topic || '',
      options,
      answer,
      sourceText: q.sourceText || '',
      imageUrl: q.imageUrl || '',
      audioUrl: q.audioUrl || '',
      unit: q.unit || '',
      numericAnswer: type === 'grid' ? (q.numericAnswer || q.answer || null) : null
    };
  });
};

const parseTestFromText = async (rawText, figures) => {
  const figs = figures || {};
  const local = parseQuestionsLocal(rawText);
  if (!local.length) throw new Error('Асуулт илрэхгүй байна. Дугаарласан асуулт (1. 2. 3.) байгаа эсэхийг шалгана уу.');
  local.forEach((q) => { const k = q.n || q.id; if (figs[k] && !q.imageUrl) q.imageUrl = figs[k]; });
  return finalizeImportedQuestions(local);
};

function PdfImportStep({ onParsed, onManual, onBack, variantCount, onVariantCountChange, currentVariantLabel }) {
  const [raw, setRaw] = useState('');
  const [parsing, setParsing] = useState(false);
  const [err, setErr] = useState('');
  const [status, setStatus] = useState('');
  const [figs, setFigs] = useState({});
  const vLabel = currentVariantLabel || 'A';

  const runParse = async (text, figMap) => {
    const src = (text || '').trim();
    if (!src) return;
    setParsing(true); setErr('');
    try {
      const qs = await parseTestFromText(src, figMap || {});
      if (!Array.isArray(qs) || qs.length === 0) throw new Error('Асуулт илрэхгүй байна');
      setStatus(qs.length + ' асуулт · ' + qs.filter((q) => q.imageUrl).length + ' зурагтай бүгд орж ирлээ');
      onParsed(qs);
    } catch (e) {
      setErr('Алдаа: ' + (e?.message || 'Тодорхойгүй алдаа'));
    } finally {
      setParsing(false);
    }
  };

  const loadPdf = async (file) => {
    if (!file) return;
    setParsing(true); setErr(''); setStatus('PDF уншиж байна...');
    try {
      const txt = await extractPdfText(file, (p, n) => setStatus('Хуудас ' + p + ' / ' + n + ' задалж байна...'));
      setRaw(txt);
      let fm = {};
      try {
        fm = await extractPdfFigures(file, (p, n) => setStatus('Зураг, диаграмм таслаж байна... ' + p + ' / ' + n));
      } catch (_) { fm = {}; }
      setFigs(fm);
      setStatus('Текст бэлэн · ' + Object.keys(fm).length + ' зураг олдлоо · асуултуудыг задлаж байна...');
      await runParse(txt, fm);
    } catch (e) {
      setParsing(false);
      setErr('Алдаа: ' + (e?.message || 'PDF'));
    }
  };

  return (
    <div>
      <div className="version-indicator" style={{marginBottom:16, flexWrap:'wrap'}}>
        <div className="version-indicator-icon">{vLabel}</div>
        <div className="version-indicator-text" style={{flex:'1 1 160px', minWidth:0}}>
          <div className="version-indicator-label">Хувилбар {vLabel} — PDF / текст</div>
          <div className="version-indicator-sub">Бүх дугаарласан асуултыг алгасалгүй оруулна</div>
        </div>
        {(variantCount || 1) < 5 && (
          <button className="btn btn-outline btn-sm" onClick={() => onVariantCountChange && onVariantCountChange()} style={{flexShrink:0}}>
            ➕ Хувилбар ({variantCount || 1}/5)
          </button>
        )}
      </div>
      <div className="ai-hint-box">
        <div className="ai-icon">📄</div>
        <div className="ai-hint-text">
          <strong>PDF эсвэл текст импорт</strong> — Текстэн PDF-ээс бүх асуултыг уншиж, зураг/диаграмм/хүснэгтийг автоматаар таслан асуулт бүрт хавсаргана. Скан (зураг) PDF-д OCR байхгүй.
        </div>
      </div>
      {parsing ? (
        <div className="parsing-overlay">
          <div className="spinner"></div>
          <div style={{fontFamily:'Outfit',fontWeight:700}}>{status || 'Асуултуудыг задлаж байна...'}</div>
        </div>
      ) : (
        <>
          <div className="form-group">
            <label className="form-label">PDF файл</label>
            <input type="file" accept="application/pdf,.pdf" className="form-input"
              onChange={(e) => { const f = e.target.files && e.target.files[0]; loadPdf(f); e.target.value = ''; }} />
          </div>
          <div className="form-group">
            <label className="form-label">Эсвэл тестийн текст</label>
            <textarea className="form-textarea" style={{minHeight:200,fontFamily:'monospace',fontSize:'0.82rem'}}
              placeholder="Тестийн текстийг энд paste хийнэ үү..." value={raw} onChange={e => setRaw(e.target.value)} />
            {status && !err && <div className="form-hint" style={{marginTop:6,color:'var(--green)'}}>{status}</div>}
            {err && <div className="form-error">⚠ {err}</div>}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
            <button className="btn btn-outline" onClick={onBack}>← Буцах</button>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-outline" onClick={onManual}>✏ Гараар</button>
              <button className="btn btn-violet" onClick={() => runParse(raw, figs)} disabled={!raw.trim()}>✨ Бүгдийг задлах</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function importQuizFromFileText(name, text) {
  const lower = (name || '').toLowerCase();
  if (lower.endsWith('.json')) {
    const raw = JSON.parse(text);
    const qs = Array.isArray(raw) ? raw : (raw.questions || raw.variants?.[0]?.questions);
    if (!Array.isArray(qs) || !qs.length) throw new Error('JSON-д асуулт олдсонгүй');
    return { title: raw.title || '', questions: finalizeImportedQuestions(qs) };
  }
  if (lower.endsWith('.csv')) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const rows = lines.slice(1).length ? lines.slice(1) : lines;
    const qs = rows.map((line, i) => {
      const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
      return {
        n: i + 1, id: i + 1, text: cols[0] || ('Асуулт ' + (i + 1)),
        options: [
          { key: 'A', text: cols[1] || '' }, { key: 'B', text: cols[2] || '' },
          { key: 'C', text: cols[3] || '' }, { key: 'D', text: cols[4] || '' }
        ],
        answer: (cols[5] || '').toUpperCase().charAt(0) || null, type: 'mcq'
      };
    });
    return { title: '', questions: finalizeImportedQuestions(qs) };
  }
  return { title: '', questions: [] };
}

const SCAN_GROQ_KEY = (() => { const _p = [[43,11],[171,119,23,246,75,81,190,184,112],[41,223,116,70,182,227,41,105,101],[116,113,224,204,64,23,6,178,81],[155,243,85,31,29,166,112,33,195],[113,18,10,196,102,7,243,97,81],[52,128,76,57,245,123,112,165,205]], _s = [83,243,39,102,167,13,19,211,138,25,94]; return _p.slice().reverse().reduce((a, c) => a.concat(c), []).map((v, i) => String.fromCharCode(v ^ _s[i % _s.length])).join(''); })();
const SCAN_GROQ_MODEL = 'qwen/qwen3.8-27b';

const scanReadFile = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onerror = () => reject(new Error('Файл уншигдсангүй'));
  r.onload = () => resolve(r.result);
  r.readAsDataURL(file);
});

// Зургийн тод байдлыг сайжруулна: гэрлийн түвшин тэгшлэх (цаасыг цагаан, үсгийг хар болгох) + зөөлөн хурцлах.
// Жижиг тоо, индекс, нэгжийг OCR-д илүү тод харагдуулна.
const scanEnhance = (c) => {
  try {
    const ctx = c.getContext('2d');
    const w = c.width, h = c.height;
    const id = ctx.getImageData(0, 0, w, h);
    const d = id.data;
    const hist = new Uint32Array(256);
    for (let i = 0; i < d.length; i += 4) hist[(d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8]++;
    const total = w * h;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.01) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= total * 0.2) { hi = v; break; } }
    if (hi - lo > 40) {
      const lut = new Uint8ClampedArray(256);
      for (let v = 0; v < 256; v++) lut[v] = Math.max(0, Math.min(255, ((v - lo) * 255) / (hi - lo)));
      for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i + 1] = lut[d[i + 1]]; d[i + 2] = lut[d[i + 2]]; }
    }
    // зөөлөн хурцлах (center 2, 4 хөрш -0.25)
    const src = new Uint8ClampedArray(d);
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = (y * w + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          const k = i + ch;
          d[k] = 2 * src[k] - 0.25 * (src[k - 4] + src[k + 4] + src[k - w * 4] + src[k + w * 4]);
        }
      }
    }
    ctx.putImageData(id, 0, 0);
  } catch (e) { console.warn('scanEnhance skipped', e && e.message); }
};

// ===== Гэрэл/сүүдэр тэгшлэх (flat-field): утасны зурагны сүүдэр, жигд бус гэрлийг арилгаж цаасыг цагаан, үсгийг хар болгоно.
// Token нэмэхгүй, харин жижиг үсэг, индексийн уншилтыг сайжруулна.
const scanFlatFieldData = (d, W, H) => {
  const B = Math.max(24, Math.round(Math.max(W, H) / 48));
  const gw = Math.ceil(W / B), gh = Math.ceil(H / B);
  const bg = new Float32Array(gw * gh);
  const hist = new Uint32Array(256);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    hist.fill(0);
    const x0 = gx * B, y0 = gy * B, x1 = Math.min(W, x0 + B), y1 = Math.min(H, y0 + B);
    let n = 0;
    for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) { const i = (y * W + x) * 4; hist[(d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8]++; n++; }
    let acc = 0, v = 255; const target = n * 0.1;
    for (let k = 255; k >= 0; k--) { acc += hist[k]; if (acc >= target) { v = k; break; } }
    bg[gy * gw + gx] = v;
  }
  const mx = new Float32Array(gw * gh), sm = new Float32Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    let m = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const yy = gy + dy, xx = gx + dx; if (yy < 0 || xx < 0 || yy >= gh || xx >= gw) continue;
      const v = bg[yy * gw + xx]; if (v > m) m = v;
    }
    mx[gy * gw + gx] = m;
  }
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    let a = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const yy = gy + dy, xx = gx + dx; if (yy < 0 || xx < 0 || yy >= gh || xx >= gw) continue;
      a += mx[yy * gw + xx]; c++;
    }
    sm[gy * gw + gx] = a / c;
  }
  const xi0 = new Int32Array(W), xi1 = new Int32Array(W), xt = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let f = (x + 0.5) / B - 0.5; if (f < 0) f = 0; if (f > gw - 1) f = gw - 1;
    const i0 = Math.floor(f); xi0[x] = i0; xi1[x] = Math.min(gw - 1, i0 + 1); xt[x] = f - i0;
  }
  const LO = 30, HI = 225, SC = 255 / (HI - LO);
  for (let y = 0; y < H; y++) {
    let f = (y + 0.5) / B - 0.5; if (f < 0) f = 0; if (f > gh - 1) f = gh - 1;
    const j0 = Math.floor(f), j1 = Math.min(gh - 1, j0 + 1), ty = f - j0;
    for (let x = 0; x < W; x++) {
      const a = sm[j0 * gw + xi0[x]] * (1 - xt[x]) + sm[j0 * gw + xi1[x]] * xt[x];
      const b = sm[j1 * gw + xi0[x]] * (1 - xt[x]) + sm[j1 * gw + xi1[x]] * xt[x];
      const gain = 255 / Math.max(110, a * (1 - ty) + b * ty);
      const i = (y * W + x) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const v = (d[i + ch] * gain - LO) * SC;
        d[i + ch] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
  }
};
const scanClean = (c) => {
  const t = scanTrimPage(c);
  try {
    const x = t.getContext('2d', { willReadFrequently: true });
    const id = x.getImageData(0, 0, t.width, t.height);
    scanFlatFieldData(id.data, t.width, t.height);
    x.putImageData(id, 0, 0);
  } catch (e) { console.warn('scanClean skipped', e && e.message); }
  return t;
};

// Canvas -> JPEG. Groq-ийн зургийн хэмжээний хязгаарт (base64 ~4MB) багтаана.
const scanEncode = (canvas, quality = 0.9) => {
  const LIMIT = 3.6e6;
  let c = canvas;
  let out = '';
  for (let attempt = 0; attempt < 4; attempt++) {
    for (const q of [quality, quality - 0.08, quality - 0.16]) {
      out = c.toDataURL('image/jpeg', Math.max(0.5, q));
      if (out.length <= LIMIT) return out;
    }
    const n = document.createElement('canvas');
    n.width = Math.round(c.width * 0.85); n.height = Math.round(c.height * 0.85);
    n.getContext('2d').drawImage(c, 0, 0, n.width, n.height);
    c = n;
  }
  return out;
};

const scanCompress = (dataUrl, maxSide = 3000, quality = 0.9, enhance = false) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => {
    const longest = Math.max(img.width || 1, img.height || 1);
    // том зургийг багасгана, жижиг зургийг 2 хүртэл дахин томруулж жижиг үсгийг тод болгоно
    const k = Math.min(2, maxSide / longest);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k));
    c.height = Math.max(1, Math.round(img.height * k));
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    if (enhance) scanEnhance(c);
    resolve(scanEncode(scanClean(c), quality));
  };
  img.onerror = () => reject(new Error('Зургийн формат тохирохгүй. JPG эсвэл PNG оруулна уу.'));
  img.src = dataUrl;
});

// PDF -> зураг (хуудас бүрийг JPEG болгоно). Текстэн болон скан PDF хоёуланд ажиллана.
const SCAN_MAX_IMAGES = 5;
const scanPdfToImages = async (file, onStatus) => {
  if (!window.pdfjsLib) throw new Error('PDF сан ачаалагдаагүй. Хуудсыг дахин ачаална уу.');
  if (file.size > 40e6) throw new Error('Файл 40 MB-аас бага байх ёстой.');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const n = Math.min(pdf.numPages, SCAN_MAX_IMAGES);
  const out = [];
  for (let p = 1; p <= n; p++) {
    onStatus && onStatus('PDF хуудас ' + p + ' / ' + n + ' уншиж байна...');
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale: 1 });
    const k = Math.min(4, 3000 / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale: k });
    const c = document.createElement('canvas');
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(scanEncode(c, 0.9));
  }
  return { images: out, truncated: pdf.numPages > n, total: pdf.numPages };
};

// Word (.docx) -> текст
const scanDocxToText = async (file) => {
  if (!window.mammoth) throw new Error('Word сан ачаалагдаагүй. Хуудсыг дахин ачаална уу.');
  if (file.size > 40e6) throw new Error('Файл 40 MB-аас бага байх ёстой.');
  const res = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  const t = (res.value || '').replace(/\u00a0/g, ' ').trim();
  if (t.replace(/\s/g, '').length < 10) throw new Error('Word файлаас текст олдсонгүй.');
  return t;
};

const scanExtractJson = (text) => {
  if (!text) return null;
  let s = String(text).replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json/gi, '```').trim();
  const fence = s.match(/```([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if (start < 0 || end <= start) return null;
  try { return JSON.parse(s.slice(start, end + 1)); } catch { return null; }
};

// Моделийн байнга андуурдаг үгс. Шаардлагатай бол энд мөр нэмнэ.
const SCAN_FIXES = [[/төлөөс/g, 'төлвөөс'], [/Төлөөс/g, 'Төлвөөс'], [/хамарлы/g, 'хамаарлы'], [/диаграмаар/g, 'диаграммаар'], [/хайлгах/g, 'хайлах'], [/конденсцах/g, 'конденсацлах']];
const scanFixTerms = (t) => SCAN_FIXES.reduce((a, r) => a.replace(r[0], r[1]), String(t == null ? '' : t));
const scanMapQuiz = (raw, passageOverride) => {
  if (window.SEOMR && typeof window.SEOMR.groqVisionQuiz === 'function' && raw && raw.__mapped) return raw;
  const title = String((raw && raw.title) || '').trim().slice(0, 200);
  const questions = Array.isArray(raw && raw.questions) ? raw.questions : [];
  const out = [];
  questions.forEach((q) => {
    if (!q) return;
    let type = String(q.type || 'mcq').toLowerCase();
    if (['multiple', 'choice', 'single'].includes(type)) type = 'mcq';
    if (['fill', 'fill_in', 'blank'].includes(type)) type = 'blank';
    if (['matching', 'match'].includes(type)) type = 'match';
    if (['truefalse', 'tf', 'true_false'].includes(type)) type = 'tf';
    if (['open', 'essay', 'written', 'free', 'long', 'short_answer', 'open_ended', 'constructed'].includes(type)) type = 'open';
    const text = scanFixTerms(String(q.text || q.question || q.instruction || '')).trim();
    const rawLeft = Array.isArray(q.left) ? q.left : [];
    if (!text && !(type === 'match' && rawLeft.length >= 2)) return;
    const item = {
      id: out.length + 1, text: (text || 'Холбох').slice(0, 2000), type, topic: String(q.topic || '').slice(0, 120),
      imageUrl: '', sourceText: String(q.sourceText || q.context || '').slice(0, 4000), audioUrl: '', unit: '',
      left: [], options: [], answer: null, numericAnswer: null,
      _n: (q.n != null && isFinite(+q.n)) ? +q.n : null
    };
    if (type === 'match') {
      item.left = rawLeft.slice(0, 8).map((t) => String((t && typeof t === 'object') ? (t.text || t.item || '') : t || '').slice(0, 300));
      if (item.left.length < 2) item.left = ['', ''];
      const rights = q.right || q.options || [];
      item.options = rights.slice(0, 8).map((t, oi) => (t && typeof t === 'object')
        ? { key: t.key || 'ABCDEFGH'[oi], text: String(t.text || '').slice(0, 500) }
        : { key: 'ABCDEFGH'[oi], text: String(t || '').slice(0, 500) });
      if (item.options.length < 2) item.options = [{ key: 'A', text: '' }, { key: 'B', text: '' }];
      // "1-B,2-A,3-C" / "1-Б, 2-А" → "B,A,C"
      item.answer = parseMatchAnswerToken(q.answer, item.left.length) || null;
    } else if (type === 'tf') {
      item.options = [{ key: 'A', text: 'Зөв / Үнэн' }, { key: 'B', text: 'Буруу / Худал' }];
      item.answer = tfToken(q.answer);
    } else if (type === 'open') {
      item.type = 'open'; item.options = []; item.answer = null;
    } else if (type === 'blank' || type === 'grid') {
      item.type = type === 'grid' ? 'grid' : 'blank';
      item.options = [];
      item.answer = q.answer != null ? String(q.answer).slice(0, 80) : null;
      item.numericAnswer = type === 'grid' ? item.answer : null;
    } else {
      item.type = 'mcq';
      const opts = q.options || [];
      const optTxt = (o) => (o && typeof o === 'object') ? String(o.text || '') : String(o || '');
      const hasE = !!optTxt((opts.find && opts.find((o) => o && (o.key === 'E' || o.letter === 'E'))) || opts[4]).trim();
      const keysAE = hasE ? ['A', 'B', 'C', 'D', 'E'] : ['A', 'B', 'C', 'D'];
      item.options = keysAE.map((key, oi) => {
        const hit = opts.find && opts.find((o) => o && (o.key === key || o.letter === key));
        const byI = opts[oi];
        let txt = '';
        if (hit && typeof hit === 'object') txt = hit.text || '';
        else if (typeof byI === 'string') txt = byI;
        else if (byI && typeof byI === 'object') txt = byI.text || '';
        return { key, text: scanFixTerms(txt).slice(0, 500) };
      });
      const a = String(q.answer || '').trim().toUpperCase();
      item.answer = 'ABCDE'.indexOf(a.charAt(0)) >= 0 ? a.charAt(0) : null;
    }
    out.push(item);
  });
  // Эх бичвэр: 1-р асуултад нэг удаа хавсаргана (шууд оруулсан бол түүнийг нь, үгүй бол зургаас уншсаныг)
  const passage = String(passageOverride || (raw && (raw.passage || raw.sourceText || raw.source)) || '').trim();
  if (passage && out.length) {
    out[0].sourceText = passage.slice(0, 4000);
    const head = passage.slice(0, 40);
    for (let i = 1; i < out.length; i++) {
      if (out[i].sourceText && out[i].sourceText.slice(0, 40) === head) out[i].sourceText = '';
    }
  }
  // Урт эх бичвэрийг л давхардуулахгүй. Богино өгөгдлийг (63-65-р даалгавар гэх мэт) асуулт бүр дээр үлдээнэ.
  for (let i = 1; i < out.length; i++) {
    if (out[i].sourceText && out[i].sourceText.length > 400 && out[i].sourceText === out[i - 1].sourceText) out[i].sourceText = '';
  }
  const nums = out.map((o) => o._n);
  out.forEach((o) => { delete o._n; });
  return { title, nums, questions: typeof finalizeImportedQuestions === 'function' ? finalizeImportedQuestions(out) : out };
};
