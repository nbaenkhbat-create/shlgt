            <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
              <label style={{fontWeight:800,display:'flex',gap:8,alignItems:'center'}}>
                <input type="checkbox" checked={!!st.enabled} onChange={e => saveAi({ enabled: e.target.checked })} />
                AI ажилтнууд ON
              </label>
              <span>Идэвхжих</span>
              <input className="form-input" type="time" style={{width:130}} value={st.start || '08:00'} onChange={e => saveAi({ start: e.target.value })} />
              <span>Дуусах</span>
              <input className="form-input" type="time" style={{width:130}} value={st.end || '18:00'} onChange={e => saveAi({ end: e.target.value })} />
              <span className={'badge ' + (ai && ai.inSchedule && st.enabled ? 'badge-blue' : 'badge-gray')}>{ai && ai.inSchedule && st.enabled ? 'ажиллаж байна' : 'хүлээлт'}</span>
            </div>
            <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
              <input className="form-input" style={{flex:1,minWidth:180}} placeholder="Симуляцийн багшийн нэвтрэх нэр"
                value={simLogin} onChange={e => setSimLogin(e.target.value)}
                onBlur={() => saveAi({ simLogin })} />
              <input className="form-input" style={{flex:1,minWidth:180}} placeholder="Нэмэлт имэйл"
                value={mailTo} onChange={e => setMailTo(e.target.value)}
                onBlur={() => saveAi({ extraEmail: mailTo })} />
            </div>
            <div className="form-hint">AI1+AI2 = багш/сурагч (KEY1). AI3 аудит + AI4 туслах (KEY2). Зөвхөн энд заасан симуляцийн аккаунт дээр ажиллана.</div>
          </div></div>

          <div className="card" style={{marginBottom:12}}><div className="card-header"><div className="card-title">Group chat · AI ажилтнууд</div></div>
            <div className="card-body">
              <div className="admin-chat" ref={chatRef}>
                {(ai && ai.chat || []).map(m => (
                  <div className="row" key={m.id}><span className="who">{m.role}</span><span style={{opacity:.55,marginRight:8}}>{(m.t||'').slice(11,19)}</span>{m.text}</div>
                ))}
              </div>
              <div style={{display:'flex',gap:8,marginTop:10}}>
                <input className="form-input" placeholder='AI4-д даалгавар: жишээ нь "10 тест үүсгэ"' value={cmd} onChange={e => setCmd(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && cmd && adminApi('/api/admin/ai/command', { method:'POST', body: JSON.stringify({ text: cmd }) }).then(() => { setCmd(''); load(); })} />
                <button className="btn btn-violet" onClick={async () => { if (!cmd) return; await adminApi('/api/admin/ai/command', { method:'POST', body: JSON.stringify({ text: cmd }) }); setCmd(''); await load(); }}>Илгээх</button>
              </div>
            </div>
          </div>

          <div className="card"><div className="card-header"><div className="card-title">Мэдэгдэл / имэйл</div></div>
            <div className="card-body">
              <input className="form-input" placeholder="Нэмэлт имэйл" value={mailTo} onChange={e => setMailTo(e.target.value)} style={{marginBottom:8}} />
              <textarea className="form-textarea" placeholder="Мэдэгдлийн текст" value={mailMsg} onChange={e => setMailMsg(e.target.value)} />
              <button className="btn btn-green" style={{marginTop:8}} onClick={async () => {
                await saveAi({ extraEmail: mailTo });
                const r = await adminApi('/api/admin/ai/email', { method:'POST', body: JSON.stringify({ to: mailTo, message: mailMsg || 'SmartEXAM мэдэгдэл' }) });
                alert('Илгээлт: ' + JSON.stringify(r.results));
              }}>nbaenkhbat@gmail.com + нэмэлт рүү илгээх</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const teacherNav = (active, page) => (
    <BottomNav active={active} items={[
      { key: 'exams', icon: '📋', label: 'Шалгалт', onClick: () => setPage({ type: 'teacherDash', name: page.name }) },
      { key: 'new', icon: '➕', label: 'Шинэ тест', onClick: () => setPage({ ...page, type: 'createExam' }) },
      { key: 'classes', icon: '👥', label: 'Ангиуд', onClick: () => setPage({ type: 'classes', name: page.name }) },
      { key: 'out', icon: '🚪', label: 'Гарах', onClick: async () => { await teacherSignOut(); setPage({ type: 'landing' }); history.replaceState({ se: 'landing' }, '', appUrlWithHash('')); } }
    ]} />
  );
  const [exams, setExams] = useLS('se_exams', []);
  const [submissions, setSubmissions] = useLS('se_submissions', []);
  const [restoring, setRestoring] = useState(false);
  const restoreExams = useCallback(async (silent) => {
    setRestoring(true);
    try {
      const list = await restoreExamsFromCloud();
      let added = 0;
      setExams(prev => {
        const have = new Set((prev || []).map(e => e.id));
        const add = list.filter(e => !have.has(e.id));
        added = add.length;
        return add.length ? [...(prev || []), ...add] : prev;
      });
      if (!silent) setTimeout(() => alert(list.length ? 'Сэргээсэн тест: ' + list.length : 'Серверээс таны тест олдсонгүй (ангид оноогоогүй, индекс үүсээгүй тест сэргээгдэхгүй).'), 50);
    } catch (e) {
      if (!silent) alert('Сэргээж чадсангүй: ' + (e?.message || e));
    }
    setRestoring(false);
  }, []);
  const restoreTriedRef = useRef(false);
  const [qrExam, setQrExam] = useState(null); // exam loaded from QR URL

  const [page, setPage] = useState({ type: 'landing' });
  const [roomLoaded, setRoomLoaded] = useState(null); // {roomID,title,subject,duration,passingScore,versions}
  const [assigningVariant, setAssigningVariant] = useState(false);
  const [meName, setMeName] = useState('');
  // Сервер (Firebase) нь үндсэн хадгалалт. Багшийн нүүр нээгдэх бүрт (сессэд нэг удаа) серверийн тестүүдийг локалтай нэгтгэнэ
  useEffect(() => {
    if (page.type !== 'teacherDash' || restoreTriedRef.current) return;
    restoreTriedRef.current = true;
    backfillExamIndex(exams);
    restoreExams(true).then(() => {});
  }, [page.type]);

  const assigningRef = useRef(false);
  const startStudentExam = useCallback(async (roomExam, studentName, studentClass) => {
    if (assigningRef.current) return;
    assigningRef.current = true;
    setAssigningVariant(true);
    try {
      const exam = await pickVariantForStudent(roomExam, studentName, studentClass);
      setPage({ type: 'examIntro', exam, studentName, studentClass });
    } catch (e) {
      alert('Хувилбар томилох алдаа: ' + (e?.message || 'дахин оролдоно уу'));
    } finally {
      assigningRef.current = false;
      setAssigningVariant(false);
    }
  }, []);

  // Hash + browser back (←) — Auth шаардлагатай
  useEffect(() => {
    const requireTeacher = () => {
      const u = ensureTeacherAuth();
      if (!u) {
        setPage({ type: 'teacherLogin' });
        return null;
      }
      return u.displayName || localStorage.getItem(SE_TEACHER) || u.email || 'Багш';
    };
    const applyHash = () => {
      const tag = (window.location.hash || '').replace(/^#/, '').split('&')[0];
      if (tag === 'teacher') {
        const name = requireTeacher();
        if (name) setPage({ type: 'teacherDash', name });
        return;
      }
      if (!tag) setPage(p => (p.type === 'teacherDash') ? { type: 'landing' } : p);
    };
    window.addEventListener('popstate', applyHash);
    const tag0 = (window.location.hash || '').replace(/^#/, '');
    if (tag0 === 'teacher') applyHash();
    return () => window.removeEventListener('popstate', applyHash);
  }, []);

  // Prefetch anonymous auth — QR/code join becomes much faster
  useEffect(() => { prefetchStudentAuth(); }, []);

  // Auth state — anonymous-гүй багш session сэргээнэ
  useEffect(() => {
    const auth = getAuth();
    if (!auth) return;
    let restored = false;
    const unsub = auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) {
        const name = user.displayName || localStorage.getItem(SE_TEACHER) || user.email || 'Багш';
        try { localStorage.setItem(SE_TEACHER, name); } catch {}
        // Нэвтрэлт хадгалагдсан: хуудсыг дахин нээхэд шууд өөрийн хэсэг рүү оруулна (нэг л удаа)
        if (!restored) {
          restored = true;
          let role = '', qrBoot = null;
          try { role = localStorage.getItem('se_role') || ''; qrBoot = sessionStorage.getItem('se_qr_boot'); } catch {}
          const hasHash = !!(window.location.hash || '').replace(/^#/, '');
          if (!qrBoot && !hasHash) {
            setPage(p => {
              if (p.type !== 'landing') return p;
              if (role === 'teacher') {
                try { history.pushState({ se: 'teacher' }, '', appUrlWithHash('teacher')); } catch {}
                return { type: 'teacherDash', name };
              }
              if (role === 'student') { setMeName(user.displayName || 'Сурагч'); return { type: 'studentHome' }; }
              return p;
            });
          }
        }
      }
    });
    return () => unsub();
  }, []);

  // Handle QR URL hash on load (Safari may clear hash — also check sessionStorage)
  useEffect(() => {
    prefetchStudentAuth();
    let roomID = null;
    let classKey = '';
    const hash = window.location.hash;
    if (hash.startsWith('#qr=')) {
      try {
        const compressed = hash.slice(4);
        const json = LZString.decompressFromEncodedURIComponent(compressed);
        const packed = JSON.parse(json);
        const parsed = unpackExamFromQR(packed);
        roomID = parsed?.roomID || null;
        classKey = parsed?.classKey || '';
        try {
          sessionStorage.setItem('se_qr_boot', JSON.stringify({ roomID, classKey, t: Date.now() }));
        } catch {}
        history.replaceState(null, '', appUrlWithHash(''));
      } catch (e) { console.error('QR decode error', e); }
    }
    if (!roomID) {
      try {
        const boot = JSON.parse(sessionStorage.getItem('se_qr_boot') || 'null');
        if (boot?.roomID && (Date.now() - (boot.t || 0)) < 120000) {
          roomID = boot.roomID;
          classKey = boot.classKey || window.__SE_QR_PREFETCH__?.classKey || '';
        }
      } catch {}
    }
    if (window.__SE_QR_PREFETCH__?.roomID) {
      roomID = roomID || window.__SE_QR_PREFETCH__.roomID;
      classKey = classKey || window.__SE_QR_PREFETCH__.classKey || '';
    }
    if (roomID) {
      try { sessionStorage.removeItem('se_qr_boot'); } catch {}
      setPage({ type: 'qrRoom', roomID, qrClassKey: classKey || '' });
    }
  }, []);

  const goHome = () => {
    setQrExam(null);
    setPage({ type: 'landing' });
    history.replaceState({ se: 'landing' }, '', appUrlWithHash(''));
  };

  const goTeacherDash = useCallback((name) => {
    const n = (name || '').trim() || localStorage.getItem(SE_TEACHER) || 'Багш';
    try { localStorage.setItem(SE_TEACHER, n); } catch {}
    setPage({ type: 'teacherDash', name: n });
    history.pushState({ se: 'teacher' }, '', appUrlWithHash('teacher'));
  }, []);

  const deleteExam = useCallback((exam) => {
    if (!exam?.id) return;
    setExams(prev => prev.filter(e => e.id !== exam.id));
    setSubmissions(prev => prev.filter(s => s.examId !== exam.id));
    const db = getDb();
    if (db) {
      try { roomRef(db, exam.id).remove(); } catch {}
    }
  }, [setExams, setSubmissions]);

  // Result page: special full-page rendering
  if (page.type === 'result') {
    return <ResultPage submission={page.submission} exam={page.exam} onHome={page.account ? () => setPage({ type: 'studentHome' }) : goHome} />;
  }

  // Exam taking: full-page
  if (page.type === 'exam') {
    return (
      <div>
        <ExamTaker
          exam={page.exam}
          studentName={page.studentName}
          studentClass={page.studentClass}
          account={page.account}
          onSubmit={sub => {
            setSubmissions(s => [...s, sub]);
            setPage({ type: 'result', submission: sub, exam: page.exam, account: page.account });
          }}
          onBack={() => setPage({ type: 'landing' })}
        />
      </div>
    );
  }

  // Exam intro
  if (page.type === 'examIntro') {
    return (
      <div>
        <Topbar userName={page.studentName} role="student" onHome={goHome} />
        <ExamIntro
          exam={page.exam}
          studentName={page.studentName}
          studentClass={page.studentClass}
          onStart={() => setPage({ ...page, type: 'exam' })}
          onBack={() => setPage(page.account ? { type: 'studentHome' } : { type: 'landing' })}
        />
      </div>
    );
  }

  return (
    <div className="app">
      {assigningVariant && (
        <div className="modal-overlay" style={{zIndex:9999}}>
          <div className="modal" style={{maxWidth:360,textAlign:'center'}}>
            <div className="modal-body" style={{padding:28}}>
              <div className="spinner" style={{margin:'0 auto 14px'}} />
              <div style={{fontFamily:'Outfit',fontWeight:700}}>Хувилбар томилж байна...</div>
              <div style={{fontSize:'0.85rem',color:'var(--text2)',marginTop:8}}>Ангид тэнцүү хуваарилна (A/B)</div>
            </div>
          </div>
        </div>
      )}
      {page.type === 'landing' && (
        <>
          <LandingPage onSelect={role => {
            if (role === 'teacher') setPage({ type: 'teacherLogin' });
            if (role === 'student') {
              const u = getAuth()?.currentUser;
              if (u && !u.isAnonymous && localStorage.getItem('se_role') === 'student') { setMeName(u.displayName || 'Сурагч'); setPage({ type: 'studentHome' }); }
              else setPage({ type: 'studentAuth' });
            }
          }} />
        </>
      )}

      {page.type === 'studentAuth' && <StudentAuth onBack={goHome} onDone={n => { setMeName(n); setPage({ type: 'studentHome' }); }} />}
      {page.type === 'studentHome' && (
        <div>
          <Topbar userName={meName || getAuth()?.currentUser?.displayName || 'Сурагч'} role="student" onHome={() => {}} />
          <StudentHome name={meName || getAuth()?.currentUser?.displayName || 'Сурагч'}
            onStart={(exam, account) => setPage({ type: 'examIntro', exam, studentName: meName || getAuth()?.currentUser?.displayName || 'Сурагч', studentClass: '', account })}
            onLogout={async () => { await teacherSignOut(); goHome(); }} />
        </div>
      )}
      {page.type === 'classes' && (
        <div className="has-bnav"><Topbar userName={page.name} role="teacher" onHome={goHome} />
          <ClassesPage exams={exams} onBack={() => setPage({ type: 'teacherDash', name: page.name })} />
          {teacherNav('classes', page)}</div>
      )}

      {page.type === 'teacherLogin' && (
        <>
          <LandingPage onSelect={() => {}} />
          <TeacherLogin
            onLogin={(name) => {
              try { localStorage.setItem(SE_TEACHER, name); } catch {}
              setPage({ type: 'teacherDash', name });
              history.replaceState({ se: 'teacher' }, '', appUrlWithHash('teacher'));
            }}
          />
        </>
      )}

      {page.type === 'teacherDash' && (
        <div className="has-bnav">
          <Topbar
            userName={page.name}
            role="teacher"
            onHome={goHome}
          />
          <div className="container-lg" style={{paddingTop:8}}>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8,flexWrap:'wrap',paddingTop:8}}>
              <button className="btn btn-outline btn-sm" disabled={restoring} onClick={() => restoreExams(false)}>{restoring ? '⏳ Сэргээж байна...' : '☁️ Тестээ сэргээх'}</button>
              <button className="btn btn-violet btn-sm hide-m" onClick={() => setPage({ type: 'classes', name: page.name })}>👥 Ангиуд & дүн</button>
            </div>
            <TeacherDashboard
              exams={exams}
              submissions={submissions}
              teacherName={page.name}
              onCreateExam={() => setPage({ ...page, type: 'createExam' })}
              onEditExam={(exam) => setPage({ ...page, type: 'editExam', exam })}
              onLogout={async () => {
                await teacherSignOut();
                setPage({ type: 'landing' });
                history.replaceState({ se: 'landing' }, '', appUrlWithHash(''));
              }}
              onSaveSubmission={(sub) => setSubmissions(l => [...l, sub])}
              onDeleteExam={deleteExam}
            />
          </div>
          {teacherNav('exams', page)}
        </div>
      )}

      {page.type === 'editExam' && page.exam && (
        <div>
          <Topbar userName={page.name} role="teacher" onHome={goHome} />
          <div className="container-sm" style={{paddingTop:8, paddingBottom:40}}>
            <CreateExam
              key={page.exam.id}
              initialExam={page.exam}
              hasResults={submissions.some(x => x.examId === page.exam.id)}
              onSave={exam => {
                setExams(e => e.map(x => x.id === exam.id ? exam : x));
                setPage({ type: 'teacherDash', name: page.name });
              }}
              onCancel={() => setPage({ type: 'teacherDash', name: page.name })}
            />
          </div>
        </div>
      )}

      {page.type === 'createExam' && (
        <div>
          <Topbar userName={page.name} role="teacher" onHome={goHome} />
          <div className="container-sm" style={{paddingTop:8, paddingBottom:40}}>
            <CreateExam
              onSave={exam => {
                setExams(e => [...e, exam]);
                setPage({ type: 'teacherDash', name: page.name });
              }}
              onCancel={() => setPage({ type: 'teacherDash', name: page.name })}
            />
          </div>
        </div>
      )}

      {page.type === 'qrRoom' && page.roomID && (
        <QRRoomLoader
          roomID={page.roomID}
          onLoaded={(roomExam) => {
            const ck = page.qrClassKey || '';
            const guessed = ck ? displayClassName(ck, ck) : '';
            // Show name screen immediately — refine class label in background
            setPage({
              type: 'qrStudent',
              exam: { ...roomExam, roomID: roomExam.roomID || page.roomID, qrClassKey: ck, qrClassName: guessed }
            });
            const db = getDb();
            if (ck && db) {
              roomRef(db, page.roomID).child('classes').child(ck).once('value')
                .then(snap => {
                  const name = snap.val()?.name;
                  if (!name) return;
                  setPage(p => (p.type === 'qrStudent' ? {
                    ...p,
                    exam: { ...p.exam, qrClassName: name }
                  } : p));
                })
                .catch(() => {});
            }
          }}
          onBack={goHome}
        />
      )}

      {page.type === 'qrStudent' && page.exam && (
        <QRStudentLogin
          exam={page.exam}
          qrClassName={page.exam.qrClassName}
          onStart={(name, cls) => startStudentExam(page.exam, name, cls)}
          onBack={goHome}
        />
      )}
    </div>
  );
}

function Root() {
  if (isAdminRoute()) return <AdminApp />;
  return <App />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
