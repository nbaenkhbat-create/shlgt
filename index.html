                <div className="form-group"><label className="form-label">Нэр (хоосон бол сурагч өөрөө бичнэ)</label><input className="form-input" value={pName} onChange={e => setPName(e.target.value)} /></div>
                <div className="form-group"><label className="form-label">Анги</label><input className="form-input" value={pClass} onChange={e => setPClass(e.target.value)} /></div>
                <div className="form-group"><label className="form-label">Огноо</label><input className="form-input" value={pDate} onChange={e => setPDate(e.target.value)} placeholder="2026-10-11" /></div>
              </div>
              {(() => {
                const L = layClamp(lay), k = L.scale / 100, BW = 210;
                const startDrag = (e, resize) => {
                  e.preventDefault(); e.stopPropagation();
                  const box = prevRef.current.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ox = L.x, oy = L.y, os = L.scale;
                  const move = (ev) => {
                    const dx = (ev.clientX - sx) / box.width * 210, dy = (ev.clientY - sy) / box.height * 297;
                    setLay(cur => resize ? { ...cur, scale: Math.max(50, Math.min(100, Math.round(os + dx / 210 * 100))) } : { ...cur, x: ox + dx, y: cur.mode === 'flow' ? 0 : oy + dy });
                  };
                  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
                  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
                };
                const svgPrev = window.ZG ? window.ZG.sheetSVG({ qCount, choices, studentName: pName, studentClass: pClass, date: pDate }).replace(/width="210mm" height="297mm"/, 'width="100%" height="100%"') : '';
                return (
                  <div style={{ border: '1px solid var(--border)', borderRadius: 14, padding: 12, marginBottom: 14 }}>
                    <div style={{ fontWeight: 700, marginBottom: 8 }}>✋ Хариултын хуудасны хэмжээ / байрлал</div>
                    <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
                      <div ref={prevRef} style={{ position: 'relative', width: 190, height: 190 * 297 / 210, background: '#fff', border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden', flex: '0 0 auto', touchAction: 'none', userSelect: 'none' }}>
                        {flowMode && <div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(#e5e7eb 0 3px, transparent 3px 11px)', opacity: .7 }} />}
                        <div onPointerDown={e => startDrag(e, false)} style={{ position: 'absolute', left: (L.x / BW * 100) + '%', top: (L.y / 297 * 100) + '%', width: (k * 100) + '%', height: (k * 100) + '%', boxShadow: '0 0 0 2px var(--violet), 0 4px 14px rgba(0,0,0,.25)', cursor: 'move', background: '#fff' }}>
                          <div style={{ width: '100%', height: '100%', pointerEvents: 'none' }} dangerouslySetInnerHTML={{ __html: svgPrev }} />
                          <div onPointerDown={e => startDrag(e, true)} title="Томруулах / жижигсгэх" style={{ position: 'absolute', right: -7, bottom: -7, width: 18, height: 18, borderRadius: 9, background: 'var(--violet)', border: '2px solid #fff', cursor: 'nwse-resize' }} />
                        </div>
                      </div>
                      <div style={{ flex: '1 1 200px', minWidth: 0 }}>
                        <div className="form-group"><label className="form-label">Байршил</label>
                          <select className="form-select" value={lay.mode} onChange={e => setLay(c => ({ ...c, mode: e.target.value }))}>
                            <option value="page">Тусдаа A4 хуудас дээр (чирж зөөнө)</option>
                            <option value="flow">Асуултуудын хамт, хуудас хуваахгүй</option>
                          </select></div>
                        <div className="form-group"><label className="form-label">Хэмжээ: {L.scale}%</label>
                          <input type="range" min="50" max="100" value={L.scale} onChange={e => setLay(c => ({ ...c, scale: +e.target.value }))} style={{ width: '100%' }} /></div>
                        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                          <button className="btn btn-outline btn-sm" onClick={() => setLay(c => ({ ...c, x: 210 * (1 - c.scale / 100) / 2, y: c.mode === 'flow' ? 0 : 297 * (1 - c.scale / 100) / 2 }))}>🎯 Төвд</button>
                          <button className="btn btn-outline btn-sm" onClick={() => setLay(c => ({ ...c, x: 0, y: 0 }))}>↖ Зүүн дээш</button>
                          <button className="btn btn-ghost btn-sm" onClick={() => setLay(c => ({ ...c, scale: 100, x: 0, y: 0 }))}>↺ Анхны</button>
                        </div>
                        <div className="form-hint" style={{ marginTop: 8 }}>Ягаан хүрээг чирж зөөнө, булангийн цэгээр томруулна. 4 булангийн хар тэмдэг хуудаснаас гарахгүй. 70%-иас жижиг бол дугуй жижиг болж будахад хэцүү.</div>
                      </div>
                    </div>
                  </div>
                );
              })()}
              <div style={{ border: '1px solid var(--border)', borderRadius: 14, padding: 12, marginBottom: 14 }}>
                <div style={{ fontWeight: 700, marginBottom: 8 }}>📄 Шалгалтын материал + хариултын хуудас</div>
                <div className="form-row">
                  <div className="form-group"><label className="form-label">Хариултын хуудас хаана орох вэ?</label>
                    <select className="form-select" value={sheetPos} onChange={e => setSheetPos(e.target.value)}>
                      <option value="end">Хамгийн ард (анхдагч)</option>
                      <option value="start">Хамгийн эхэнд</option>
                      <option value="after">Тодорхой асуултын дараа</option>
                      <option value="none">Оруулахгүй (зөвхөн материал)</option>
                    </select></div>
                  {sheetPos === 'after' && (
                    <div className="form-group"><label className="form-label">Хэддүгээр асуултын дараа (0 = эхэнд)</label>
                      <input className="form-input" type="number" min="0" max={objQs(variants[vi]).length + 99} value={sheetAfter} onChange={e => setSheetAfter(Math.max(0, +e.target.value || 0))} /></div>
                  )}
                </div>
                {variants.length > 1 && (
                  <label style={{ display: 'flex', gap: 8, alignItems: 'center', fontSize: '0.85rem', marginBottom: 8 }}>
                    <input type="checkbox" checked={allVariants} onChange={e => setAllVariants(e.target.checked)} /> Бүх хувилбарыг дараалуулж хэвлэх ({variants.map(v => v.label || 'A').join(', ')})
                  </label>
                )}
                <div className="form-hint" style={{ marginBottom: 8 }}>
                  Дараалал: {sheetPos === 'none' ? '📄 Асуултууд' : sheetPos === 'start' ? '⬛ Хариултын хуудас → 📄 Асуултууд' : sheetPos === 'after' ? ('📄 1–' + sheetAfter + '-р асуулт → ⬛ Хариултын хуудас → 📄 үлдсэн асуултууд') : '📄 Асуултууд → ⬛ Хариултын хуудас'}
                </div>
                <button className="btn btn-primary" onClick={printPaper}>🖨 Материал + хуудас хэвлэх / PDF</button>
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 14 }}>
                <button className="btn btn-violet" onClick={() => printSVG(false)}>🖨 Зөвхөн хариултын хуудас</button>
                <button className="btn btn-outline" onClick={() => printSVG(true)} disabled={!keyedCount}>🔑 Түлхүүр хуудас хэвлэх</button>
              </div>
              <div style={{ overflow: 'auto', border: '1px solid var(--border)', borderRadius: 12, background: '#fff', maxWidth: 520 }}
                dangerouslySetInnerHTML={{ __html: window.ZG ? window.ZG.sheetSVG({ qCount, choices, title: exam.title, variant: variants[vi]?.label, studentName: pName, studentClass: pClass, date: pDate }).replace(/width="210mm" height="297mm"/, 'width="100%"') : '' }} />
            </div>
          )}
        </div></div>
      </div>
      {big && (
        <div className="modal-overlay" onClick={() => setBig(null)}>
          <img src={big} alt="" style={{ maxWidth: '96vw', maxHeight: '92vh', borderRadius: 10, background: '#fff' }} />
        </div>
      )}
    </div>
  );
}


function TeacherDashboard({ exams, submissions: localSubs, teacherName, onCreateExam, onEditExam, onDeleteExam, onLogout, onSaveSubmission }) {
  const [view, setView] = useState(null);
  const [qrExam, setQrExam] = useState(null);
  const [cheatSub, setCheatSub] = useState(null);
  const [delExam, setDelExam] = useState(null);
  const [stopExam, setStopExam] = useState(null);
  const [rtdbSubs, setRtdbSubs] = useState(null);
  const [, forceUpdate] = useState(0);
  const [cloudSubs, setCloudSubs] = useState({});
  const [cloudSubsErr, setCloudSubsErr] = useState('');

  // Дүнг Firebase-ээс татна (өөр төхөөрөмж/файлаас нээсэн ч дүн харагдана)
  const examIdsKey = (exams || []).map(e => e.id).join(',');
  useEffect(() => {
    const db = getDb();
    if (!db || !examIdsKey) return;
    let alive = true;
    const failed = [];
    (async () => {
      const acc = {};
      await Promise.all(examIdsKey.split(',').map(async (id) => {
        try {
          const snap = await roomRef(db, id).child('submissions').once('value');
          acc[id] = Object.values(snap.val() || {}).filter(Boolean).map(x => ({ ...x, examId: x.examId || id }));
        } catch (e) { failed.push(id); }
      }));
      if (!alive) return;
      setCloudSubs(acc);
      setCloudSubsErr(failed.length ? 'Зарим тестийн дүнг серверээс уншиж чадсангүй (' + failed.length + ')' : '');
    })();
    return () => { alive = false; };
  }, [examIdsKey]);

  // Локал + серверийн дүнг нэгтгэнэ (давхардлыг id-аар арилгана)
  const submissions = useMemo(() => {
    const seen = new Set(); const out = [];
    const add = (s) => {
      if (!s) return;
      const k = s.examId + '|' + (s.id || (s.studentName + '|' + (s.submittedAt || s.createdAt || s.at || '')));
      if (seen.has(k)) return; seen.add(k); out.push({ ...s, score: Number(s.score) || 0 });
    };
    Object.values(cloudSubs).forEach(list => (list || []).forEach(add));
    (localSubs || []).forEach(add);
    return out;
  }, [cloudSubs, localSubs]);

  // Сурагчид багшийн нэр харагдахын тулд ангиудад багшийн нэрийг хадгална
  useEffect(() => {
    const db = getDb(); const tu = getAuth()?.currentUser;
    const tn = teacherName || tu?.displayName || localStorage.getItem(SE_TEACHER);
    if (!db || !tu || !tn) return;
    db.ref('classes').orderByChild('teacherUid').equalTo(tu.uid).once('value').then(sn => {
      Object.entries(sn.val() || {}).forEach(([id, c]) => { if (c.teacherName !== tn) db.ref('classes/' + id + '/teacherName').set(tn).catch(e => console.warn('teacherName', e)); });
    }).catch(() => {});
  }, [teacherName]);

  // Ensure clientPack exists for fast student/QR load
  useEffect(() => {
    const db = getDb();
    const teacher = ensureTeacherAuth();
    if (!db || !teacher || !exams?.length) return;
    exams.forEach(exam => {
      if (!exam?.id) return;
      const versions = {};
      normalizeVariants(exam).forEach(v => {
        const qs = (v.questions || []).filter(q => (q.text || '').trim());
        if (qs.length) versions[v.label || 'A'] = packQuestions(qs);
      });
      if (!Object.keys(versions).length) return;
      ensureClientPackIfMissing(db, exam, teacher.uid, versions);
    });
  }, [exams]);

  // Realtime submissions across devices (optional)
  useEffect(() => {
    if (view?.type !== 'results' || !view?.exam?.id) { setRtdbSubs(null); return; }
    const db = getDb();
    if (!db) { setRtdbSubs(null); return; }
    try {
      const ref = roomRef(db, view.exam.id).child('submissions');
      const handler = ref.on('value', (snap) => {
        const val = snap.val() || {};
        const list = Object.values(val).filter(Boolean);
        setRtdbSubs(list);
      });
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {
      setRtdbSubs(null);
    }
  }, [view?.type, view?.exam?.id]);

  if (view?.type === 'zipgrade') {
    return <ZipGradeExam exam={view.exam} initialTab={view.tab} onBack={() => setView(null)} onSaveSubmission={onSaveSubmission} />;
  }

  if (view?.type === 'results') {
    const allSubs = Array.isArray(rtdbSubs) && rtdbSubs.length ? rtdbSubs : submissions.filter(s => s.examId === view.exam.id);
    return (
      <ExamResultsView
        exam={view.exam}
        allSubs={allSubs}
        onBack={() => setView(null)}
        onCheatClick={setCheatSub}
        cheatSub={cheatSub}
        onCheatClose={() => setCheatSub(null)}
      />
    );
  }

  return (
    <div>
      {qrExam && <QRModal exam={qrExam} onClose={() => setQrExam(null)} />}
      {cheatSub && <CheatDetailModal sub={cheatSub} onClose={() => setCheatSub(null)} />}
      {delExam && (
        <ConfirmDeleteModal
          title={delExam.title}
          onCancel={() => setDelExam(null)}
          onConfirm={() => { onDeleteExam?.(delExam); setDelExam(null); }}
        />
      )}
      {stopExam && (
        <ConfirmStopModal
          title={stopExam.title}
          onCancel={() => setStopExam(null)}
          onConfirm={() => {
            const db = getDb();
            if (db) {
              try {
                roomRef(db, stopExam.id).update({
                  stopped: true,
                  stoppedAt: firebase.database.ServerValue.TIMESTAMP
                });
              } catch {}
            }
            setStopExam(null);
          }}
        />
      )}
      <div className="page-header">
        <div className="container-lg" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
          <div>
            <h2 className="page-title">👋 Сайн байна уу, {teacherName}</h2>
            <div className="page-sub">Таны шалгалтын хяналтын самбар</div>
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-primary btn-sm hide-m" onClick={onCreateExam}>+ Шинэ тест</button>
            {onLogout && <button className="btn btn-ghost btn-sm hide-m" onClick={onLogout} title="Гарах">🚪 Гарах</button>}
          </div>
        </div>
      </div>

      <div className="container-lg">
        <div className="stats-strip">
          <div className="stat-card"><div className="stat-val">{exams.length}</div><div className="stat-lbl">Нийт тест</div></div>
          <div className="stat-card"><div className="stat-val">{submissions.length}</div><div className="stat-lbl">Нийт дүн</div>{cloudSubsErr && <div className="form-hint" style={{color:'var(--red, #dc2626)'}}>{cloudSubsErr}</div>}</div>
          <div className="stat-card">
            <div className="stat-val" style={{color:'var(--green)'}}>
              {submissions.length ? Math.round(submissions.reduce((a,s) => a+s.score, 0) / submissions.length) : 0}%
            </div>
            <div className="stat-lbl">Нийт дундаж</div>
          </div>
        </div>

        {exams.length === 0 ? (
          <div className="card">
            <div className="card-body">
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-title">Тест байхгүй байна</div>
                <div className="empty-sub">Шинэ тест үүсгэж, сурагчдад нийтлэнэ үү</div>
                <button className="btn btn-primary" onClick={onCreateExam}>+ Шинэ тест үүсгэх</button>
              </div>
            </div>
          </div>
        ) : (
          <div className="exam-grid">
            {exams.map(exam => {
              const subs = submissions.filter(s => s.examId === exam.id);
              const avg = subs.length ? Math.round(subs.reduce((a,s) => a+s.score, 0) / subs.length) : null;
              const vars = normalizeVariants(exam);
              const vCount = vars.length;
              const qCount = (vars[0]?.questions || []).length;
              return (
                <div className="exam-card" key={exam.id} onClick={() => onEditExam ? onEditExam(exam) : setQrExam(exam)} style={{cursor:'pointer'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                    <div className="exam-card-title">{exam.title}</div>
                    <span className="badge badge-green" style={{flexShrink:0,marginLeft:8}}>✓ Нийтлэгдсэн</span>
                  </div>
                  <div className="exam-card-meta">
                    <span>📚 {exam.subject}</span>
                    <span>❓ {qCount} асуулт</span>
                    <span>⏱ {durationLabel(exam.duration)}</span>
                    <span>🎯 <strong style={{color:'var(--violet)'}}>{vCount} хувилбар</strong> ({vars.map(v=>v.label||'A').join(', ')})</span>
                  </div>
                  <div style={{display:'flex',gap:12,fontSize:'0.82rem',color:'var(--text2)',marginBottom:10}}>
                    <span>👥 {subs.length} оролцсон</span>
                    {avg !== null && <span>📊 Дундаж: <strong style={{color:'var(--text)'}}>{avg}%</strong></span>}
                  </div>
                  <div className="exam-card-actions">
                    <button className="btn btn-primary btn-sm" onClick={(e) => { e.stopPropagation(); onEditExam ? onEditExam(exam) : null; }}>✏️ Засах</button>
                    <button className="btn btn-outline btn-sm" onClick={(e) => { e.stopPropagation(); setView({type:'results', exam}); }}>📊 Үр дүн</button>
                    <MoreMenu items={[
                      { label: '⬛ ZipGrade', onClick: () => setView({type:'zipgrade', exam}) },
                      { label: '🖨 Хэвлэх', onClick: () => setView({type:'zipgrade', exam, tab:'print'}) },
                      { label: '⏹ Зогсоох', onClick: () => setStopExam(exam) },
                      { label: '🗑 Устгах', danger: true, onClick: () => setDelExam(exam) }
                    ]} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── EXAM INTRO ───────────────────────────────────────────────────────────────
function ExamIntro({ exam, studentName, studentClass, onStart, onBack }) {
  const qCount = (exam.questions || []).length;
  // Оролдлогын дээд тоо (багшийн тохиргоо) ба сурагчийн өгсөн бүтэн оролдлогын тоо
  const [att, setAtt] = useState(null); // { cap, used }
  useEffect(() => {
    let ok = true;
    (async () => {
      let cap = exam.maxAttempts > 0 ? exam.maxAttempts : 0, used = 0, mode = exam.scoreMode || 'best';
      try {
        const db = getDb();
        if (db) {
          const st = (await roomRef(db, exam.id).child('settings').once('value')).val() || {};
          if (st.maxAttempts > 0) cap = st.maxAttempts;
          if (st.scoreMode) mode = st.scoreMode;
          const u = getAuth()?.currentUser;
          if (u && !u.isAnonymous) {
            const a = (await db.ref('attempts/' + u.uid + '/' + exam.id).once('value')).val() || {};
            used = Object.values(a).filter(x => x.mode !== 'mistakes' && !x.extra).length;
          }
        }
      } catch (_) {}
      if (!used) {
        try {
          const loc = JSON.parse(localStorage.getItem('se_submissions') || '[]');
          used = loc.filter(x => x.examId === exam.id && x.studentName === studentName && !x.subset && x.mode !== 'mistakes').length;
        } catch (_) {}
      }
      if (ok) setAtt({ cap, used, mode });
    })();
    return () => { ok = false; };
  }, [exam.id]);
  const capI = att?.cap || 0, usedI = att?.used || 0, modeI = att?.mode || exam.scoreMode || 'best';
  const modeTxt = modeI === 'avg' ? 'Бүх оролдлогын ДУНДАЖ оноо дүнд тооцогдоно.' : modeI === 'last' ? 'Хамгийн СҮҮЛИЙН оролдлогын оноо дүнд тооцогдоно.' : 'Хамгийн ӨНДӨР оноо дүнд тооцогдоно.';
  const leftI = Math.max(0, capI - usedI);
  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:520}}>
        <div className="modal-head">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:44,height:44,borderRadius:12,background:'var(--violet-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem'}}>📝</div>
            <div>
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>{exam.title}</div>
              <div style={{fontSize:'0.8rem',color:'var(--text2)'}}>{exam.subject}</div>
            </div>
          </div>
        </div>
        <div className="modal-body">
          <div style={{background:'var(--surface2)',borderRadius:10,padding:'16px',marginBottom:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[
              ['📋 Асуултын тоо', qCount + ' асуулт'],
              ['⏱ Хугацаа', durationLabel(exam.duration)],
              ['✅ Тэнцэх босго', exam.passingScore + '%'],
              ['👤 Сурагч', studentName + (studentClass ? ' · ' + studentClass : '')],
              ...(exam.variantLabel ? [['🎯 Таны хувилбар', 'Хувилбар ' + exam.variantLabel]] : []),
            ].map(([lbl,val]) => (
              <div key={lbl}>
                <div style={{fontSize:'0.75rem',color:'var(--text3)',fontWeight:600}}>{lbl}</div>
                <div style={{fontSize:'0.9rem',fontWeight:600,color:'var(--text)',marginTop:2}}>{val}</div>
              </div>
            ))}
          </div>
          {(capI === 0 || leftI > 0) ? (
            <div style={{background:'#eff6ff',border:'1px solid #93c5fd',borderRadius:8,padding:'10px 14px',fontSize:'0.82rem',color:'#1e40af',marginBottom:10}}>
              🔁 {capI > 0 ? <>Үлдсэн оролдлого: <b>{leftI}</b> / {capI}.</> : <>Оролдлогын тоо хязгааргүй.</>} {modeTxt}
            </div>
          ) : (
            <div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:8,padding:'10px 14px',fontSize:'0.82rem',color:'#991b1b',fontWeight:600,marginBottom:10}}>
              ⚠️ Бүх {capI} оролдлого дууссан. Одоо өгвөл дүнд ТООЦОГДОХГҮЙ (зөвхөн дадлага).
            </div>
          )}
          <div style={{background:'var(--amber-light)',border:'1px solid #fcd34d',borderRadius:8,padding:'10px 14px',fontSize:'0.82rem',color:'#92400e'}}>
            {examDurationOf(exam) > 0
              ? '⚠️ Шалгалт эхэлсэн даруйд хугацааны тоолол эхэлнэ. Анхааралтай уншаарай.'
              : '⏱ Энэ шалгалт цаггүй. Дууссаны дараа «Дуусгах» дарна уу.'}
            {exam.antiCheat === false ? ' · Чит хамгаалалт унтраалттай.' : ''}
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={onBack}>← Буцах</button>
          <button className="btn btn-violet btn-lg" onClick={onStart} disabled={!!exam.stopped}>▶ Эхлэх</button>
        </div>
      </div>
    </div>
  );
}

// ─── EXAM TAKER ───────────────────────────────────────────────────────────────
function ExamTaker({ exam, studentName, studentClass, account, onSubmit, onBack }) {
  const timed = examDurationOf(exam) > 0;
  const antiOn = exam.antiCheat !== false;
  const [answers, setAnswers] = useState({});
  const [timeLeft, setTimeLeft] = useState(timed ? examDurationOf(exam) * 60 : 0);
  const [submitted, setSubmitted] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);
  const [cheatLog, setCheatLog] = useState([]);
  const [cheatWarning, setCheatWarning] = useState('');
  const [showFlash, setShowFlash] = useState(false);
  const [stoppedNow, setStoppedNow] = useState(false);
  const submittedRef = useRef(false);
  const cheatLogRef = useRef([]);
  const startMsRef = useRef(Date.now());

  const orderedQuestions = useMemo(() => exam.questions || [], [exam]);

  const cheatArmedRef = useRef(false);
  const cheatGraceUntilRef = useRef(Date.now() + 5000);
  const cheatLastLogRef = useRef(0);
  const hiddenAtRef = useRef(0);
  const blurAtRef = useRef(0);
  const splitCheckTimerRef = useRef(null);

  const cheatExempt = useMemo(() => isCheatExempt(studentName), [studentName]);

  const logCheat = useCallback((type, detail) => {
    if (!antiOn) return;
    if (submittedRef.current || !cheatArmedRef.current) return;
    if (cheatExempt) return;
    if (Date.now() < cheatGraceUntilRef.current) return;
    const now = Date.now();
    if (now - cheatLastLogRef.current < 3000) return;
    cheatLastLogRef.current = now;
    const entry = { type, detail, time: new Date().toISOString() };
    cheatLogRef.current = [...cheatLogRef.current, entry];
    setCheatLog([...cheatLogRef.current]);
    setCheatWarning(detail);
    setShowFlash(true);
    setTimeout(() => setCheatWarning(''), 3500);
    setTimeout(() => setShowFlash(false), 400);
  }, [cheatExempt, antiOn]);

  // Шалгалт эхэлсний дараа л чит хяналт идэвхжинэ (эхний 5 сек — zoom/focus алдаа)
  useEffect(() => {
    cheatArmedRef.current = false;
    cheatGraceUntilRef.current = Date.now() + 5000;
    const arm = setTimeout(() => { cheatArmedRef.current = true; }, 5000);
    const meta = document.querySelector('meta[name="viewport"]');
    const prevVp = meta?.getAttribute('content') || '';
    if (meta) {
      meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
    }
    return () => {
      clearTimeout(arm);
      if (meta && prevVp) meta.setAttribute('content', prevVp);
    };
  }, []);

  // Timer
  useEffect(() => {
    if (submitted || !timed) return;
    const t = setInterval(() => {
      setTimeLeft(s => {
        if (s <= 1) { clearInterval(t); doSubmit({}); return 0; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [submitted, timed]);

  // Anti-cheat: таб солих — зөвхөн буцаж ирэхэд, ≥0.8 сек гадуур байсан бол
  useEffect(() => {
    const onVis = () => {
      if (document.hidden) {
        hiddenAtRef.current = Date.now();
        return;
      }
      if (!hiddenAtRef.current) return;
      const awayMs = Date.now() - hiddenAtRef.current;
      hiddenAtRef.current = 0;
      if (awayMs >= 800) {
        logCheat('TAB_SWITCH', '🔀 Өөр таб/апп руу ' + Math.round(awayMs / 1000) + ' сек орсон');
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [logCheat]);

  // Anti-cheat: blur — zoom UI, түр focus алдалт биш; ≥2 сек + таб нуугдаагүй үед л
  useEffect(() => {
    const onBlur = () => { if (!document.hidden) blurAtRef.current = Date.now(); };
    const onFocus = () => {
      if (!blurAtRef.current || document.hidden) { blurAtRef.current = 0; return; }
      const awayMs = Date.now() - blurAtRef.current;
      blurAtRef.current = 0;
      if (awayMs >= 2000) {
        logCheat('WINDOW_BLUR', '👁 Шалгалтын цонхноос ' + Math.round(awayMs / 1000) + ' сек гарсан');
      }
    };
    window.addEventListener('blur', onBlur);
    window.addEventListener('focus', onFocus);
    return () => {
      window.removeEventListener('blur', onBlur);
      window.removeEventListener('focus', onFocus);
    };
  }, [logCheat]);

  // Anti-cheat: copy
  useEffect(() => {
    const onCopy = () => logCheat('COPY', '📋 Текст хуулсан');
    document.addEventListener('copy', onCopy);
    return () => document.removeEventListener('copy', onCopy);
  }, [logCheat]);

  // Anti-cheat: right click
  useEffect(() => {
    const onRC = e => { e.preventDefault(); logCheat('RIGHT_CLICK', '🖱 Баруун товчлуур');
    };
    document.addEventListener('contextmenu', onRC);
    return () => document.removeEventListener('contextmenu', onRC);
  }, [logCheat]);

  // Anti-cheat: Translate — хуудас дээр class нэмэгдсэн үед л (түр биш)
  useEffect(() => {
    let translateTimer = null;
    const obs = new MutationObserver(() => {
      const cls = document.documentElement.className || '';
      if (!cls.includes('translated')) return;
      if (translateTimer) return;
      translateTimer = setTimeout(() => {
        translateTimer = null;
        if ((document.documentElement.className || '').includes('translated')) {
          logCheat('TRANSLATE', '🌐 Хуудас орчуулагдсан (Translate)');
        }
      }, 1500);
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return () => { obs.disconnect(); if (translateTimer) clearTimeout(translateTimer); };
  }, [logCheat]);

  // Anti-cheat: split-screen — zoom биш; жижиг цонх 2+ сек тогтвортой байвал л
  useEffect(() => {
    let vpLast = {
      w: window.visualViewport?.width ?? window.innerWidth,
      h: window.visualViewport?.height ?? window.innerHeight,
      scale: window.visualViewport?.scale ?? 1
    };

    const measureViewport = () => {
      const vp = window.visualViewport;
      const w = vp?.width ?? window.innerWidth;
      const h = vp?.height ?? window.innerHeight;
      const scale = vp?.scale ?? 1;
      const sw = window.screen?.width || w;
      const sh = window.screen?.height || h;
      return { w, h, scale, ratioW: w / sw, ratioH: h / sh };
    };

    const scheduleSplitCheck = () => {
      if (splitCheckTimerRef.current) clearTimeout(splitCheckTimerRef.current);
      splitCheckTimerRef.current = setTimeout(() => {
        splitCheckTimerRef.current = null;
        const { ratioW, ratioH } = measureViewport();
        if (ratioW < 0.58 && ratioH < 0.58) {
          logCheat('SPLIT_SCREEN', '🪟 Дэлгэц хуваасан эсвэл цонх маш жижигрүүлсэн');
        }
      }, 2200);
    };

    const onViewportChange = () => {
      const m = measureViewport();
      const dw = Math.abs(m.w - vpLast.w);
      const dh = Math.abs(m.h - vpLast.h);
      const dScale = Math.abs(m.scale - vpLast.scale);
      vpLast = { w: m.w, h: m.h, scale: m.scale };

      // Pinch / browser zoom — scale өөрчлөгдвөл чит биш
      if (dScale > 0.04) return;
      if (dw + dh < 90) return;

      if (m.ratioW < 0.58 && m.ratioH < 0.58) scheduleSplitCheck();
      else if (splitCheckTimerRef.current) {
        clearTimeout(splitCheckTimerRef.current);
        splitCheckTimerRef.current = null;
      }
    };

    const vp = window.visualViewport;
    if (vp) {
      vp.addEventListener('resize', onViewportChange);
      vp.addEventListener('scroll', onViewportChange);
    }
    window.addEventListener('resize', onViewportChange);
    return () => {
      if (vp) {
        vp.removeEventListener('resize', onViewportChange);
        vp.removeEventListener('scroll', onViewportChange);
      }
      window.removeEventListener('resize', onViewportChange);
      if (splitCheckTimerRef.current) clearTimeout(splitCheckTimerRef.current);
    };
  }, [logCheat]);

  // Teacher force-stop (Firebase room flag)
  useEffect(() => {
    const db = getDb();
    if (!db || !exam?.id) return;
    try {
      const ref = roomRef(db, exam.id).child('stopped');
      const handler = ref.on('value', (snap) => {
        if (submittedRef.current) return;
        if (snap.val() === true) {
          setStoppedNow(true);
          logCheat('FORCE_STOP', '⏹ Багш шалгалтыг зогсоосон');
          // Auto-submit current answers (best-effort)
          setTimeout(() => doSubmit({}), 350);
        }
      });
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {}
  }, [exam?.id, logCheat]);

  const doSubmit = useCallback((extraAnswers) => {
    if (submittedRef.current) return;
    submittedRef.current = true;
    const ans = { ...answers, ...extraAnswers };
    orderedQuestions.forEach(q => { if (q._map && q._map[ans[q.id]]) ans[q.id] = q._map[ans[q.id]]; });
    Object.keys(ans).forEach(k => {
      // "_" цэвэрлэгээ зөвхөн grid-in-д (нөхөх хариултын доогуур зураасыг гэмтээхгүй)
      const qq = orderedQuestions.find(x => String(x.id) === String(k));
      if (qq && (qq.type || 'mcq') !== 'grid') return;
      if (typeof ans[k] === 'string' && ans[k].includes('_')) {
        // Grid-in: Зуун/Аравт/Нэгж баганын байрлал чухал. Хоосон багана = 0 ("1_5" → "105")
        ans[k] = /^[\d_]{3}$/.test(ans[k]) && /\d/.test(ans[k])
          ? ans[k].replace(/_/g, '0')
          : ans[k].replace(/_/g, '');
      }
    });
    const timeSpentSec = Math.round((Date.now() - startMsRef.current) / 1000);
    setSubmitted(true);

    (async () => {
      let submission = {
        id: uid(),
        examId: exam.id,
        studentName: sanitizeText(studentName, 80),
        studentClass: sanitizeText(studentClass, 40),
        answers: ans,
        score: 0,
        correctCount: 0,
        totalCount: (exam.questions || []).length,
        timeSpentSec,
        variantIndex: exam.variantIndex ?? 0,
        variantLabel: exam.variantLabel || alpha(exam.variantIndex ?? 0),
        cheatLog: cheatLogRef.current,
        submittedAt: new Date().toISOString(),
        verified: false,
        gradedBy: 'pending',
        subset: exam._subset || null,
        mode: exam._subset ? 'mistakes' : 'full'
      };

      try {
        const user = await ensureStudentAuth();
        submission.uid = user.uid;

        // Prefer Cloud Function grading (answers never leave server for scoring)
        try {
          const graded = await callGradeSubmission({
            roomId: exam.id,
            answers: ans,
            studentName: submission.studentName,
            studentClass: submission.studentClass,
            variantLabel: submission.variantLabel,
            subset: exam._subset || null,
            cheatLog: submission.cheatLog,
            timeSpentSec,
            attempt: account ? { classId: account.classId, kind: account.kind, extra: !!exam._extra, title: exam.title || '' } : null
          });
          submission = {
            ...submission,
            id: graded.id || submission.id,
            score: graded.score,
            correctCount: graded.correctCount,
            totalCount: graded.totalCount,
            verified: true,
            gradedBy: 'cloud',
            wrongIds: Array.isArray(graded.wrongIds) ? graded.wrongIds : null
          };
          if (exam._subset) {
            try {
              const dbm = getDb();
              if (dbm) roomRef(dbm, exam.id).child('submissions').child(submission.id).update({ subset: exam._subset, mode: 'mistakes' }).catch(() => {});
            } catch (_) {}
          }
          if (exam._subset && submission.wrongIds) {
            const w = submission.wrongIds.filter(i => exam._subset.includes(i));
            submission.wrongIds = w; submission.totalCount = exam._subset.length;
            submission.correctCount = submission.totalCount - w.length;
            submission.score = Math.round(submission.correctCount / submission.totalCount * 100);
          }
        } catch (fnErr) {
          // Fallback: store answers only; teacher regrades. Provisional score = unanswered count only.
          console.warn('Cloud grade failed, storing answers for teacher regrade', fnErr);
          // 0% гэж харуулахын оронд серверийн алдааг сурагчид харуулна
          submission.provisional = true;
          submission.gradeError = String((fnErr && (fnErr.code || fnErr.message)) || fnErr || 'unknown').slice(0, 200);
          const db = getDb();
          if (db) {
            await roomRef(db, exam.id).child('submissions').child(submission.id).set({
              ...submission,
              studentVersion: submission.variantLabel,
              score: 0,
              provisional: true,
              note: 'Багш дахин дүгнэнэ'
            });
          }
        }
      } catch (e) {
        console.warn('Submit auth/save error', e);
      }

      onSubmit(submission);
    })();
  }, [answers, exam, studentName, studentClass, onSubmit]);

  const answered = Object.keys(answers).length;
  const total = orderedQuestions.length;
  const timerClass = timeLeft < 60 ? 'danger' : timeLeft < 300 ? 'warn' : '';
  const cheatCnt = cheatLog.length;

  return (
    <div className="exam-taking-root">
      {/* Cheat flash overlay */}
      {showFlash && antiOn && !cheatExempt && <div className="cheat-overlay" />}

      {/* Cheat warning toast */}
      {cheatWarning && antiOn && !cheatExempt && (
        <div className="cheat-warning">
          <span className="cheat-badge">⚠ ЧИТ</span>
          {cheatWarning}
        </div>
      )}

      {stoppedNow && (
        <div className="cheat-warning" style={{background:'#7f1d1d'}}>
          <span className="cheat-badge" style={{background:'#ef4444'}}>⏹</span>
          Багш шалгалтыг зогсоосон — автоматаар дуусгаж байна...
        </div>
      )}

      {/* Confirm dialog */}
      {showConfirm && (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth:400}}>
            <div className="modal-head"><div style={{fontFamily:'Outfit',fontWeight:800}}>⚠️ Шалгалт дуусгах уу?</div></div>
            <div className="modal-body">
              <p style={{fontSize:'0.9rem',color:'var(--text2)'}}>
                {answered < total
                  ? `Та ${total - answered} асуултанд хариулаагүй байна. Шалгалтыг дуусгахуу?`
                  : 'Бүх асуултанд хариуллаа. Шалгалтыг дуусгахуу?'}
              </p>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={() => setShowConfirm(false)}>Үргэлжлүүлэх</button>
              <button className="btn btn-green" onClick={() => doSubmit({})}>✓ Дуусгах</button>
            </div>
          </div>
        </div>
      )}

      <div className="exam-header-bar">
        <div>
          <div className="exam-title-bar">{exam.title}</div>
          <div style={{fontSize:'0.78rem',color:'var(--text2)'}}>
            {answered}/{total} хариуллаа
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          {cheatCnt > 0 && antiOn && !cheatExempt && (
            <div style={{background:'var(--red-light)',color:'var(--red)',padding:'5px 12px',borderRadius:20,fontSize:'0.78rem',fontWeight:700}}>
              ⚠ {cheatCnt} чит
            </div>
          )}
          <div className={`timer-badge ${timed ? timerClass : ''}`}>
            ⏱ {timed ? fmt(timeLeft) : 'Цаггүй'}
          </div>
          <button className="btn btn-green btn-sm" onClick={() => setShowConfirm(true)}>✓ Дуусгах</button>
        </div>
      </div>

      {/* Progress */}
      <div style={{padding:'8px 24px',background:'white',borderBottom:'1px solid var(--border)'}}>
        <div className="progress-bar-wrap">
          <div className="progress-bar-fill" style={{width: `${(answered/total)*100}%`}} />
        </div>
        <div style={{fontSize:'0.75rem',color:'var(--text3)',textAlign:'right'}}>{answered}/{total}</div>
      </div>

      <div className="container-sm" style={{padding:'24px 20px'}}>
        {orderedQuestions.map((q, qi) => {
          const type = q.type || 'mcq';
          return (
          <div className={'question-block' + (answers[q.id] != null && answers[q.id] !== '' ? ' answered' : '')} key={q.id}>
            <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}}>
              <span className="q-num">#{qi + 1}</span>
              {type === 'tf' && <span className="badge badge-amber">Зөв/Буруу</span>}
              {type === 'grid' && <span className="badge badge-blue">Grid-in</span>}
              {type === 'blank' && <span className="badge badge-blue">Нөхөх</span>}
              {type === 'open' && <span className="badge badge-amber">Задгай</span>}
              {type === 'match' && <span className="badge badge-amber">Холбох</span>}
              {q.topic && <span className="badge badge-gray">{q.topic}</span>}
              {answers[q.id] != null && answers[q.id] !== '' && <span style={{fontSize:'0.75rem',color:'var(--green)',fontWeight:600}}>✓ Хариуллаа</span>}
            </div>
            {q.sourceText && (
              <div className="source-box">
                <div style={{fontWeight:700,marginBottom:6}}>📖 Эх бичвэр</div>
                <div style={{whiteSpace:'pre-wrap'}}><SeM t={q.sourceText} /></div>
              </div>
            )}
            {q.imageUrl && <QuestionImage src={q.imageUrl} alt="Асуултын зураг" />}
            {q.audioUrl && (
              <div className="audio-player-box">
                <span style={{fontSize:'1.2rem'}}>🎧</span>
                <audio controls src={q.audioUrl} preload="metadata" />
              </div>
            )}
            <div className="q-text" style={{fontSize:'0.95rem',marginBottom:14,whiteSpace:'pre-wrap'}}><SeM t={q.text} /></div>

            {type === 'tf' ? (
              <div className="tf-options">
                {(q.options || defaultOptionsForType('tf')).map(opt => (
                  <button key={opt.key}
                    className={'tf-btn' + (opt.key === 'A' ? ' true' : ' false') + (answers[q.id] === opt.key ? ' selected' : '')}
                    onClick={() => setAnswers(a => ({...a, [q.id]: opt.key}))}>
                    {opt.key === 'A' ? '✓ ' : '✗ '}<SeM t={opt.text} />
                  </button>
                ))}
              </div>
            ) : type === 'open' ? (
              <textarea className="form-textarea" style={{minHeight:140}} placeholder="Бодолт, хариултаа энд бичнэ үү..."
                value={answers[q.id] || ''} spellCheck={false}
                onChange={e => { const v = e.target.value; setAnswers(a => ({...a, [q.id]: v})); }} />
            ) : type === 'blank' ? (
              <input className="form-input" placeholder="Хариултаа энд бичнэ үү..."
                value={answers[q.id] || ''} autoComplete="off" autoCapitalize="off" spellCheck={false}
                onChange={e => { const v = e.target.value; setAnswers(a => ({...a, [q.id]: v})); }} />
            ) : type === 'match' ? (
              <MatchPlayer q={q} value={answers[q.id]} onChange={(v) => setAnswers(a => ({...a, [q.id]: v}))} />
            ) : type === 'grid' ? (
              <div>
                <div className="grid-in-row">
                  {[0,1,2].map(ci => {
                    const digits = String(answers[q.id] || '___');
                    const cur = digits[ci] && digits[ci] !== '_' ? digits[ci] : '';
                    return (
                      <div className="grid-in-col" key={ci}>
                        <div style={{fontSize:'0.7rem',fontWeight:700,color:'var(--text3)',marginBottom:4}}>{['Зуун','Аравт','Нэгж'][ci]}</div>
                        {Array.from({length:10}, (_, d) => (
                          <button type="button" key={d}
                            className={'grid-in-digit' + (cur === String(d) ? ' filled' : '')}
                            onClick={() => {
                              setAnswers(a => {
                                const arr = String(a[q.id] || '___').padEnd(3, '_').slice(0, 3).split('');
                                arr[ci] = String(d);
                                return {...a, [q.id]: arr.join('')};
                              });
                            }}>{d}</button>
                        ))}
                      </div>
                    );
                  })}
                </div>
                <div className="grid-in-preview">
                  Хариу: {(answers[q.id] || '___').toString().replace(/_/g, '·')}
                  {q.unit ? ' ' + q.unit : ''}
                </div>
                <button className="btn btn-ghost btn-sm" style={{marginTop:6}}
                  onClick={() => setAnswers(a => ({...a, [q.id]: ''}))}>Цэвэрлэх</button>
              </div>
            ) : (
              (q.options || []).map(opt => (
                <button
                  key={opt.key}
                  className={'student-option' + (answers[q.id] === opt.key ? ' selected' : '')}
                  onClick={() => setAnswers(a => ({...a, [q.id]: opt.key}))}
                >
                  <div className="opt-radio" />
                  <span style={{fontWeight:600,color:'var(--text2)',minWidth:16}}>{opt.key})</span>
                  <span><SeM t={opt.text} /></span>
                </button>
              ))
            )}
          </div>
          );
        })}

        <div style={{textAlign:'center',padding:'20px 0 40px'}}>
          <button className="btn btn-green btn-lg" onClick={() => setShowConfirm(true)} style={{minWidth:200}}>
            ✓ Шалгалт дуусгах
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── RESULT PAGE ──────────────────────────────────────────────────────────────
function ResultPage({ submission, exam, onHome }) {
  const verified = !!submission.verified;
  const pass = verified && submission.score >= exam.passingScore;
  const hasLocalAnswers = (exam.questions || []).some(q => q.answer != null && q.answer !== '');

  return (
    <div>
      <div className="topbar">
        <div className="topbar-brand"><div className="brand-badge">SE</div>SmartEXAM</div>
      </div>
      <div className="container-sm" style={{padding:'32px 20px'}}>
        <div className="result-hero">
          <div className={'score-circle ' + (!verified ? 'pending' : pass ? 'pass' : 'fail')}>
            <div className="score-pct">{verified ? submission.score + '%' : '…'}</div>
            <div className="score-label">{!verified ? 'ХҮЛЭЭГДЭЖ БАЙНА' : pass ? 'ТЭНЦСЭН' : 'ТЭНЦЭЭГҮЙ'}</div>
          </div>
          <h2 style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.3rem',marginBottom:6}}>
            {!verified ? '⏳ Хариулт илгээгдлээ' : pass ? '🎉 Амжилт!' : '📚 Дахин хичээлийн хэрэгтэй'}
          </h2>
          <div style={{fontSize:'0.9rem',color:'var(--text2)',marginBottom:14}}>
            {submission.studentName} · {exam.title}
          </div>
          {exam._extra && (
            <div style={{fontSize:'0.85rem',color:'#991b1b',marginBottom:10,background:'#fee2e2',padding:'8px 12px',borderRadius:8,display:'block',fontWeight:600}}>
              ⚠️ Оролдлого дууссан тул энэ дүн ТООЦОГДОХГҮЙ — зөвхөн дадлага.
            </div>
          )}
          {!verified && (
            <div style={{fontSize:'0.82rem',color:'#92400e',marginBottom:10,background:'var(--amber-light)',padding:'8px 12px',borderRadius:8,display:'inline-block'}}>
              ⏳ Дүн баталгаажуулалт хүлээж байна — хариулт амжилттай илгээгдсэн
              {submission.gradeError && <div style={{fontSize:'0.72rem',marginTop:4,opacity:0.8}}>Серверийн алдаа: {submission.gradeError}</div>}
            </div>
          )}
          {verified && (
            <div style={{fontSize:'0.78rem',color:'var(--green)',marginBottom:10}}>✅ Баталгаажсан дүн</div>
          )}
          {verified && <div style={{display:'flex',justifyContent:'center',gap:24,fontSize:'0.9rem'}}>
            <span><strong style={{color:'var(--green)'}}>{submission.correctCount}</strong> зөв</span>
            <span><strong style={{color:'var(--red)'}}>{(submission.totalCount || 0) - (submission.correctCount || 0)}</strong> буруу</span>
            <span>Нийт <strong>{submission.totalCount}</strong></span>
          </div>}
        </div>

        <div className="card mb-3">
          <div className="card-header"><div className="card-title">📝 Таны хариултууд</div></div>
          <div className="card-body" style={{padding:'14px'}}>
            {!hasLocalAnswers ? (
              <div style={{fontSize:'0.88rem',color:'var(--text2)',lineHeight:1.55}}>
                Аюулгүй байдлын үүднээс зөв хариултууд сурагчид харагдахгүй.
                <ul style={{marginTop:12,paddingLeft:18}}>
                  {Object.entries(submission.answers || {}).map(([qid, a]) => (
                    <li key={qid}>#{qid}: <strong>{String(a)}</strong></li>
                  ))}
                </ul>
              </div>
            ) : (
              (exam.questions || []).map(q => {
                const ua = submission.answers[q.id];
                const type = q.type || 'mcq';
                const correct = q.answer != null && q.answer !== '' ? answersEqual(ua, q.answer, type) : null;
                return (
                  <div key={q.id} style={{borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:12}}>
                    <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:8}}>
                      <span className="q-num">#{q.id}</span>
                      {q.answer != null && q.answer !== '' && (
                        <span style={{fontSize:'0.75rem',fontWeight:700,color: correct ? 'var(--green)' : 'var(--red)'}}>
                          {correct ? '✓ Зөв' : '✗ Буруу'}
                        </span>
                      )}
                    </div>
                    {q.imageUrl && <QuestionImage src={q.imageUrl} alt="" />}
                    <div style={{fontSize:'0.875rem',marginBottom:10,whiteSpace:'pre-wrap'}}><SeM t={q.text} /></div>
                    {type === 'match' ? (
                      <MatchReview q={q} ua={ua} />
                    ) : type === 'open' ? (
                      <div>Таны хариу: <div style={{whiteSpace:'pre-wrap',fontWeight:600}}>{String(ua || '—')}</div><div style={{color:'var(--text3)',fontSize:'0.75rem',marginTop:4}}>Багш гараар дүгнэнэ</div></div>
                    ) : type === 'blank' ? (
                      <div>Таны хариу: <strong>{String(ua || '—')}</strong>{q.answer ? <span style={{color:'var(--green)'}}> · зөв: {String(q.answer).split('|')[0].trim()}</span> : null}</div>
                    ) : type === 'grid' ? (
                      <div>Таны хариу: <strong>{String(ua || '—').replace(/_/g, '')}</strong></div>
                    ) : (
                      (q.options || []).map(opt => {
                        const origKey = (q._map && q._map[opt.key]) || opt.key;
                        const isUser = ua === origKey;
                        const isAnswer = q.answer === origKey;
                        let cls = 'student-option';
                        if (isAnswer) cls += ' correct-show';
                        else if (isUser && !isAnswer) cls += ' wrong-show';
                        return (
                          <div key={opt.key} className={cls} style={{cursor:'default'}}>
                            <div className="opt-radio" />
                            <span style={{fontWeight:600,minWidth:16}}>{opt.key})</span>
                            <span><SeM t={opt.text} /></span>
                          </div>
                        );
                      })
                    )}
                  </div>
                );
              })
            )}
          </div>
        </div>

        <div style={{textAlign:'center',paddingBottom:40}}>
          <button className="btn btn-violet btn-lg" onClick={onHome}>🏠 Үндсэн хуудас руу буцах</button>
        </div>
      </div>
    </div>
  );
}


// ─── QR STUDENT LOGIN ─────────────────────────────────────────────────────────
function QRStudentLogin({ exam, qrClassName, onStart, onBack }) {
  const [name, setName] = useState(() => {
    try { return JSON.parse(localStorage.getItem('se_student_profile_v1') || '{}').name || ''; } catch { return ''; }
  });
  const classLabel = (qrClassName || exam?.qrClassName || '').trim();
  // Count questions: support both old (exam.questions) and new (exam.versions) format
  const qCount = useMemo(() => {
    if (exam?.versions && typeof exam.versions === 'object') {
      const vals = Object.values(exam.versions);
      return vals.length > 0 ? (vals[0] || []).length : 0;
    }
    if (Array.isArray(exam?.questions)) return exam.questions.length;
    return 0;
  }, [exam]);

  const announceJoin = useCallback((n) => {
    const c = classLabel;
    const classKey = exam?.qrClassKey || normalizeClassKey(c);
    try {
      const bc = new BroadcastChannel('se_join_' + exam.id + '_' + classKey);
      bc.postMessage({ type: 'JOIN', payload: { name: n, cls: c, at: Date.now() } });
      bc.close();
    } catch {}

    const db = getDb();
    if (db) {
      try {
        roomRef(db, exam.roomID || exam.id).child('joins').push({
          name: n,
          cls: c,
          classKey,
          at: firebase.database.ServerValue.TIMESTAMP
        });
      } catch {}
    }
  }, [exam?.id, exam?.qrClassKey, classLabel]);

  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(160deg,#eef2ff,#f5f0ff)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="modal-head">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:48,height:48,borderRadius:12,background:'linear-gradient(135deg,var(--primary),var(--violet))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem'}}>📱</div>
            <div>
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>QR Шалгалт</div>
              <div style={{fontSize:'0.8rem',color:'var(--text2)'}}>{exam.title}{classLabel ? ' · ' + classLabel + ' анги' : ''}</div>
            </div>
          </div>
        </div>
        <div className="modal-body">
          <div style={{background:'var(--violet-light)',borderRadius:10,padding:'12px 16px',marginBottom:18,fontSize:'0.85rem',color:'#4c3db0',lineHeight:1.6}}>
            📋 <strong>{qCount} асуулт</strong> &nbsp;·&nbsp; ⏱ <strong>{durationLabel(exam.duration)}</strong> &nbsp;·&nbsp; 📚 {exam.subject}
          </div>
          {exam.stopped && (
            <div style={{background:'var(--red-light)',border:'1px solid #fecaca',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:'0.85rem',color:'var(--red)',fontWeight:700}}>
              ⏹ Энэ шалгалтыг багш зогсоосон байна.
            </div>
          )}
          {!classLabel && (
            <div style={{background:'var(--amber-light)',border:'1px solid #fcd34d',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:'0.85rem',color:'#92400e',fontWeight:600}}>
              ⚠️ Хуучин QR байна. Багшаас шинэ QR (анги томилсон) аваарай.
            </div>
          )}
          {classLabel && (
            <div style={{background:'#ecfdf5',border:'1px solid #a7f3d0',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:'0.88rem',color:'#065f46',fontWeight:600}}>

        <div className="modal-foot">

            className="btn btn-violet btn-lg"
            onClick={() => { const n=name.trim(); try { localStorage.setItem('se_student_profile_v1', JSON.stringify({ name: n, cls: classLabel })); } catch {} announceJoin(n); onStart(n, classLabel); }}
            disabled={!name.trim() || !classLabel || !!exam.stopped}
          >
            ▶ Шалгалт эхлэх
          </button>
        </div>
      </div>
    </div>
  );
}

const shuffleArr = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
// Attempt бүрт асуултын дараалал + A/B/C/D байрыг шинээр холино. _map: харагдах үсэг -> жинхэнэ үсэг
const prepareAttempt = (exam, onlyIds, extra) => {
  const all = exam.questions || [];
  // Эх бичвэр эхний асуулт дээр хадгалагддаг тул: (1) эх бичвэртэй шалгалтын дарааллыг холихгүй,
  // (2) алдсан асуултаа дахин өгөхөд ч эх бичвэр харагдана
  const srcOf = {}; let curSrc = '';
  all.forEach(q => { if (q.sourceText) curSrc = q.sourceText; srcOf[q.id] = curSrc; });
  const hasPassage = all.some(q => q.sourceText);
  let picked = all.filter(q => !onlyIds || onlyIds.includes(q.id));
  if (!hasPassage) picked = shuffleArr(picked);
  let prevSrc = '';
  const qs = picked.map(q0 => {
    const s = srcOf[q0.id] || '';
    const q = hasPassage ? { ...q0, sourceText: (s && s !== prevSrc) ? s : '' } : q0;
    if (hasPassage && s) prevSrc = s;
    if ((q.type || 'mcq') !== 'mcq' || !(q.options || []).length) return q;
    const map = {};
    const options = shuffleArr(q.options).map((o, i) => { const k = alpha(i); map[k] = o.key; return { ...o, key: k }; });
    return { ...q, options, _map: map };
  });
  return { ...exam, questions: qs, _subset: onlyIds || null, _extra: !!extra,
    duration: onlyIds ? Math.max(1, Math.ceil(exam.duration * qs.length / Math.max(1, all.length))) : exam.duration };
};
const saveAttempt = async (sub, exam, meta) => {
  const db = getDb(), u = getAuth()?.currentUser;
  if (!db || !u || u.isAnonymous || !meta) return;
  const rec = { at: sub.submittedAt, score: sub.score || 0, correct: sub.correctCount || 0, total: sub.totalCount || 0,
    sec: sub.timeSpentSec || 0, mode: exam._subset ? 'mistakes' : 'full', variant: sub.variantLabel || 'A',
    title: exam.title || '', kind: meta.kind || 'exam' };
  if (exam._extra) rec.extra = true; // оролдлого дууссаны дараах дахин өгөлт — дүнд тооцогдохгүй
  if (Array.isArray(sub.wrongIds)) rec.wrongIds = sub.wrongIds;
  try {
    await db.ref('attempts/' + u.uid + '/' + exam.id + '/' + sub.id).set(rec);
    await db.ref('classResults/' + meta.classId + '/' + exam.id + '/' + u.uid + '/' + sub.id)
      .set({ name: u.displayName || 'Сурагч', at: rec.at, score: rec.score, sec: rec.sec, mode: rec.mode, extra: !!rec.extra });
  } catch (e) { console.warn('saveAttempt', e); }
};
const fmtDate = iso => { try { return new Date(iso).toLocaleString('mn-MN', { dateStyle: 'short', timeStyle: 'short' }); } catch { return iso || ''; } };
const sortedAttempts = obj => Object.entries(obj || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.at || '').localeCompare(b.at || ''));

function StudentAuth({ onDone, onBack }) {
  const [mode, setMode] = useState('login');
  const [f, setF] = useState({ name: '', email: '', password: '' });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const set = k => e => setF(p => ({ ...p, [k]: e.target.value }));
  const go = async () => {
    setErr(''); setBusy(true);
    try {
      const auth = getAuth(), db = getDb();
      if (mode === 'reg') {
        const name = sanitizeText(f.name, 80);
        if (!name) throw new Error('Нэрээ оруулна уу');
        const c = await auth.createUserWithEmailAndPassword(f.email.trim(), f.password);
        await c.user.updateProfile({ displayName: name });
        await withAuthRetry(() => db.ref('users/' + c.user.uid).set({ role: 'student', name, email: f.email.trim().toLowerCase(), createdAt: new Date().toISOString() }));
        localStorage.setItem('se_role', 'student'); onDone(name);
      } else {
        const c = await auth.signInWithEmailAndPassword(f.email.trim(), f.password);
        const r = (await withAuthRetry(() => db.ref('users/' + c.user.uid + '/role').once('value'))).val();
        if (r && r !== 'student') { await auth.signOut(); throw new Error('Энэ сурагчийн акаунт биш байна (багшийн нэвтрэлтээр орно уу)'); }
        if (!r) { try { await withAuthRetry(() => db.ref('users/' + c.user.uid).set({ role: 'student', name: c.user.displayName || 'Сурагч', email: f.email.trim().toLowerCase(), createdAt: new Date().toISOString() })); } catch (_) {} }
        localStorage.setItem('se_role', 'student'); onDone(c.user.displayName || 'Сурагч');
      }
    } catch (e) { setErr(e.message || 'Алдаа гарлаа'); }
    setBusy(false);
  };
  return (
    <div className="landing"><div className="card" style={{ width: '100%', maxWidth: 380 }}><div className="card-body">
      <h2 style={{ marginBottom: 14 }}>🎓 Сурагч {mode === 'reg' ? 'бүртгүүлэх' : 'нэвтрэх'}</h2>
      {mode === 'reg' && <div className="form-group"><input className="form-input" placeholder="Овог нэр" value={f.name} onChange={set('name')} /></div>}
      <div className="form-group"><input className="form-input" type="email" placeholder="Имэйл" value={f.email} onChange={set('email')} /></div>
      <div className="form-group"><input className="form-input" type="password" placeholder="Нууц үг (6+)" value={f.password} onChange={set('password')} /></div>
      {err && <div className="form-error">{err}</div>}
      <button className="btn btn-violet" style={{ width: '100%', marginTop: 8 }} disabled={busy} onClick={go}>{mode === 'reg' ? 'Бүртгүүлэх' : 'Нэвтрэх'}</button>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12 }}>
        <button className="btn btn-ghost btn-sm" onClick={() => setMode(mode === 'reg' ? 'login' : 'reg')}>{mode === 'reg' ? 'Нэвтрэх' : 'Шинээр бүртгүүлэх'}</button>
        <button className="btn btn-ghost btn-sm" onClick={onBack}>← Буцах</button>
      </div>
    </div></div></div>
  );
}

      const isExamKind = t.kind !== 'practice';

      let st0 = selSet;
      try { st0 = (await roomRef(getDb(), t.roomId).child('settings').once('value')).val() || selSet || {}; } catch (_) {}
      const cap = st0?.maxAttempts > 0 ? st0.maxAttempts : (room.maxAttempts > 0 ? room.maxAttempts : 0);
      // Шалгалт: багшийн заасан бүх оролдлогоо дуусгахаас өмнө алдсан асуулт руу орохгүй
      if (onlyIds && isExamKind) {
        if (cap > 0 && doneFull < cap) throw new Error('Эхлээд бүх ' + cap + ' оролдлогоо бүтнээр нь дуусгана уу (' + doneFull + '/' + cap + ').');
        if (doneFull < 1) throw new Error('Эхлээд шалгалтаа бүтнээр нь өгч дуусгана уу.');
      }
      // Дасгал: оролдлогын дээд тоо хэтэрсэн бол бүтнээр нь дахин өгөхгүй
      if (!onlyIds && !isExamKind && cap > 0 && doneFull >= cap) throw new Error('Оролдлогын дээд тоо (' + cap + ') хэтэрсэн байна.');
      if (!onlyIds && isExamKind && cap > 0 && doneFull >= cap) {
        if (!confirm('⚠️ Та энэ шалгалтын ' + cap + ' оролдлогоо бүгдийг ашигласан байна.\n\nЭнэ удаагийн дүн ТООЦОГДОХГҮЙ (зөвхөн дадлага). Багшид харагдах эцсийн дүн (хамгийн өндөр) өөрчлөгдөхгүй.\n\nҮргэлжлүүлэх үү?')) { setBusy(false); return; }
      }
      const exam0 = label ? buildExamWithVariant(room, label) : await pickVariantForStudent(room, name, t.cls.name);
      // Шалгалтын бүх оролдлого дууссаны дараах бүтэн дахин өгөлт — дүнд тооцогдохгүй (дасгал горим)
      const extraFull = !onlyIds && isExamKind && cap > 0 && doneFull >= cap;
      onStart(prepareAttempt(exam0, extraFull ? (exam0.questions || []).map(q => q.id) : onlyIds, extraFull), { classId: t.cls.id, kind: t.kind });
    } catch (e) { alert(e.message || 'Алдаа'); }

  const list = sel ? sortedAttempts(att[sel.roomId]) : [];

  const noMistakes = !!last && (Array.isArray(last.wrongIds) ? last.wrongIds.length === 0 : (last.total > 0 && last.correct >= last.total));

  const fullN = list.filter(a => a.mode !== 'mistakes').length;
  const isExamSel = !!sel && sel.kind !== 'practice';

      {tests.map(t => {

        return (
          <div key={t.cls.id + t.roomId} className="exam-card" style={{ marginBottom: 10, cursor: 'pointer' }} onClick={() => { setSel(t); setChoose(false); }}>

              <span className={'badge ' + (t.kind === 'practice' ? 'badge-green' : 'badge-blue')}>{t.kind === 'practice' ? 'Дасгал' : 'Шалгалт'}</span>
              {t.cls.teacherName && <span>👤 {t.cls.teacherName} багшийн шалгалт</span>}
              <span>{l.length} удаа өгсөн</span>

          </div>

      })}

          <div className="modal-body">

              <div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>#</th><th>Огноо</th><th>Хугацаа</th><th>Дүн</th><th>Төрөл</th></tr></thead><tbody>
                {list.map((a, i) => <tr key={a.id}><td>{i + 1}</td><td>{fmtDate(a.at)}</td><td>{fmtDur(a.sec)}</td>
                  <td><b>{a.score}%</b> ({a.correct}/{a.total})</td><td>{a.extra ? <span className="badge badge-red">Дүнд тооцохгүй</span> : a.mode === 'mistakes' ? 'Алдсан' : 'Бүгд'}</td></tr>)}

              <button className="btn btn-ghost" onClick={() => setSel(null)}>Хаах</button>
            </div>

    const val = m === 'avg' ? Math.round(base.reduce((t, a) => t + a.score, 0) / base.length)
      : m === 'last' ? base[base.length - 1].score : Math.max(...base.map(a => a.score));
    return { val, last: all[all.length - 1].score, n: all.length, all }; };

    if (!detail || !cur) { setZgImgs({}); return; }
    const db = getDb(); let off = false;

    sorted.forEach(sid => tests.forEach(([rid, t]) => { const x = cell(rid, sid); if (!x) return;

    if (typeof XLSX !== 'undefined') {

      w1['!cols'] = head.map((h, i) => ({ wch: i === 1 ? 24 : i === 0 ? 5 : 22 }));
      XLSX.utils.book_append_sheet(wb, w1, 'Дүн');
      const w2 = XLSX.utils.aoa_to_sheet(det);
      w2['!cols'] = [{ wch: 24 }, { wch: 26 }, { wch: 12 }, { wch: 18 }, { wch: 22 }, { wch: 8 }, { wch: 10 }];
      XLSX.utils.book_append_sheet(wb, w2, 'Оролдлогууд');
      XLSX.writeFile(wb, base + '.xlsx');
    } else {
      downloadCSV(base, rows);
    }
  };
  return (
    <div className="container-lg" style={{ paddingTop: 16, paddingBottom: 40 }}>

        <div className="card" style={{ marginBottom: 14 }}><div className="card-body">
          <div className="form-label">Тест / дасгал оноох</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

            <select className="form-select" style={{ width: 130 }} value={pick.kind} onChange={e => setPick(p => ({ ...p, kind: e.target.value }))}>

          <div className="form-hint">Оролдлогын тоо болон дүн тооцох горимыг (өндөр / дундаж / сүүлийн) тест үүсгэхдээ сонгоно.</div></div></div>
        <div className="seg" style={{ marginBottom: 10 }}>
          {[['exam', '🎓 Шалгалт'], ['practice', '📝 Дасгал']].map(([k, lbl]) => <button key={k} className={'seg-b' + (kindTab === k ? ' on' : '')} onClick={() => setKindTab(k)}>{lbl} ({allTests.filter(([, t]) => (t.kind || 'exam') === k).length})</button>)}

            {mIds.map(sid => { const cs = tests.map(([rid]) => cell(rid, sid)); const got = cs.filter(Boolean);
              return <tr key={sid}><td><a style={{ cursor: 'pointer', color: 'var(--primary)', fontWeight: 600 }} onClick={() => setDetail(sid)}>{members[sid].name}</a></td>
                {cs.map((x, i) => <td key={i}>{x ? <><b>{x.val}%</b> <span style={{ color: 'var(--text3)', fontSize: '0.75rem' }}>({x.n}×)</span></> : '—'}</td>)}
                <td><b>{got.length ? Math.round(got.reduce((s, x) => s + x.val, 0) / got.length) : '—'}{got.length ? '%' : ''}</b></td>
                <td><button className="btn btn-red btn-sm" onClick={async () => { if (!confirm('Ангиас хасах уу?')) return; const db = getDb(); await db.ref('classMembers/' + cur + '/' + sid).remove(); db.ref('studentClasses/' + sid + '/' + cur).remove().catch(() => {}); }}>Хасах</button></td></tr>; })}
            <tr style={{ background: 'var(--surface2)' }}><td><b>Ангийн дундаж</b></td>{tests.map(([rid]) => { const v = mIds.map(s => cell(rid, s)).filter(Boolean);

  );
}

// Багшийн тестүүдийг Firebase-ээс сэргээх (localStorage хоосорсон/өөр файлаас нээсэн үед)
// Эх сурвалж: (1) users/{uid}/exams индекс, (2) ангид оноосон тестүүд, (3) activeRooms-ийг ownerUid-ээр лавлах (дүрэм зөвшөөрвөл)
const restoreExamsFromCloud = async () => {
  const db = getDb(), teacher = ensureTeacherAuth();
  if (!db) throw new Error('Firebase холбогдоогүй. Интернетээ шалгана уу.');
  if (!teacher) throw new Error('Багшаар нэвтэрсэн байх ёстой. Гараад дахин нэвтэрч орно уу.');
  const ids = new Set();
  const notes = [];
  try {
    const v = (await db.ref('users/' + teacher.uid + '/exams').once('value')).val() || {};
    Object.keys(v).forEach(id => ids.add(id));
  } catch (e) { notes.push('users'); }
  try {
    const v = (await db.ref('classes').orderByChild('teacherUid').equalTo(teacher.uid).once('value')).val() || {};
    Object.values(v).forEach(c => Object.entries(c.assignments || {}).forEach(([id, a]) => { if (!a.zgOnly) ids.add(id); }));
  } catch (e) { notes.push('classes'); }
  try {
    const v = (await db.ref('activeRooms').orderByChild('ownerUid').equalTo(teacher.uid).once('value')).val() || {};
    Object.keys(v).forEach(id => ids.add(id));
  } catch (e) { notes.push('rooms'); }

  const out = [];
  await Promise.all([...ids].map(async (rid) => {
    try {
      const ref = db.ref('activeRooms/' + rid);
      const [packS, keysS, setS] = await Promise.all([
        ref.child('clientPack').once('value'),
        ref.child('answerKeys').once('value').catch(() => null),
        ref.child('settings').once('value').catch(() => null)
      ]);
      const pack = packS.val();
      if (!pack || !pack.versions) return;
      if (pack.ownerUid && pack.ownerUid !== teacher.uid) return;
      const keys = (keysS && keysS.val()) || {};
      const st = (setS && setS.val()) || {};
      const variants = Object.keys(pack.versions).map((label) => {
        const pubList = Array.isArray(pack.versions[label]) ? pack.versions[label] : Object.values(pack.versions[label] || {});
        const keyList = Array.isArray(keys[label]) ? keys[label] : Object.values(keys[label] || {});
        const questions = pubList.map((q, i) => {
          const k = keyList[i] || {};
          const type = q.type || k.type || 'mcq';
          const ans = k.answer ?? null;
          return {
            id: i + 1, text: q.text || '', type, topic: q.topic || '',
            options: Array.isArray(q.options) ? q.options : Object.values(q.options || {}),
            left: type === 'match' ? (Array.isArray(q.left) ? q.left : Object.values(q.left || {})) : [],
            answer: ans, numericAnswer: type === 'grid' ? ans : null,
            imageUrl: q.imageUrl || '', sourceText: q.sourceText || '', audioUrl: q.audioUrl || '', unit: q.unit || ''
          };
        });
        return { label, questions };
      });
      out.push({
        id: rid, title: pack.title || 'Шалгалт', subject: pack.subject || '', subjectId: pack.subjectId || '',
        duration: examDurationOf(pack), passingScore: pack.passingScore ?? 60,
        omrFormat: pack.omrFormat || 'mcq', omrMode: pack.omrMode || 'mcq',
        antiCheat: (st.antiCheat != null ? st.antiCheat !== false : pack.antiCheat !== false),
        maxAttempts: st.maxAttempts || 0, scoreMode: st.scoreMode || 'best',
        ownerUid: teacher.uid, variants, createdAt: pack.createdAt || new Date().toISOString(),
        published: true, submissionCount: 0
      });
    } catch (_) {}
  }));
  out.sort((x, y) => (x.createdAt || '').localeCompare(y.createdAt || ''));
  out.found = ids.size;
  return out;
};
// Локал дахь тестүүдийн ID-г серверийн индекс руу бичнэ (дараа нь ямар ч төхөөрөмжөөс сэргээх боломжтой болгоно)

const isAdminRoute = () => /\/(admin|amdin)-by-e-c-1771\/?$/i.test((window.location.pathname || '').replace(/\/+$/, '') || '/');
const adminApi = async (path, opts) => {
  const token = sessionStorage.getItem('se_admin_tok') || '';
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { sessionStorage.removeItem('se_admin_tok'); throw new Error('admin'); }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
};
