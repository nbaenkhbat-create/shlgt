                <input className="form-input" placeholder="жн: Улаанбаатар | УБ" value={q.answer || ''}
                  onChange={e => setQ(qi, 'answer', e.target.value)} />
                <div className="form-hint">Хэд хэдэн зөв хариулт байвал «|» тэмдгээр тусгаарлана. Том/жижиг үсэг, зай ялгахгүй. Сурагч өөрөө бичиж хариулна.</div>
              </div>
            ) : type === 'grid' ? (
              <div style={{marginBottom:10}}>
                <label className="form-label">Зөв хариу (3 оронтой тоо)</label>
                <input className="form-input" style={{maxWidth:160}} maxLength={3} placeholder="115"
                  value={q.numericAnswer || q.answer || ''}
                  onChange={e => {
                    const v = e.target.value.replace(/\D/g, '').slice(0, 3);
                    const next = questions.map((qq, i) => i === qi ? {...qq, numericAnswer: v, answer: v} : qq);
                    onChange(next);
                  }} />
                {q.unit && <span style={{marginLeft:8,color:'var(--text2)',fontWeight:600}}>{q.unit}</span>}
              </div>
            ) : (
              <>
                <div className="options-grid" style={{marginBottom:10}}>
                  {(q.options || []).map((opt, oi) => (
                    <div key={opt.key} style={{display:'flex',gap:7,alignItems:'center'}}>
                      <div className="option-key" style={{
                        background: q.answer===opt.key ? 'var(--green)' : undefined,
                        color: q.answer===opt.key ? 'white' : undefined,
                        border: q.answer===opt.key ? '1.5px solid var(--green)' : undefined
                      }}>{opt.key}</div>
                      <MathField className="form-input" style={{flex:1,minWidth:0,padding:'6px 10px',fontSize:'0.82rem'}}
                        placeholder={opt.key + ' хариулт...'} value={opt.text}
                        onChange={e => setOpt(qi, oi, e.target.value)} />
                    </div>
                  ))}
                </div>
                <div className="answer-select-row">
                  <span className="answer-label">Зөв хариулт:</span>
                  {(q.options || []).map(opt => (
                    <button key={opt.key} className={'ans-btn' + (q.answer === opt.key ? ' selected' : '')}
                      onClick={() => setQ(qi, 'answer', q.answer === opt.key ? null : opt.key)}>{opt.key}</button>
                  ))}
                </div>
              </>
            )}
          </div>
        );
      })}
      <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addQ}>
        + Асуулт нэмэх
      </button>
    </div>
  );
}

// ─── CREATE EXAM (3-step wizard) ──────────────────────────────────────────────
function CreateExam({ onSave, onCancel, initialExam, hasResults }) {
  const editing = !!initialExam;
  const [step, setStep] = useState(1);
  const [info, setInfo] = useState(editing ? {
    title: initialExam.title || '', subject: initialExam.subject || GENERAL_PROFILE.name, subjectId: initialExam.subjectId || GENERAL_PROFILE.id,
    duration: examDurationOf(initialExam), passingScore: initialExam.passingScore ?? 60,
    omrFormat: initialExam.omrFormat || 'mcq', omrMode: initialExam.omrMode || 'mcq',
    maxAttempts: initialExam.maxAttempts || 0, scoreMode: initialExam.scoreMode || 'best',
    antiCheat: initialExam.antiCheat !== false, noTimeLimit: examDurationOf(initialExam) <= 0
  } : {
    title: '', subject: GENERAL_PROFILE.name, subjectId: GENERAL_PROFILE.id, duration: 45, passingScore: 60,
    omrFormat: 'mcq', omrMode: 'mcq', maxAttempts: 0, scoreMode: 'best', antiCheat: true, noTimeLimit: false
  });
  const [variants, setVariants] = useState(editing ? normalizeVariants(initialExam).map(v => ({ ...v, questions: (v.questions || []).map(q => ({ ...q })) })) : [{ label: 'A', questions: [] }]);
  const [activeVar, setActiveVar] = useState(0);
  const [saving, setSaving] = useState(false);
  const [createPath, setCreatePath] = useState(editing ? 'manual' : null);
  const [step2Mode, setStep2Mode] = useState(editing ? 'manual' : 'photo');
  const [showInlinePdf, setShowInlinePdf] = useState(false);
  const [inlineRaw, setInlineRaw] = useState('');
  const [inlineParsing, setInlineParsing] = useState(false);
  const [inlineErr, setInlineErr] = useState('');
  const variantCount = variants.length;
  const profile = getSubjectProfile(info.subjectId || info.subject);
  const stepLabels = ['Үндсэн мэдээлэл', 'Асуулт үүсгэх'];

  const selectSubject = (p) => {
    setInfo(prev => ({
      ...prev,
      subject: p.name,
      subjectId: p.id,
      omrFormat: p.formats[0]?.id || 'mcq',
      omrMode: p.omrMode || 'mcq'
    }));
  };

  const handleManual = () => {
    const type = info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq';
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: (v.questions || []).length ? v.questions : [seedQuestion(type)]}) : v));
    setStep2Mode('manual');
  };

  const handleParsed = (qs, maybeTitle) => {
    const incoming = String(maybeTitle || '').trim();
    if (incoming) setInfo(p => p.title ? p : ({ ...p, title: incoming }));
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setStep2Mode('manual');
    setStep(2);
  };

  const applyImportedQuestions = (qs) => {
    if (!Array.isArray(qs) || !qs.length) throw new Error('Асуулт илрэхгүй');
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setShowInlinePdf(false); setInlineRaw('');
  };

  const doInlineParse = async () => {
    if (!inlineRaw.trim()) return;
    setInlineParsing(true); setInlineErr('');
    try { applyImportedQuestions(await parseTestFromText(inlineRaw)); }
    catch (e) { setInlineErr(e?.message || 'Алдаа'); }
    finally { setInlineParsing(false); }
  };

  const doInlinePdf = async (file) => {
    if (!file) return;
    setInlineParsing(true); setInlineErr('');
    try {
      const txt = await extractPdfText(file);
      setInlineRaw(txt);
      let fm = {};
      try { fm = await extractPdfFigures(file); } catch (_) { fm = {}; }
      applyImportedQuestions(await parseTestFromText(txt, fm));
    } catch (e) { setInlineErr(e?.message || 'PDF'); }
    finally { setInlineParsing(false); }
  };

  const addVariant = () => {
    // Keep current variant (A) questions; append empty B/C/... and open same entry flow
    if (variants.length >= 5) return;
    const nextIdx = variants.length;
    setVariants(prev => {
      if (prev.length >= 5) return prev;
      return [...prev, { label: alpha(prev.length), questions: [] }];
    });
    setActiveVar(nextIdx);
    setStep2Mode(createPath === 'scan' ? 'photo' : 'parse');
    setShowInlinePdf(false); setInlineRaw(''); setInlineErr('');
  };

  const goNextVariant = () => addVariant();

  const selectVariantTab = (idx) => {
    setActiveVar(idx);
    const hasQs = ((variants[idx] && variants[idx].questions) || []).some(q => (q.text || '').trim());
    setStep2Mode(hasQs ? 'manual' : (createPath === 'scan' ? 'photo' : 'parse'));
    setShowInlinePdf(false); setInlineRaw(''); setInlineErr('');
  };

  const handlePublish = () => {
    const hasAny = variants.some(v => (v.questions || []).some(q => (q.text || '').trim()));
    if (!hasAny) { alert('Дор хаяж нэг асуулт оруулна уу'); return; }
    if (!info.title.trim()) { alert('Шалгалтын нэр оруулна уу'); return; }
    if (editing && hasResults) {
      if (!confirm('Энэ шалгалтыг өгсөн сурагч байна. Асуулт/хариулт өөрчилбөл өмнөх дүн дахин тооцогдохгүй. Хадгалах уу?')) return;
    }
    setSaving(true);
    setTimeout(async () => {
      try {
        const teacher = ensureTeacherAuth();
        if (!teacher) {
          alert('Нэвтэрсэн багш олдсонгүй. Дахин нэвтэрнэ үү.');
          setSaving(false);
          return;
        }
        const normalizedVariants = variants.map((v, vidx) => {
          const valid = (v.questions || []).filter(q => (q.text || '').trim());
          return { label: v.label || alpha(vidx), questions: valid.map((q, i) => ({...q, id: i + 1})) };
        }).filter(v => v.questions.length > 0);
        const examId = editing ? initialExam.id : uid();
        const exam = {
          ...(editing ? initialExam : {}),
          id: examId,
          title: sanitizeText(info.title, 200),
          subject: sanitizeText(info.subject, 100),
          subjectId: info.subjectId,
          duration: info.noTimeLimit ? 0 : Math.max(0, +info.duration || 0),
          antiCheat: info.antiCheat !== false,
          passingScore: info.passingScore,
          omrFormat: info.omrFormat,
          omrMode: info.omrMode || profile?.omrMode || 'mcq',
          maxAttempts: Math.max(0, Math.min(20, +info.maxAttempts || 0)),
          scoreMode: ['best', 'avg', 'last'].includes(info.scoreMode) ? info.scoreMode : 'best',
          ownerUid: teacher.uid,
          variants: normalizedVariants.length ? normalizedVariants : [{ label: 'A', questions: [] }],
          createdAt: editing ? (initialExam.createdAt || new Date().toISOString()) : new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          published: true,
          submissionCount: editing ? (initialExam.submissionCount || 0) : 0
        };
        const db = getDb();
        if (db) {
          const versions = {};
          const answerKeys = {};
          exam.variants.forEach((v) => {
            versions[v.label] = packQuestions(v.questions);
            answerKeys[v.label] = packAnswerKeys(v.questions);
          });
          const roomData = {
            roomID: exam.id,
            title: exam.title,
            subject: exam.subject,
            subjectId: exam.subjectId,
            duration: exam.duration,
            passingScore: exam.passingScore,
            omrFormat: exam.omrFormat,
            omrMode: exam.omrMode,
            antiCheat: exam.antiCheat !== false,
            ownerUid: teacher.uid,
            publicReadable: true,
            createdAt: exam.createdAt,
            versions,
            answerKeys
          };
          if (editing) { delete roomData.createdAt; await roomRef(db, exam.id).update(roomData); }
          else await roomRef(db, exam.id).set(roomData);
          // clientPack-д оролдлогын тохиргоо орсон байх ёстой (сурагч зөвхөн үүнийг уншдаг). Дүрэм зөвшөөрөхгүй бол хуучин хэлбэрээр хадгална.
          {
            const pack = buildClientPack({ ...exam, ownerUid: teacher.uid }, versions);
            try { await roomRef(db, exam.id).child('clientPack').set(pack); }
            catch (e) { console.warn('clientPack w/ attempts failed, retry plain', e); const { maxAttempts: _a, scoreMode: _b, ...plain } = pack; await roomRef(db, exam.id).child('clientPack').set(plain); }
          }
          try { await roomRef(db, exam.id).child('settings').set({ maxAttempts: exam.maxAttempts, scoreMode: exam.scoreMode, antiCheat: exam.antiCheat !== false }); } catch (e) { console.warn('settings save failed', e); }
          try { await db.ref('users/' + teacher.uid + '/exams/' + exam.id).set(true); } catch (_) {}
        }
        onSave(exam);
      } catch (e) {
        alert('Нийтлэхэд алдаа: ' + (e?.message || e) + '\n\nFirebase Auth нэвтэрсэн эсэх болон database rules deploy хийсэн эсэхийг шалгана уу.');
        setSaving(false);
      }
    }, 100);
  };

  const currentVariant = variants[activeVar] || { label: alpha(activeVar), questions: [] };
  const currentQCount = (currentVariant.questions || []).filter(q => q.text).length;
  const totalQCount = variants.reduce((sum, v) => sum + (v.questions||[]).filter(q=>q.text).length, 0);

  const goChooser = () => { setCreatePath(null); setStep(1); setStep2Mode('photo'); };

  return (
    <div>
      <div className="page-header">
        <h2 className="page-title">{editing ? '✏ Шалгалт засах' : '✏ Даалгавар бэлдэх'}</h2>
        <div className="page-sub">{editing ? 'Асуулт, хугацаа, оролдлогын тоо, дүн тооцох горимыг засаад хадгална' : (!createPath ? 'Хэрхэн бэлдэхээ сонгоно уу' : (createPath === 'scan' ? 'Scan · зураг → онлайн форм' : 'Гараар бэлдэх'))}</div>
      </div>

      {!editing && !createPath && (
        <div className="card">
          <div className="card-body">
            <div className="path-choice-grid">
              <button type="button" className="path-choice-card" onClick={() => { setCreatePath('manual'); setStep(1); setStep2Mode('manual'); }}>
                <div className="path-choice-icon">✏️</div>
                <div className="path-choice-title">Гараар</div>
                <div className="path-choice-sub">Асуултыг сайт дээр бичиж, PDF/файл импортлож, засна. Эх файл компьютер дээр өөрчлөгдөхгүй.</div>
              </button>
              <button type="button" className="path-choice-card" onClick={() => { setCreatePath('scan'); setStep(2); setStep2Mode('photo'); }}>
                <div className="path-choice-icon">📷</div>
                <div className="path-choice-title">Scan</div>
                <div className="path-choice-sub">Цаасан тестийг зургаад автоматаар онлайн тест болгоно. Дараа нь форм дээр хянана.</div>
              </button>
            </div>
            <div style={{marginTop:16,textAlign:'center'}}>
              <button className="btn btn-outline" onClick={onCancel}>Болих</button>
            </div>
          </div>
        </div>
      )}

      {(editing || createPath) && (
      <>
      {!(createPath === 'scan' && step2Mode === 'photo') && (
      <div className="steps mb-4">
        {stepLabels.map((lbl, i) => (
          <React.Fragment key={i}>
            <div className={'step' + (step === i+1 ? ' active' : step > i+1 ? ' done' : '')}>
              <div className="step-num">{step > i+1 ? '✓' : i+1}</div>
              <span>{lbl}</span>
            </div>
            {i < stepLabels.length - 1 && <div className="step-line" />}
          </React.Fragment>
        ))}
      </div>
      )}

      <div className="card">
        <div className="card-body">
          {step === 1 && (
            <div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Шалгалтын нэр</label>
                  <input className="form-input" placeholder="жн: Ионы холбоо — Улирлын шалгалт"
                    value={info.title} onChange={e => setInfo(p => ({...p, title: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label className="form-label">Хугацаа (мин)</label>
                  <input className="form-input" type="number" min="1" max="180" disabled={info.noTimeLimit}
                    value={info.noTimeLimit ? '' : info.duration}
                    placeholder="Цаггүй"
                    onChange={e => setInfo(p => ({...p, duration: +e.target.value, noTimeLimit: false}))} />
                  <label className="form-hint" style={{display:'flex',gap:8,alignItems:'center',marginTop:8}}>
                    <input type="checkbox" checked={!!info.noTimeLimit}
                      onChange={e => setInfo(p => ({...p, noTimeLimit: e.target.checked, duration: e.target.checked ? 0 : (p.duration || 45)}))} />
                    Цаггүй
                  </label>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label" style={{display:'flex',gap:8,alignItems:'center'}}>
                  <input type="checkbox" checked={info.antiCheat !== false}
                    onChange={e => setInfo(p => ({...p, antiCheat: e.target.checked}))} />
                  Чит хамгаалалт (таб солих, фокус алдах)
                </label>
              </div>
              <div className="form-group">
                <label className="form-label">Тэнцэх босго (%)</label>
                <input className="form-input" type="number" min="0" max="100" style={{maxWidth:160}}
                  value={info.passingScore}
                  onChange={e => setInfo(p => ({...p, passingScore: +e.target.value}))} />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Өгөх оролдлогын тоо</label>
                  <select className="form-select" value={info.maxAttempts}
                    onChange={e => setInfo(p => ({...p, maxAttempts: +e.target.value}))}>
                    <option value={0}>Хязгааргүй</option>
                    {[1,2,3,4,5,10].map(n => <option key={n} value={n}>{n} удаа</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Дүнг хэрхэн тооцох</label>
                  <select className="form-select" value={info.scoreMode}
                    onChange={e => setInfo(p => ({...p, scoreMode: e.target.value}))}>
                    <option value="best">Хамгийн өндөр дүнгээр</option>
                    <option value="avg">Дундажаар</option>
                    <option value="last">Сүүлийн дүнгээр</option>
                  </select>
                </div>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
                <button className="btn btn-outline" onClick={() => (!editing && createPath ? goChooser() : onCancel())}>
                  {(!editing && createPath) ? '← Сонголт' : 'Болих'}
                </button>
                <button className="btn btn-primary" onClick={() => { setStep(2); setStep2Mode(createPath === 'scan' ? (currentQCount ? 'manual' : 'photo') : (currentQCount ? 'manual' : 'parse')); }}
                  disabled={!info.title.trim()}>Дараах →</button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
                {(createPath === 'scan'
                  ? [['photo', '📷 Scan'], ['manual', '✏ Хянах / засах']]
                  : [['parse', '📄 PDF / Текст'], ['manual', '✏ Гараар / Хянах']]
                ).map(([id, lbl]) => (
                  <button key={id} className={'btn btn-sm' + (step2Mode === id ? ' btn-violet' : ' btn-outline')}
                    onClick={() => setStep2Mode(id)}>{lbl}</button>
                ))}
              </div>

              {createPath === 'scan' && step2Mode === 'photo' && (
                <PhotoQuizStep
                  onParsed={handleParsed}
                  onManual={handleManual}
                  onBack={goChooser}
                  onTitle={(t) => setInfo(p => p.title ? p : ({...p, title: t}))}
                  variantCount={variantCount}
                  onVariantCountChange={addVariant}
                  currentVariantLabel={currentVariant.label || alpha(activeVar)}
                />
              )}

              {step2Mode === 'parse' && (
                <PdfImportStep
                  onParsed={handleParsed}
                  onManual={handleManual}
                  onBack={() => setStep(1)}
                  variantCount={variantCount}
                  onVariantCountChange={addVariant}
                  currentVariantLabel={currentVariant.label || alpha(activeVar)}
                />
              )}

              {step2Mode === 'manual' && (
                <div>
                  <div className="form-group">
                    <label className="form-label">Шалгалтын нэр</label>
                    <input className="form-input" placeholder="жн: Монгол хэл — улирлын шалгалт"
                      value={info.title} onChange={e => setInfo(p => ({...p, title: e.target.value}))} />
                  </div>
                  <div className="version-indicator">
                    <div className="version-indicator-icon">{currentVariant.label || alpha(activeVar)}</div>
                    <div className="version-indicator-text">
                      <div className="version-indicator-label">Хувилбар {currentVariant.label || alpha(activeVar)}</div>
                      <div className="version-indicator-sub">
                        {currentQCount} асуулт · Нийт {totalQCount} · {info.subject} · {info.omrFormat}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setShowInlinePdf(s => !s)}>📄 PDF</button>
                      <label className="btn btn-outline btn-sm" style={{cursor:'pointer'}}>
                        📥 Файл
                        <input type="file" accept=".json,.csv,application/json,text/csv" hidden
                          onChange={async (e) => {
                            const f = e.target.files && e.target.files[0];
                            e.target.value = '';
                            if (!f) return;
                            try {
                              const txt = await f.text();
                              const imp = importQuizFromFileText(f.name, txt);
                              applyImportedQuestions(imp.questions);
                              if (imp.title && !info.title) setInfo(p => ({...p, title: imp.title}));
                              setStep2Mode('manual');
                            } catch (err) { alert(err?.message || 'Файл уншигдсангүй (зөвхөн санах ойд, эх файл өөрчлөгдөхгүй)'); }
                          }} />
                      </label>
                      <button className="btn btn-outline btn-sm" onClick={() => {
                        const payload = {
                          title: info.title,
                          subject: info.subject,
                          duration: info.noTimeLimit ? 0 : info.duration,
                          antiCheat: info.antiCheat !== false,
                          variants
                        };
                        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = (info.title || 'test').slice(0, 40) + '.json';
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
                      }}>📤 Татах</button>
                      {variantCount < 5 && (
                        <button className="btn btn-sm" style={{background:'var(--violet)',color:'white'}} onClick={goNextVariant}>
                          ➕ Хувилбар
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="version-tab-strip">
                    {variants.map((v, idx) => (
                      <button key={idx} className={'version-tab' + (idx === activeVar ? ' active' : '')}
                        onClick={() => selectVariantTab(idx)}>
                        {v.label || alpha(idx)}
                        <span className="vtab-count">{(v.questions||[]).filter(q=>q.text).length}</span>
                      </button>
                    ))}
                    <div style={{marginLeft:'auto',display:'flex',gap:8}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setStep(1)}>{createPath === 'scan' ? '← Тохиргоо' : '← Буцах'}</button>
                      <button className="btn btn-green btn-sm" onClick={handlePublish} disabled={saving}>
                        {saving ? '⏳ ...' : editing ? '💾 Хадгалах' : '🚀 Нийтлэх'}
                      </button>
                    </div>
                  </div>

                  {showInlinePdf && (
                    <div className="inline-ai-panel">
                      {inlineParsing ? (
                        <div style={{textAlign:'center',padding:24}}><div className="spinner" /></div>
                      ) : (
                        <>
                          <input type="file" accept="application/pdf,.pdf" className="form-input" style={{marginBottom:8}}
                            onChange={(e) => { const f = e.target.files && e.target.files[0]; doInlinePdf(f); e.target.value = ''; }} />
                          <textarea className="form-textarea" style={{minHeight:120,fontFamily:'monospace',fontSize:'0.82rem'}}
                            value={inlineRaw} onChange={e => setInlineRaw(e.target.value)}
                            placeholder="PDF эсвэл текстийг paste..." />
                          {inlineErr && <div className="form-error">{inlineErr}</div>}
                          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
                            <button className="btn btn-outline btn-sm" onClick={() => setShowInlinePdf(false)}>Болих</button>
                            <button className="btn btn-violet btn-sm" onClick={doInlineParse} disabled={!inlineRaw.trim()}>✨ Бүгдийг задлах</button>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {!(currentVariant.questions || []).length && (
                    <div style={{marginBottom:12}}>
                      <button className="btn btn-outline" onClick={handleManual}>+ Хоосон асуулт нэмэх</button>
                    </div>
                  )}

                  <QuestionEditor
                    questions={currentVariant.questions || []}
                    defaultType={info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq'}
                    subjectFeatures={profile?.features || []}
                    onChange={(qs) => setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v))}
                  />
                </div>
              )}
            </div>
          )}
        </div>
      </div>
      </>
      )}
    </div>
  );
}


// ─── QR MODAL ─────────────────────────────────────────────────────────────────
function QRModal({ exam, onClose }) {
  const [step, setStep] = useState('confirm'); // confirm | addClass | qr
  const [classInput, setClassInput] = useState('');
  const [activeClassKey, setActiveClassKey] = useState('');
  const [classList, setClassList] = useState([]); // [{key,name}]
  const [savingClass, setSavingClass] = useState(false);
  const qrRef = useRef(null);
  const [joins, setJoins] = useState([]);
  const [variantCounts, setVariantCounts] = useState(null);
  const channelRef = useRef(null);
  const variantLabels = useMemo(() => getExamVariantLabels(exam), [exam]);
  const activeClassName = useMemo(() => {
    const hit = classList.find(c => c.key === activeClassKey);
    return hit?.name || displayClassName(activeClassKey, activeClassKey);
  }, [classList, activeClassKey]);

  const matchClass = useCallback((payload) => {
    if (!activeClassKey) return true;
    if (payload?.classKey) return payload.classKey === activeClassKey;
    const clsRaw = typeof payload === 'string' ? payload : (payload?.cls || '');
    const k = normalizeClassKey(clsRaw);
    return k === activeClassKey || (clsRaw || '').trim() === activeClassName;
  }, [activeClassKey, activeClassName]);

  const addJoin = useCallback((payload, id) => {
    if (!payload?.name || !matchClass(payload)) return;
    setJoins(prev => {
      const key = id || (payload.name + '|' + (payload.cls || '') + '|' + (payload.at || ''));
      if (prev.some(p => p.id === key)) return prev;
      return [{ id: key, name: payload.name, cls: payload.cls || activeClassName, at: payload.at || Date.now() }, ...prev].slice(0, 30);
    });
  }, [matchClass, activeClassName]);

  // Firebase: бүртгэлтэй ангиуд + сүүлийн ангиар шууд QR
  useEffect(() => {
    if (!exam?.id) return;
    const db = getDb();
    // Backfill clientPack so QR students load in 1 RTDB read
    try {
      const teacher = ensureTeacherAuth();
      if (db && teacher) {
        const versions = {};
        normalizeVariants(exam).forEach(v => {
          const qs = (v.questions || []).filter(q => (q.text || '').trim());
          if (qs.length) versions[v.label || 'A'] = packQuestions(qs);
        });
        if (Object.keys(versions).length) {
          ensureClientPackIfMissing(db, exam, teacher.uid, versions);
        }
      }
    } catch {}
    const lastKey = (() => { try { return localStorage.getItem(lastQrClassStorageKey(exam.id)); } catch { return ''; } })();
    if (!db) {
      if (lastKey) {
        setActiveClassKey(lastKey);
        setClassList([{ key: lastKey, name: displayClassName(lastKey, lastKey) }]);
        setStep('qr');
      }
      return;
    }
    const ref = roomRef(db, exam.id).child('classes');
    const handler = ref.on('value', snap => {
      const val = snap.val() || {};
      const list = Object.entries(val).map(([key, v]) => ({
        key,
        name: (v && v.name) ? v.name : key
      })).sort((a, b) => a.name.localeCompare(b.name, 'mn'));
      setClassList(list);
      const pick = (lastKey && list.some(c => c.key === lastKey)) ? lastKey : (list[0]?.key || '');
      if (pick) {
        setActiveClassKey(pick);
        setStep('qr');
      }
    });
    return () => { try { ref.off('value', handler); } catch {} };
  }, [exam?.id]);

  const goQrForClass = useCallback(async (name) => {
    setSavingClass(true);
    try {
      const reg = await registerExamClass(exam.id, name);
      setActiveClassKey(reg.key);
      setClassInput('');
      setStep('qr');
    } catch (e) {
      alert(e.message || 'Алдаа');
    } finally {
      setSavingClass(false);
    }
  }, [exam?.id]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    try {
      const bc = new BroadcastChannel('se_join_' + exam.id + '_' + activeClassKey);
      channelRef.current = bc;
      bc.onmessage = (ev) => {
        if (ev?.data?.type === 'JOIN') addJoin(ev.data.payload, ev.data.payload?.id);
      };
      return () => { try { bc.close(); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    const db = getDb();
    if (!db) return;
    setJoins([]);
    try {
      const ref = roomRef(db, exam.id).child('joins').limitToLast(80);
      const onAdd = ref.on('child_added', snap => addJoin(snap.val(), snap.key));
      return () => { try { ref.off('child_added', onAdd); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey || variantLabels.length < 2) { setVariantCounts(null); return; }
    const db = getDb();
    if (!db) return;
    try {
      const ref = roomRef(db, exam.id).child('variantAllocator').child(activeClassKey).child('counts');
      const handler = ref.on('value', snap => setVariantCounts(snap.val() || {}));
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, variantLabels.length]);

  useEffect(() => {
    if (step !== 'qr' || !qrRef.current || !activeClassKey) return;
    qrRef.current.innerHTML = '';
    try {
      const base = window.location.origin + window.location.pathname;
      const packed = packExamForQR(exam, activeClassKey);
      const data = LZString.compressToEncodedURIComponent(JSON.stringify(packed));
      const url = base + '#qr=' + data;
      new QRCode(qrRef.current, {
        text: url,
        width: 240, height: 240,
        colorDark: '#1e293b', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch(e) { qrRef.current.innerHTML = '<div style="color:red">QR үүсгэхэд алдаа гарлаа</div>'; }
  }, [step, activeClassKey, exam?.id]);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        {step === 'confirm' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 QR код үүсгэх</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.95rem',marginBottom:12}}>
                <strong>"{exam.title}"</strong> шалгалтын QR кодыг үүсгэх үү?
              </div>
              <div style={{fontSize:'0.85rem',color:'var(--text2)',lineHeight:1.7,marginBottom:16}}>
                Сурагчид QR уншуулахад зөвхөн <strong>нэр</strong> бичнэ.<br/>
                Ангиа багш энд томилно.
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 7а, 8б, 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={onClose}>Болих</button>
              <button
                className="btn btn-primary"
                disabled={!classInput.trim() || savingClass}
                onClick={() => goQrForClass(classInput)}
              >
                {savingClass ? '⏳ ...' : '✓ Тийм, үүсгэх'}
              </button>
            </div>
          </>
        ) : step === 'addClass' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>➕ Өөр анги</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.85rem',color:'var(--text2)',marginBottom:14,lineHeight:1.6}}>
                Ижил шалгалтын материалаар өөр ангид QR үүсгэнэ (жн: 9а).
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={() => { setClassInput(''); setStep(activeClassKey ? 'qr' : 'confirm'); }}>Болих</button>
              <button className="btn btn-primary" disabled={!classInput.trim() || savingClass} onClick={() => goQrForClass(classInput)}>
                ✓ QR үүсгэх
              </button>
            </div>
          </>
        ) : (
          <>
            <div className="modal-head" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div>
                <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 {exam.title}</div>
                <div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:4}}>
                  <span style={{background:'var(--violet-light)',color:'var(--violet)',padding:'3px 10px',borderRadius:20,fontWeight:800}}>
                    {activeClassName} анги
                  </span>
                  {' '}· Сурагч зөвхөн нэрээ бичнэ
                </div>
              </div>
              <button className="btn btn-outline btn-sm" style={{flexShrink:0}} onClick={() => { setClassInput(''); setStep('addClass'); }}>
                Өөр анги
              </button>
            </div>
            <div className="modal-body" style={{textAlign:'center',padding:'28px 24px'}}>
              <div className="qr-wrap" style={{marginBottom:16}}>
                <div ref={qrRef} />

              {classList.length > 1 && (

                  {classList.map(c => (
                    <button

                      {c.name}

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,margin:'0 auto 10px',maxWidth:360}}>

              {joins.length > 0 && (

              <div style={{fontSize:'0.82rem',color:'var(--text2)',marginTop:8}}>
                  ❓ {(() => { const vs = exam?.versions; if (vs && typeof vs === 'object') { const v = Object.values(vs); return v.length > 0 ? (v[0]||[]).length : 0; } return (normalizeVariants(exam)[0]?.questions||[]).length; })()} асуулт &nbsp;·&nbsp; ⏱ {durationLabel(exam.duration)}

// ─── CHEAT DETAIL MODAL ───────────────────────────────────────────────────────
const SCORE_MODE_LABEL = { best: 'Хамгийн өндөр дүнгээр', avg: 'Дундажаар', last: 'Сүүлийн дүнгээр' };
const answeredCount = (s) => Object.keys(s.answers || {}).filter((k) => s.answers[k] != null && s.answers[k] !== '').length;
const subStudentKey = (s) => s.uid || ((s.studentName || '') + '|' + (s.studentClass || ''));
const isRetrySub = (s) => s.mode === 'mistakes' || (Array.isArray(s.subset) && s.subset.length > 0);
// Алдсан асуултаа дахин ажилласан оролдлогыг (өмнө нь 1/15=7% гэж буруу хадгалагдсан ч) таньж тэмдэглэнэ
const markRetryAttempts = (subs) => {
  const byKey = {};
  (subs || []).forEach((s) => { (byKey[subStudentKey(s)] = byKey[subStudentKey(s)] || []).push(s); });
  return (subs || []).map((s) => {
    if (isRetrySub(s)) return { ...s, mode: 'mistakes' };
    const grp = byKey[subStudentKey(s)] || [];
    if (grp.length < 2) return s;
    const maxAns = Math.max(...grp.map(answeredCount));
    const biggest = grp.find((x) => answeredCount(x) === maxAns);
    if (maxAns >= 4 && s !== biggest && answeredCount(s) > 0 && answeredCount(s) <= maxAns * 0.25) return { ...s, mode: 'mistakes' };
    return s;
  });
};
// Сурагч бүрийг нэг мөр болгож, багшийн сонгосон горимоор (best/avg/last) эцсийн дүнг тооцно
const groupByStudent = (subs, mode) => {
  const map = new Map();
  (subs || []).forEach((s) => { const k = subStudentKey(s); if (!map.has(k)) map.set(k, []); map.get(k).push(s); });
  return [...map.entries()].map(([key, list]) => {
    const attempts = list.slice().sort((x, y) => (x.submittedAt || '').localeCompare(y.submittedAt || ''));
    const full = attempts.filter((x) => !isRetrySub(x));
    const base = full.length ? full : attempts;
    let score, ref;
    if (mode === 'avg') { score = Math.round(base.reduce((t, x) => t + (x.score || 0), 0) / base.length); ref = base[base.length - 1]; }
    else if (mode === 'last') { ref = base[base.length - 1]; score = ref.score || 0; }
    else { ref = base.reduce((bst, x) => ((x.score || 0) > (bst.score || 0) ? x : bst), base[0]); score = ref.score || 0; }
    return { key, name: attempts[0].studentName, cls: attempts[0].studentClass || '', attempts, fullCount: full.length, score, ref };
  }).sort((x, y) => y.score - x.score);
};

// Хуудсаас (мм) хэсэг тайрч, бэлтгэнэ. warped: 4px/мм, эхлэл = зүүн дээд тэмдгийн төв (14,14)мм
const zgCropMM = (warped, x0, y0, x1, y1, k) => {
  const sx = (x0 - 14) * 4, sy = (y0 - 14) * 4, sw = (x1 - x0) * 4, sh = (y1 - y0) * 4;
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d', { willReadFrequently: true }); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(warped, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data; let lo = 255, dark = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; if (l < lo) lo = l; n++; }
  const thr = Math.min(150, 255 - (255 - lo) * 0.45); // тод бус үзэг/харандааг ч барина
  for (let i = 0; i < d.length; i += 4) { const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; if (l < thr && lo < 170) dark++; }
  return { url: c.toDataURL('image/jpeg', 0.92), ink: dark / Math.max(1, n) };
};

  const [choices, setChoices] = useState(5);
  const [vi, setVi] = useState(0);
  const [over, setOver] = useState(() => { try { return JSON.parse(localStorage.getItem(lsKey) || '{}') || {}; } catch { return {}; } });
  const scansKey = 'se_zgscans_' + exam.id;
  const [scans, setScans] = useState(() => { try { return (JSON.parse(localStorage.getItem(scansKey) || '[]') || []).map(x => ({ ...x, reading: false })); } catch { return []; } });
  const [zgClass, setZgClass] = useState(() => { try { return localStorage.getItem('se_zg_cls_' + exam.id) || ''; } catch { return ''; } });
  const [myClasses, setMyClasses] = useState([]);
  const [viewId, setViewId] = useState(null);
  const [zgKind, setZgKind] = useState('');
  const [zgMembers, setZgMembers] = useState([]);
  useEffect(() => { try { localStorage.setItem('se_zg_cls_' + exam.id, zgClass); } catch {} }, [zgClass]);
  useEffect(() => {
    const slim = scans.filter(x => x.grade).map(x => ({ id: x.id, name: x.name, cls: x.cls, file: x.file, vi: x.vi, grade: x.grade, previewUrl: x.previewUrl, saved: x.saved, classMsg: x.classMsg, subId: x.subId, at: x.at }));
    try { localStorage.setItem(scansKey, JSON.stringify(slim)); }
    catch { try { localStorage.setItem(scansKey, JSON.stringify(slim.map(x => ({ ...x, previewUrl: '' })))); } catch {} }
  }, [scans]);
  useEffect(() => {
    const db = getDb(), u = getAuth()?.currentUser?.uid; if (!db || !u) return;
    db.ref('classes').orderByChild('teacherUid').equalTo(u).once('value').then(sn => setMyClasses(Object.entries(sn.val() || {}).map(([id, v]) => ({ id, name: v.name })))).catch(() => {});
  }, []);
  const clsHit = myClasses.find(c => zgNorm(c.name) === zgNorm(zgClass));
  useEffect(() => {
    const db = getDb(); if (!db || !clsHit) { setZgMembers([]); return; }
    db.ref('classMembers/' + clsHit.id).once('value').then(sn => setZgMembers(Object.values(sn.val() || {}).map(m => m.name).filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), 'mn')))).catch(() => setZgMembers([]));
  }, [clsHit && clsHit.id]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [camOn, setCamOn] = useState(false);
  const [big, setBig] = useState(null);
  const [pDate, setPDate] = useState('');
  const [pName, setPName] = useState('');
  const [pClass, setPClass] = useState('');
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  const letters = ['A','B','C','D','E'].slice(0, choices);
  const autoKey = (vIdx) => {
    const km = {};
    objQs(variants[vIdx]).slice(0, qCount).forEach((q, i) => {
      const a = String(q.answer || '').trim().toUpperCase().charAt(0);
      if ('ABCDE'.indexOf(a) >= 0 && a) km[i + 1] = a;
    });
    return km;
  };
  const keyFor = (vIdx) => {
    const km = autoKey(vIdx);
    for (let n = 1; n <= qCount; n++) { const o = over[vIdx + ':' + n]; if (o) km[n] = o; }
    return km;
  };
  const curKey = keyFor(vi);
  const keyedCount = Object.keys(curKey).length;
  const objList = objQs(variants[vi]).slice(0, qCount);

  useEffect(() => { try { localStorage.setItem(lsKey, JSON.stringify(over)); } catch {} }, [over]);
  useEffect(() => { try { localStorage.setItem('se_zg_pos', sheetPos); localStorage.setItem('se_zg_after', String(sheetAfter)); } catch {} }, [sheetPos, sheetAfter]);
  useEffect(() => { try { localStorage.setItem('se_zg_lay', JSON.stringify(lay)); } catch {} }, [lay]);
  useEffect(() => () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); }, []);

  // Түлхүүр өөрчлөгдөхөд скан хийсэн бүх хуудсыг дахин дүгнэнэ
  useEffect(() => {
    if (!scans.some(s => s.res)) return;
    setScans(list => list.map(sc => {
      if (!sc.res) return sc;
      const out = window.ZG.regrade(sc.res, keyFor(sc.vi));
      return { ...sc, res: out, grade: out.grade, previewUrl: zgThumb(out.preview) };
    }));
  }, [over, qCount]);

  const setKey = (n, k) => setOver(p => ({ ...p, [vi + ':' + n]: p[vi + ':' + n] === k ? '' : k }));
  const resetKey = () => setOver(p => { const q = {}; Object.keys(p).forEach(k => { if (k.split(':')[0] !== String(vi)) q[k] = p[k]; }); return q; });

  const runImage = async (img, name) => {
    await new Promise(r => setTimeout(r, 30));
    const id = uid();
    try {
      const out = window.ZG.process(img, qCount, choices, keyFor(vi));
      setScans(l => [{ id, name: '', cls: zgClass, at: new Date().toISOString(), file: name, vi, res: out, grade: out.grade, previewUrl: zgThumb(out.preview), saved: false, reading: true }, ...l]);
      autoName(id, out.warped);
    } catch (e) {
      setScans(l => [{ id, file: name, error: e?.message || 'Алдаа', vi }, ...l]);
    }
  };
  const fromFiles = async (fl) => {
    const files = Array.from(fl || []);
    if (!files.length) return;
    if (!window.ZG) { setErr('ZipGrade модуль ачаалагдаагүй. Хуудсыг дахин ачаална уу.'); return; }
    setBusy(true); setErr('');
    for (const f of files) {
      try { await runImage(await window.ZG.loadImageFile(f), f.name); }
      catch (e) { setErr(e?.message || 'Зураг'); }
    }
    setBusy(false);
  };
  const stopCam = () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; setCamOn(false); };
  const startCam = async () => {
    setErr('');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      streamRef.current = stream; setCamOn(true);
      setTimeout(() => { if (videoRef.current) videoRef.current.srcObject = stream; }, 40);
    } catch (e) { setErr('Камер нээгдсэнгүй: ' + (e?.message || '')); }
  };
  const capture = async () => {
    const v = videoRef.current; if (!v) return;
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const img = new Image();
    img.onload = async () => { setBusy(true); await runImage(img, 'camera'); setBusy(false); };
    img.src = c.toDataURL('image/jpeg', 0.92);
  };

  const autoName = async (id, warped) => {
    setScans(l => l.map(x => x.id === id ? { ...x, reading: true, nameErr: '' } : x));
    try {
      const r = await zgReadName(warped);
      setScans(l => l.map(x => x.id === id ? { ...x, reading: false, nameUrl: r.nameUrl, name: x.name || r.name, cls: x.cls || r.cls, nameErr: (!r.name && !r.cls) ? 'Нэр бичсэн харагдсангүй' : '' } : x));
    } catch (e) {
      setScans(l => l.map(x => x.id === id ? { ...x, reading: false, nameErr: 'Нэр уншиж чадсангүй: ' + (e?.message || '') } : x));
    }
  };
  const upd = (id, patch) => setScans(l => l.map(s => s.id === id ? { ...s, ...patch } : s));
  const changeVariant = (sc, nvi) => {
    const out = window.ZG.regrade(sc.res, keyFor(nvi));
    upd(sc.id, { vi: nvi, res: out, grade: out.grade, previewUrl: zgThumb(out.preview) });
  };
  const pushToClass = async (sc, subId) => {
    const cname = String(sc.cls || '').trim(); if (!cname) return 'Анги заагаагүй — зөвхөн жагсаалтад';
    const nm = sanitizeText(sc.name || '', 80); if (!nm) return 'Нэргүй тул ангид оруулсангүй';
    const db = getDb(), u = getAuth()?.currentUser?.uid; if (!db || !u) return 'Нэвтрээгүй — ангид оруулсангүй';
    try {
      const list = Object.entries((await db.ref('classes').orderByChild('teacherUid').equalTo(u).once('value')).val() || {});
      const hit = list.find(([, c]) => zgNorm(c.name) === zgNorm(cname));
      if (!hit) return '«' + cname + '» анги олдсонгүй — зөвхөн жагсаалтад';
      const [cid, c] = hit, iso = new Date().toISOString(), assign = c.assignments || {};
      const mem = (await db.ref('classMembers/' + cid).once('value')).val() || {};
      let sid = Object.keys(mem).find(k => zgNorm(mem[k].name) === zgNorm(nm));
      if (!sid) { sid = 'zg_' + zgHash(nm); await db.ref('classMembers/' + cid + '/' + sid).set({ name: nm, at: iso, manual: true }); }
      // Шалгалт: ангид оноосон шалгалтын баганад нийлнэ; Дасгал: шалгалтаас тусдаа багана
      let rid = exam.id;
      if (zgKind === 'practice') rid = 'zg_' + exam.id + '_p';
      else if (!(assign[exam.id] && (assign[exam.id].kind || 'exam') === 'exam')) rid = 'zg_' + exam.id + '_e';
      if (!assign[rid]) await db.ref('classes/' + cid + '/assignments/' + rid).set({ title: (exam.title || '') + (zgKind === 'practice' ? ' (дасгал)' : ''), kind: zgKind, at: iso, ...(rid !== exam.id ? { zgOnly: true } : {}) });
      const rec = { name: nm, at: iso, score: sc.grade.score, sec: 0, mode: 'full', extra: false, source: 'zipgrade' };
      try { await db.ref('classResults/' + cid + '/' + rid + '/' + sid + '/' + subId).set(rec); }
      catch (e1) { await db.ref('classes/' + cid + '/zg/' + rid + '/' + sid + '/' + subId).set({ name: nm, at: iso, score: sc.grade.score, sec: 0, mode: 'full', extra: false, source: 'zipgrade' }); }
      let imgOk = true;
      try { await db.ref('zgScans/' + cid + '/' + rid + '/' + sid + '/' + subId).set({ img: sc.previewUrl || '', score: sc.grade.score, correct: sc.grade.correct, wrong: sc.grade.wrong, blank: sc.grade.blank, at: iso, name: nm, detail: sc.grade.detail.map(d => [d.n, d.got || '', d.want || '', d.status]) }); } catch { imgOk = false; }
      return '✓ «' + c.name + '» ангид (' + (zgKind === 'practice' ? 'дасгал' : 'шалгалт') + ') орлоо' + (imgOk ? '' : ' · зураг хадгалагдсангүй');
    } catch (e) { return 'Ангид оруулж чадсангүй: ' + (e?.message || ''); }
  };
  const saveScan = async (sc, idx) => {
    if (!sc.grade || !onSaveSubmission || !zgKind || !String(sc.name || '').trim()) return;
    const v = variants[sc.vi] || variants[0];
    const qs = objQs(v).slice(0, qCount);
    const answers = {};
    qs.forEach((q, i) => { const d = sc.grade.detail[i]; if (d && d.got) answers[q.id] = d.got; });
    const subId = uid();
    onSaveSubmission({
      id: subId, examId: exam.id, studentName: sanitizeText(sc.name || ('ZipGrade ' + (scans.length - idx)), 80), studentClass: sanitizeText(sc.cls || '', 40),
      score: sc.grade.score, correctCount: sc.grade.correct, totalCount: sc.grade.total, answers,
      submittedAt: new Date().toISOString(), gradedBy: 'omr', verified: true, cheatLog: [], timeSpentSec: 0, variantLabel: v.label || 'A'
    });
    upd(sc.id, { saved: true, classMsg: 'Хадгалж байна...', subId });
    const msg = await pushToClass(sc, subId);
    upd(sc.id, { classMsg: msg });
    if (/чадсангүй/.test(msg)) alert(msg);
  };
  const dlXLSX = () => {
    const list = okScans.slice().reverse();
    if (typeof XLSX === 'undefined') { dlCSV(); return; }
    const rows = [['№', 'Нэр', 'Анги', 'Хувилбар', 'Дүн %', 'Зөв', 'Буруу', 'Хоосон', 'Давхар']].concat(list.map((x, i) => [i + 1, x.name || '', x.cls || '', variants[x.vi]?.label || 'A', x.grade.score, x.grade.correct, x.grade.wrong, x.grade.blank, x.grade.multi]));
    const qn = Math.max(0, ...list.map(x => x.grade.detail.length));
    const det = [['Нэр', 'Анги', ...Array.from({ length: qn }, (_, i) => String(i + 1))]].concat(list.map(x => [x.name || '', x.cls || '', ...x.grade.detail.map(d => d.got || '—')]));
    const wb = XLSX.utils.book_new();
    const w1 = XLSX.utils.aoa_to_sheet(rows); w1['!cols'] = [5, 26, 10, 10, 8, 7, 8, 8, 8].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, w1, 'Дүн');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Хариултууд');
    XLSX.writeFile(wb, String(exam.title || 'zipgrade').replace(/[\\/:*?"<>|\s]+/g, '_') + '_zipgrade.xlsx');
  };
  const retryClass = async (sc) => {
    if (!zgKind) { alert('Эхлээд «Шалгалт» эсвэл «Дасгал» гэдгийг сонгоно уу'); return; }
    upd(sc.id, { classMsg: 'Илгээж байна...' });
    const msg = await pushToClass(sc, sc.subId || uid());
    upd(sc.id, { classMsg: msg });
    if (!/^✓/.test(msg)) alert(msg);
  };
  const saveAll = async () => {
    if (!zgKind) { alert('Эхлээд «Шалгалт» эсвэл «Дасгал» гэдгийг сонгоно уу'); return; }
    const todo = scans.map((sc, i) => [sc, i]).filter(([sc]) => sc.grade && !sc.saved);
    const noName = todo.filter(([sc]) => !String(sc.name || '').trim());
    if (noName.length && !confirm(noName.length + ' сурагчийн нэр хоосон байна. Нэргүйг алгасаад бусдыг хадгалах уу?')) return;
    for (const [sc, i] of todo) if (String(sc.name || '').trim()) await saveScan(sc, i);
  };
  const okScans = scans.filter(s => s.grade);
  const avg = okScans.length ? Math.round(okScans.reduce((a, s) => a + s.grade.score, 0) / okScans.length) : null;

  const printHTML = (html) => {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(fr);
    fr.contentDocument.open(); fr.contentDocument.write(html); fr.contentDocument.close();
    const imgs = Array.from(fr.contentDocument.images || []).filter(i => !i.complete);
    const ready = Promise.race([Promise.all(imgs.map(i => new Promise(r => { i.onload = i.onerror = r; }))), new Promise(r => setTimeout(r, 4000))]);
    ready.then(() => setTimeout(() => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) {} setTimeout(() => fr.remove(), 4000); }, 250));
  };
  const layClamp = (l) => { const k = l.scale / 100; return { ...l, x: Math.max(0, Math.min(210 * (1 - k), l.x)), y: l.mode === 'flow' ? 0 : Math.max(0, Math.min(297 * (1 - k), l.y)) }; };
  const sheetMarkup = (vIdx, fill) => {
    const L = layClamp(lay), k = L.scale / 100;
    const svg = window.ZG.sheetSVG({ qCount, choices, title: exam.title, variant: variants[vIdx]?.label, studentName: fill ? 'ЗӨВ ХАРИУЛТЫН ХУУДАС' : pName, studentClass: pClass, date: pDate, fill: fill ? keyFor(vIdx) : null });
    if (L.mode === 'flow' && !fill) return '<div class="sheetflow" style="width:' + (210 * k).toFixed(2) + 'mm;height:' + (297 * k).toFixed(2) + 'mm;margin:3mm 0 3mm ' + L.x.toFixed(2) + 'mm">' + svg + '</div>';
    return '<div class="sheet"><div style="width:210mm;height:297mm;transform-origin:0 0;transform:translate(' + L.x.toFixed(2) + 'mm,' + L.y.toFixed(2) + 'mm) scale(' + k + ')">' + svg + '</div></div>';
  };
  const flowMode = lay.mode === 'flow';
  const printSVG = (fill) => {
    if (!window.ZG) return;
    printHTML('<!doctype html><html><head><meta charset="utf-8"><title>ZipGrade</title><style>' + ZG_PAPER_CSS + '</style></head><body>' + sheetMarkup(vi, fill) + '</body></html>');
  };
  const qHTML = (q, label, prevSrc) => {
    const t = q.type || 'mcq', out = [];
    const src = String(q.sourceText || '').trim();
    if (src && src !== prevSrc) out.push('<div class="src">' + window.seMathHTML(src) + '</div>');
    out.push('<div class="qt"><span class="qn">' + zgEsc(label) + '.</span><span class="qx">' + window.seMathHTML(q.text || '') + '</span></div>');
    const im = zgImg(q.imageUrl); if (im) out.push('<img src="' + im + '" alt="">');
    if (t === 'match') {
      out.push('<div class="opts c1">' + (q.left || []).map((l, i) => '<div><b>' + (i + 1) + '.</b>' + zgEsc(l) + '</div>').join('') + '</div>');
      out.push('<div class="opts c2">' + (q.options || []).map((o, i) => '<div><b>' + zgEsc(o.key || 'ABCDEFGH'[i]) + '.</b>' + window.seMathHTML(o.text) + '</div>').join('') + '</div>');
      out.push('<div class="ans">Хариу: ______________________</div>');
    } else if (t === 'mcq' || t === 'tf') {
      const os = q.options || [], long = os.some(o => String(o.text || '').length > 28);
      out.push('<div class="opts ' + (long ? 'c1' : 'c2') + '">' + os.map((o, i) => '<div><b>' + zgEsc(o.key || alpha(i)) + '.</b>' + window.seMathHTML(o.text) + '</div>').join('') + '</div>');
    } else if (t === 'open') {
      out.push('<div class="lines"><i></i><i></i><i></i><i></i></div>');
    } else {
      out.push('<div class="ans">Хариу: ______________________' + (q.unit ? ' ' + zgEsc(q.unit) : '') + '</div>');
    }
    return '<div class="q">' + out.join('') + '</div>';
  };
  const paperParts = (vIdx) => {
    const v = variants[vIdx], qs = v.questions || [], items = [];
    let on = 0, wn = 0, prevSrc = '';
    qs.forEach(q => {
      const label = zgIsObj(q) ? String(++on) : 'Б' + (++wn);
      items.push(qHTML(q, label, prevSrc)); prevSrc = String(q.sourceText || '').trim();
    });
    return items;
  };
  const sheetWhere = (n) => sheetPos === 'start' ? 'эхний хуудсанд' : sheetPos === 'after' ? (n + '-р асуултын дараах хуудсанд') : 'сүүлийн хуудсанд';
  const printPaper = () => {
    if (!window.ZG) return;
    const idxs = allVariants ? variants.map((_, i) => i) : [vi];
    const body = idxs.map(vIdx => {
      const v = variants[vIdx], items = paperParts(vIdx), total = items.length;
      const cut = sheetPos === 'start' ? 0 : sheetPos === 'after' ? Math.max(0, Math.min(total, sheetAfter)) : total;
      const hd = '<div class="hd"><div class="t">' + zgEsc(exam.title || 'Шалгалт') + '</div><div class="m">' + zgEsc([exam.subject, variants.length > 1 ? 'Хувилбар ' + (v.label || 'A') : '', total + ' асуулт', exam.duration ? durationLabel(exam.duration) : ''].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="who"><span>Нэр:</span><span>Анги:</span><span>Огноо:</span></div>' +
        (sheetPos !== 'none' ? '<div class="note">Хариултаа ' + (flowMode ? 'энэ хуудсан дээрх' : sheetWhere(cut)) + ' хариултын хуудсанд бөглөнө үү.</div>' : '') + '</div>';
      const a = items.slice(0, cut).join(''), b = items.slice(cut).join('');
      let h = '<div class="variant">';
      if (sheetPos === 'none') h += '<div class="paper">' + hd + items.join('') + '</div>';
      else if (flowMode) h += '<div class="paper">' + hd + a + sheetMarkup(vIdx) + b + '</div>';
      else {
        if (cut === 0) h += sheetMarkup(vIdx) + '<div class="paper">' + hd + b + '</div>';
        else h += '<div class="paper">' + hd + a + '</div>' + sheetMarkup(vIdx) + (b ? '<div class="paper">' + b + '</div>' : '');
      }
      return h + '</div>';
    }).join('');
    printHTML('<!doctype html><html><head><meta charset="utf-8"><title>' + zgEsc(exam.title || 'Шалгалт') + '</title><style>' + ZG_PAPER_CSS + '</style></head><body>' + body + '</body></html>');
  };

  const dlCSV = () => {
    const rows = [['№', 'Нэр', 'Анги', 'Хувилбар', 'Дүн %', 'Зөв', 'Буруу', 'Хоосон', 'Давхар']].concat(
      okScans.slice().reverse().map((s, i) => [i + 1, s.name || '', s.cls || '', variants[s.vi]?.label || 'A', s.grade.score, s.grade.correct, s.grade.wrong, s.grade.blank, s.grade.multi]));
    downloadCSV((exam.title || 'zipgrade') + '_zipgrade.csv', rows);
  };

  const viewSc = scans.find(x => x.id === viewId && x.grade);
  const nameNote = (sc) => {
    if (!String(sc.name || '').trim()) return { t: '⚠ Нэр оруулна уу', c: 'var(--red)' };
    if (clsHit && zgNorm(sc.cls) === zgNorm(clsHit.name)) return zgMembers.some(m => zgNorm(m) === zgNorm(sc.name)) ? { t: '✓ Ангийн сурагч', c: 'var(--green)' } : { t: '⚠ Ангид байхгүй — шинэ сурагчаар нэмэгдэнэ', c: 'var(--amber)' };
    return null;
  };
  const tabBtn = (id, lbl) => <button key={id} className={'btn btn-sm' + (tab === id ? ' btn-violet' : ' btn-outline')} onClick={() => setTab(id)}>{lbl}</button>;
  const stat = (v, l, c) => <div className="stat-card"><div className="stat-val" style={c ? { color: c } : null}>{v}</div><div className="stat-lbl">{l}</div></div>;

  return (
    <div>
      <div className="page-header">
        <div className="container-lg">
          <h2 className="page-title">⬛ ZipGrade — {exam.title}</h2>
          <div className="page-sub">Хариултын хуудас хэвлэх · сурагчийн бөглөсөн хуудсыг скан хийж шууд дүгнэх</div>
        </div>
      </div>
      {viewSc && (
        <div className="modal-overlay" onClick={() => setViewId(null)}>
          <div className="modal" style={{ maxWidth: 640 }} onClick={e => e.stopPropagation()}>
            <div className="modal-head"><div style={{ fontWeight: 800 }}>ZipGrade · {viewSc.grade.score}%</div><button className="btn btn-ghost btn-sm" onClick={() => setViewId(null)}>✕</button></div>

          <div className="form-row">

              </div>
              <div className="form-group">
                <label className="form-label">Анги (эхлээд оруулна)</label>
                <input className="form-input" list="zg-cls" placeholder="Жишээ: 12А" value={zgClass} onChange={e => { const v = e.target.value; setZgClass(v); setScans(l => l.map(x => x.cls ? x : { ...x, cls: v })); }} />

                <datalist id="zg-mem">{zgMembers.map(m => <option key={m} value={m} />)}</datalist>

              {camOn && <div className="zg-preview-wrap" style={{ marginBottom: 12 }}><video ref={videoRef} autoPlay playsInline /></div>}
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>

                <label className="btn btn-outline" style={{ cursor: 'pointer' }}>
                  📁 Зураг оруулах

                </label>
              </div>
              {busy && <div className="parsing-overlay" style={{ padding: '18px 8px' }}><div className="spinner" /><div>Хуудсыг тэгшилж, дугуйг уншиж байна...</div></div>}
              {err && <div className="form-error">⚠ {err}</div>}
              {okScans.length > 0 && (
                <div className="stats-strip" style={{ marginTop: 10 }}>
                  {stat(okScans.length, 'Скан хийсэн')}
                  {stat(avg + '%', 'Дундаж', 'var(--green)')}
                </div>
              )}
              {scans.length > 0 && (
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', margin: '8px 0 12px' }}>
                  <button className="btn btn-green btn-sm" onClick={saveAll} disabled={!okScans.some(s => !s.saved)}>💾 Бүгдийг «Үр дүн»-д хадгалах</button>

                  <button className="btn btn-ghost btn-sm" onClick={dlCSV} disabled={!okScans.length}>CSV</button>

                </div>
              ) : (
                <div key={sc.id} className="zgrow" role="button" tabIndex={0} onClick={() => setViewId(sc.id)} onKeyDown={e => { if (e.key === 'Enter') setViewId(sc.id); }}>
                  <div className="zgrow-main">

                    <div className="zgrow-sub">{sc.cls || 'Анги —'}{sc.saved ? ' · ' + (sc.classMsg || 'Хадгалсан') : (nameNote(sc) && nameNote(sc).c !== 'var(--green)' ? ' · ' + nameNote(sc).t : '')}</div>
                  </div>
                  <div className="zgrow-score" style={{ color: sc.grade.score >= (exam.passingScore || 50) ? 'var(--green)' : 'var(--red)' }}>{sc.grade.score}%</div>
                  <span className="zgrow-go">›</span>
                </div>
              ))}
            </div>
          )}

          {tab === 'key' && (
            <div>
              <div className="form-hint" style={{ marginBottom: 10 }}>
                Түлхүүр нь тест дээр оруулсан зөв хариултаас <b>автоматаар</b> орж ирнэ. Хэрэв буруу/дутуу бол энд товчдож засна — скан хийсэн бүх хуудас шууд дахин дүгнэгдэнэ.
                Түлхүүртэй: <b>{keyedCount}</b>/{qCount}.
              </div>
              <button className="btn btn-outline btn-sm" style={{ marginBottom: 12 }} onClick={resetKey}>↺ Тестээс дахин авах</button>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(300px,1fr))', gap: 8 }}>
                {Array.from({ length: qCount }, (_, i) => i + 1).map(n => {
                  const q = objList[n - 1];
                  const edited = !!over[vi + ':' + n];
                  return (
                    <div key={n} className="answer-select-row" style={{ margin: 0, flexWrap: 'wrap' }}>
                      <span className="answer-label" style={{ minWidth: 28 }}>{n}</span>
                      {letters.map(k => (
                        <button key={k} className={'ans-btn' + (curKey[n] === k ? ' selected' : '')} onClick={() => setKey(n, k)}>{k}</button>
                      ))}
                      {edited && <span title="Гараар зассан" style={{ fontSize: '0.75rem', color: 'var(--amber)' }}>✎</span>}
                      {!curKey[n] && <span style={{ fontSize: '0.75rem', color: 'var(--red)' }}>хариу алга</span>}

              </div>
            </div>
          )}

          {tab === 'print' && (
            <div>
              <div className="form-hint" style={{ marginBottom: 10 }}>
